<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wraparound</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b23;
    --panel-2: #1f2430;
    --line: #2a3140;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #6cb8ff;
    --warn: #ffb547;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #app { display: flex; height: 100vh; }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { width: 340px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .lenses { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .lens { display: flex; align-items: center; gap: 6px; text-align: left; padding: 7px 8px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font: inherit; font-size: 12.5px; cursor: pointer; }
  .lens kbd { font: 11px Menlo, Consolas, monospace; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px; }
  .lens.on { border-color: var(--accent); background: #1d2b3d; }
  .lens.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .chap { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid #2d4766;
    border-radius: 999px; padding: 1px 8px; margin-bottom: 8px; }
  .formula { font: 13px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin: 6px 0 10px; white-space: pre-wrap; color: #cfe6ff; }
  .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 4px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin: 2px 0; }
  .try { color: var(--warn); }
  .live { font: 12.5px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin-top: 6px; white-space: pre; overflow-x: auto; min-height: 3em; }
  .controls { margin-top: 8px; display: grid; gap: 6px; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls input[type=range] { flex: 1; }
  .help { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  .help b { color: var(--text); }
  @media (max-width: 820px) {
    #app { flex-direction: column; height: auto; }
    #stage { flex: none; height: 62vh; }
    #panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
  <aside id="panel">
    <h1>Wraparound</h1>
    <p class="sub">Clear five waves of asteroids in an arena with no edges. Leave on one side and you come back on the other, thanks to modular arithmetic.</p>
    <div class="lenses" id="lenses"></div>
    <div class="card" id="card"></div>
    <div class="help">
      <b>Turn</b> A/D or ←/→ · <b>Thrust</b> W or ↑ · <b>Fire</b> Space ·
      <b>Lenses</b> keys 1–5 · <b>Restart</b> R · <b>Pause</b> P
    </div>
  </aside>
</div>

<script>
(() => {
  // ---------- Integer and modular helpers (this chapter) ----------
  const settings = { trueMod: true };
  const rem = (a, n) => a % n;                           // remainder: takes the sign of a
  const tmod = (a, n) => ((a % n) + n) % n;              // true modulo: always 0 … n − 1
  const mod = (a, n) => settings.trueMod ? tmod(a, n) : rem(a, n);
  const wrapDelta = (d, size) => mod(d + size / 2, size) - size / 2;   // shortest way across the seam
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const rand = (a, b) => a + Math.random() * (b - a);
  const f0 = n => Math.round(n).toString();
  const f1 = n => (Math.abs(n) < 0.05 ? 0 : n).toFixed(1);
  const f2 = n => (Math.abs(n) < 0.005 ? 0 : n).toFixed(2);
  const pad2 = n => String(n).padStart(2, '0');
  const RAD = Math.PI / 180;

  // ---------- Constants (the chapter quotes these) ----------
  const WORLD = { w: 960, h: 640 };
  const TURN = 270;            // degrees per second
  const THRUST = 320, MAX_SPEED = 380, DRAG = 0.5;
  const SHIP_R = 11;
  const BULLET_SPEED = 560, BULLET_LIFE = 1.0, FIRE_COOLDOWN = 0.16;
  const SIZES = [{ r: 44, pts: 20, sp: 55 }, { r: 24, pts: 50, sp: 85 }, { r: 12, pts: 100, sp: 120 }];
  const WAVES = 5;
  const HEADINGS = 16, STEP_DEG = 360 / HEADINGS;        // 22.5°
  const ROCK_FRAMES = 16, ROCK_FPS = 12;
  const FLAME_FRAMES = 4, FLAME_FPS = 20;
  const BOOM_FRAMES = 8, BOOM_FPS = 16;
  const DAY = 60;              // seconds per in-game day: 1 s = 24 in-game minutes
  const START_MIN = 8 * 60;    // the clock starts at 08:00
  const CANNONS = ['left', 'nose', 'right'];

  // ---------- Sprite sheet: 8 columns × 6 rows of 32 × 32 cells ----------
  const CELL = 32, COLS = 8, ROWS = 6, FRAMES = COLS * ROWS;
  const SHIP0 = 0, ROCK0 = 16, BOOM0 = 32, FLAME0 = 40, SPARK0 = 44;
  const sheet = document.createElement('canvas');
  sheet.width = COLS * CELL; sheet.height = ROWS * CELL;
  (function buildSheet() {
    const g = sheet.getContext('2d');
    const at = (i, fn) => {
      g.save(); g.translate((i % COLS) * CELL + CELL / 2, Math.floor(i / COLS) * CELL + CELL / 2); fn(); g.restore();
    };
    for (let k = 0; k < HEADINGS; k++) at(SHIP0 + k, () => {
      g.rotate(k * STEP_DEG * RAD);
      g.fillStyle = '#2a5d8f'; g.strokeStyle = '#6cb8ff'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(13, 0); g.lineTo(-10, -9); g.lineTo(-5, 0); g.lineTo(-10, 9); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#cfe6ff'; g.fillRect(2, -2, 4, 4);
    });
    const rock = [1, .82, .95, .7, 1, .88, .76, .97, .85, .92, .72, .9];
    for (let k = 0; k < ROCK_FRAMES; k++) at(ROCK0 + k, () => {
      g.rotate(k * (360 / ROCK_FRAMES) * RAD);
      g.beginPath();
      rock.forEach((m, i) => { const t = i / rock.length * Math.PI * 2; const p = [Math.cos(t) * 14 * m, Math.sin(t) * 14 * m]; i ? g.lineTo(...p) : g.moveTo(...p); });
      g.closePath(); g.fillStyle = '#4a4f5c'; g.fill(); g.strokeStyle = '#9aa3b2'; g.lineWidth = 1.5; g.stroke();
      g.fillStyle = '#353945'; g.beginPath(); g.arc(5, -3, 3, 0, 7); g.fill(); g.beginPath(); g.arc(-4, 5, 2, 0, 7); g.fill();
    });
    for (let k = 0; k < BOOM_FRAMES; k++) at(BOOM0 + k, () => {
      const t = (k + 1) / BOOM_FRAMES;
      g.globalAlpha = 1 - t * 0.8;
      g.strokeStyle = '#ffb547'; g.lineWidth = 3 - t * 2;
      g.beginPath(); g.arc(0, 0, 3 + t * 11, 0, 7); g.stroke();
      g.fillStyle = '#ff6b6b';
      for (let j = 0; j < 8; j++) { const a = j * Math.PI / 4 + k * .2; g.fillRect(Math.cos(a) * t * 14 - 1, Math.sin(a) * t * 14 - 1, 2.5, 2.5); }
      g.globalAlpha = 1;
    });
    const flame = [8, 12, 9, 14];
    for (let k = 0; k < FLAME_FRAMES; k++) at(FLAME0 + k, () => {
      g.fillStyle = '#ffb547'; g.beginPath(); g.moveTo(-2, -5); g.lineTo(-2 - flame[k], 0); g.lineTo(-2, 5); g.fill();
      g.fillStyle = '#fff1c9'; g.beginPath(); g.moveTo(-2, -2.5); g.lineTo(-2 - flame[k] * .55, 0); g.lineTo(-2, 2.5); g.fill();
    });
    for (let k = 0; k < 4; k++) at(SPARK0 + k, () => {
      g.fillStyle = '#ffe28a'; g.beginPath(); g.arc(0, 0, 3 + (k % 2), 0, 7); g.fill();
      g.strokeStyle = 'rgba(255,226,138,.6)'; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(-6 - k, 0); g.lineTo(6 + k, 0); g.moveTo(0, -6 - k); g.lineTo(0, 6 + k); g.stroke();
    });
  })();

  // ---------- Canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 800, H = 600, DPR = 1, S = 1, OX = 0, OY = 0;
  function resize() {
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    S = Math.min(W / WORLD.w, H / WORLD.h);
    OX = (W - WORLD.w * S) / 2; OY = (H - WORLD.h * S) / 2;
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  // ---------- Input ----------
  const keys = {};
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (/^[1-5]$/.test(k)) { toggleLens(LENSES[+k - 1]); return; }
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
    if (!started) started = true;
    if (k === 'r') reset();
    if (k === 'p') paused = !paused;
    keys[k] = true;
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  canvas.addEventListener('pointerdown', () => { started = true; if (state.over) reset(); });

  // ---------- State ----------
  let state, ship, rocks, bullets, booms, popups;
  let started = false, paused = false;

  function reset() {
    state = { over: null, time: 0, score: 0, wave: 0, lives: 3, shots: 0, banner: 0, lastRaw: { x: 0, y: 0 } };
    rocks = []; bullets = []; booms = []; popups = [];
    spawnShip();
    nextWave();
  }
  function spawnShip() {
    ship = { x: WORLD.w / 2, y: WORLD.h / 2, vx: 0, vy: 0, deg: 270, inv: 2.5, cd: 0, thrust: false, dead: 0 };
  }
  function nextWave() {
    state.wave++; state.banner = 2;
    for (let i = 0; i < state.wave + 2; i++) {
      let x, y;
      do { x = rand(0, WORLD.w); y = rand(0, WORLD.h); }
      while (Math.hypot(wrapDelta(x - ship.x, WORLD.w), wrapDelta(y - ship.y, WORLD.h)) < 220);
      addRock(x, y, 0, rand(0, 360));
    }
  }
  function addRock(x, y, size, dirDeg) {
    const s = SIZES[size], sp = s.sp * rand(0.8, 1.2) * (1 + state.wave * 0.06);
    rocks.push({ x, y, vx: Math.cos(dirDeg * RAD) * sp, vy: Math.sin(dirDeg * RAD) * sp, size, r: s.r,
      age: 0, offset: Math.floor(rand(0, ROCK_FRAMES)), reverse: Math.random() < 0.5, frame: 0 });
  }
  function popup(x, y, text, color) { popups.push({ x, y, text, color, life: 1.1 }); }

  // ---------- Clocks ----------
  function dayMinutes() { return (Math.floor(state.time * 24) + START_MIN) % 1440; }
  function isNight() { const h = Math.floor(dayMinutes() / 60); return h >= 20 || h < 6; }

  // ---------- Update ----------
  function update(dt) {
    for (const p of popups) { p.life -= dt; p.y -= 26 * dt; }
    popups = popups.filter(p => p.life > 0);
    for (const b of booms) b.age += dt;
    booms = booms.filter(b => Math.floor(b.age * BOOM_FPS) < BOOM_FRAMES);   // explosions play once
    if (state.over) return;
    state.time += dt;
    if (state.banner > 0) state.banner -= dt;

    // Ship
    if (ship.dead > 0) {
      ship.dead -= dt;
      if (ship.dead <= 0) spawnShip();
    } else {
      const turn = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
      ship.deg = mod(ship.deg + turn * TURN * dt, 360);              // wrap the angle to 0 … 360
      ship.thrust = !!(keys.w || keys.arrowup);
      if (ship.thrust) { ship.vx += Math.cos(ship.deg * RAD) * THRUST * dt; ship.vy += Math.sin(ship.deg * RAD) * THRUST * dt; }
      const sp = Math.hypot(ship.vx, ship.vy);
      if (sp > MAX_SPEED) { ship.vx *= MAX_SPEED / sp; ship.vy *= MAX_SPEED / sp; }
      const drag = Math.exp(-DRAG * dt); ship.vx *= drag; ship.vy *= drag;
      const rx = ship.x + ship.vx * dt, ry = ship.y + ship.vy * dt;
      state.lastRaw = { x: rx, y: ry };
      ship.x = mod(rx, WORLD.w); ship.y = mod(ry, WORLD.h);            // screen wrap
      ship.inv -= dt; ship.cd -= dt;
      if (keys[' '] && ship.cd <= 0) fire();
    }

    // Bullets
    for (const b of bullets) {
      b.x = mod(b.x + b.vx * dt, WORLD.w); b.y = mod(b.y + b.vy * dt, WORLD.h);
      b.life -= dt; b.age += dt;
    }
    // Rocks
    for (const r of rocks) {
      r.x = mod(r.x + r.vx * dt, WORLD.w); r.y = mod(r.y + r.vy * dt, WORLD.h);
      r.age += dt;
      const n = Math.floor(r.age * ROCK_FPS) + r.offset;               // frame = floor(t × fps) mod 16
      r.frame = r.reverse ? (ROCK_FRAMES - 1) - (n % ROCK_FRAMES) : n % ROCK_FRAMES;
    }

    // Collisions measure distance the short way round the wrap
    for (const b of bullets) {
      if (b.life <= 0) continue;
      for (const r of rocks) {
        if (r.dead) continue;
        if (Math.hypot(wrapDelta(b.x - r.x, WORLD.w), wrapDelta(b.y - r.y, WORLD.h)) < r.r + 3) {
          b.life = 0; breakRock(r); break;
        }
      }
    }
    if (ship.dead <= 0 && ship.inv <= 0) {
      for (const r of rocks) {
        if (r.dead) continue;
        if (Math.hypot(wrapDelta(ship.x - r.x, WORLD.w), wrapDelta(ship.y - r.y, WORLD.h)) < r.r + SHIP_R) {
          booms.push({ x: ship.x, y: ship.y, age: 0, size: 70 });
          state.lives--; ship.dead = 1.2; ship.x = -9999;
          popup(r.x, r.y - 20, 'ship lost', '#ff6b6b');
          if (state.lives <= 0) { state.over = 'lost'; }
          break;
        }
      }
    }
    bullets = bullets.filter(b => b.life > 0);
    rocks = rocks.filter(r => !r.dead);
    if (rocks.length === 0 && !state.over) {
      if (state.wave >= WAVES) state.over = 'won';
      else nextWave();
    }
  }

  function fire() {
    const c = state.shots % CANNONS.length;                            // turn order: 0, 1, 2, 0, 1, 2…
    state.shots++;
    ship.cd = FIRE_COOLDOWN;
    const fx = Math.cos(ship.deg * RAD), fy = Math.sin(ship.deg * RAD);
    const side = [-10, 0, 10][c], fwd = [4, 16, 4][c];
    bullets.push({ x: mod(ship.x + fx * fwd - fy * side, WORLD.w), y: mod(ship.y + fy * fwd + fx * side, WORLD.h),
      vx: fx * BULLET_SPEED + ship.vx, vy: fy * BULLET_SPEED + ship.vy, life: BULLET_LIFE, age: 0, cannon: c });
  }

  function breakRock(r) {
    r.dead = true;
    const pts = SIZES[r.size].pts * (isNight() ? 2 : 1);
    state.score += pts;
    popup(r.x, r.y - r.r, `+${pts}${isNight() ? ' (night ×2)' : ''}`, isNight() ? '#b48cff' : '#ffb547');
    booms.push({ x: r.x, y: r.y, age: 0, size: r.r * 2.4 });
    if (r.size < 2) {
      const dir = Math.atan2(r.vy, r.vx) / RAD;
      addRock(r.x, r.y, r.size + 1, dir + rand(25, 50));
      addRock(r.x, r.y, r.size + 1, dir - rand(25, 50));
    }
  }

  // ---------- Drawing ----------
  function text(t, x, y, color = '#e6e9ef', size = 12, align = 'left') {
    ctx.font = `${size}px Menlo, Consolas, monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,12,16,.9)'; ctx.strokeText(t, x, y);
    ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  function circle(x, y, r, fill, stroke, lw = 2) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line(x1, y1, x2, y2, color, lw = 1.5) {
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  // Look a frame up in the sprite sheet: row = floor(i / 8), col = i mod 8
  function drawFrame(i, x, y, size, rot = 0) {
    if (!(i >= 0 && i < FRAMES)) {                                     // a negative index has no frame
      ctx.setLineDash([4, 4]); ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2;
      ctx.strokeRect(x - size / 2, y - size / 2, size, size); ctx.setLineDash([]);
      text(`frame ${i}?`, x, y + 4, '#ff6b6b', 11, 'center');
      return;
    }
    const col = i % COLS, row = Math.floor(i / COLS);
    if (rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(sheet, col * CELL, row * CELL, CELL, CELL, -size / 2, -size / 2, size, size); ctx.restore(); }
    else ctx.drawImage(sheet, col * CELL, row * CELL, CELL, CELL, x - size / 2, y - size / 2, size, size);
  }
  // Draw an object, plus ghost copies when it overlaps an edge of the arena
  function wrapped(x, y, r, fn) {
    const xs = [0], ys = [0];
    if (x >= 0 && x < r) xs.push(WORLD.w); if (x <= WORLD.w && x > WORLD.w - r) xs.push(-WORLD.w);
    if (y >= 0 && y < r) ys.push(WORLD.h); if (y <= WORLD.h && y > WORLD.h - r) ys.push(-WORLD.h);
    for (const dx of xs) for (const dy of ys) fn(x + dx, y + dy, dx !== 0 || dy !== 0);
  }
  const shipFrame = () => mod(Math.round(ship.deg / STEP_DEG), HEADINGS);  // 16 headings, 22.5° apart

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);

    // Day and night tint the arena
    const night = isNight();
    const m = dayMinutes(), light = 0.5 + 0.5 * Math.cos((m / 1440 - 0.5) * Math.PI * 2);
    ctx.fillStyle = `rgb(${12 + 18 * light | 0},${16 + 26 * light | 0},${28 + 40 * light | 0})`;
    ctx.fillRect(0, 0, WORLD.w, WORLD.h);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, WORLD.w, WORLD.h); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= WORLD.w; x += 64) { ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.h); }
    for (let y = 0; y <= WORLD.h; y += 64) { ctx.moveTo(0, y); ctx.lineTo(WORLD.w, y); }
    ctx.stroke();

    for (const r of rocks) wrapped(r.x, r.y, r.r, (x, y) => drawFrame(ROCK0 + r.frame, x, y, r.r * 2.3));
    for (const b of bullets) {
      const f = SPARK0 + (Math.floor(b.age * 20) % 4);
      wrapped(b.x, b.y, 6, (x, y) => drawFrame(f, x, y, 14));
    }
    for (const b of booms) drawFrame(BOOM0 + Math.floor(b.age * BOOM_FPS), b.x, b.y, b.size);

    if (ship.dead <= 0) {
      const blink = ship.inv > 0 && Math.floor(ship.inv * 8) % 2 === 0;
      if (!blink) {
        const i = shipFrame();
        wrapped(ship.x, ship.y, 20, (x, y) => {
          if (ship.thrust) {
            const fi = FLAME0 + (Math.floor(state.time * FLAME_FPS) % FLAME_FRAMES);   // 4-frame loop
            const a = (i >= 0 ? i * STEP_DEG : ship.deg) * RAD;
            drawFrame(fi, x - Math.cos(a) * 12, y - Math.sin(a) * 12, 32, a);
          }
          drawFrame(SHIP0 + i, x, y, 40);
        });
      }
    }
    ctx.restore();
    ctx.strokeStyle = '#2b3242'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, WORLD.w, WORLD.h);

    for (const l of LENSES) if (l.on) l.draw();

    for (const p of popups) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      text(p.text, p.x, p.y, p.color, 14, 'center');
      ctx.globalAlpha = 1;
    }

    // HUD
    const t = Math.floor(state.time);
    text(`${'▲'.repeat(Math.max(0, state.lives))}`, 16, 28, '#6cb8ff', 18);
    text(`score ${state.score}   wave ${state.wave}/${WAVES}   time ${pad2(Math.floor(t / 60))}:${pad2(t % 60)}`, 90, 26, '#9aa3b2', 13);
    text(`${pad2(Math.floor(m / 60))}:${pad2(m % 60)} ${night ? 'NIGHT · points ×2' : 'day'}`, WORLD.w - 16, 26, night ? '#b48cff' : '#ffb547', 13, 'right');
    if (state.banner > 0 && !state.over) text(`WAVE ${state.wave}`, WORLD.w / 2, WORLD.h / 2 - 70, '#e6e9ef', 26, 'center');

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!started) overlay('WRAPAROUND', ['Clear five waves of asteroids · the arena wraps at every edge', 'A/D to turn · W to thrust · Space to fire', 'Press any key to start']);
    else if (state.over === 'lost') overlay('GAME OVER', [`score ${state.score} · reached wave ${state.wave}`, 'Press R or click to play again']);
    else if (state.over === 'won') overlay('ARENA CLEARED', [`score ${state.score} · ${pad2(Math.floor(t / 60))}:${pad2(t % 60)}`, 'Press R or click to play again']);
    else if (paused) overlay('PAUSED', ['Press P to resume']);
  }

  function overlay(title, lines) {
    ctx.fillStyle = 'rgba(10,12,16,.72)'; ctx.fillRect(0, 0, W, H);
    text(title, W / 2, H / 2 - 16, '#e6e9ef', 28, 'center');
    lines.forEach((l, i) => text(l, W / 2, H / 2 + 14 + i * 20, '#9aa3b2', 13, 'center'));
  }

  // ---------- Lenses ----------
  const lost = () => [ship, ...rocks, ...bullets].filter(o => o.x !== -9999 && (o.x < 0 || o.y < 0 || o.x >= WORLD.w || o.y >= WORLD.h));
  function nearestRock() {
    let best = null, bd = Infinity;
    for (const r of rocks) { const d = Math.hypot(r.x - ship.x, r.y - ship.y); if (d < bd) { bd = d; best = r; } }
    return best;
  }
  const modControl = `<label><input type="checkbox" data-set="trueMod"> True modulo  ((a % n) + n) % n</label>`;
  const LENSES = [
    {
      name: 'Screen wrap', chap: 'Chapter 2.3',
      formula: 'x ← mod(x + vx·Δt, 960)\ny ← mod(y + vy·Δt, 640)\nmod(a, n) = ((a % n) + n) % n\nshort way: d ← mod(d + n/2, n) − n/2',
      used: ['Asteroids-style arenas and Pac-Man tunnels', 'Looping backgrounds and parallax layers',
        'Planets and maps where east meets west', 'Ring buffers: replays, input history, audio'],
      tryThis: 'Fly off the right edge and all is well. Then untick "True modulo" and fly off the left or top edge. The remainder keeps x negative, and the ship vanishes into a place no one can see.',
      controls: modControl,
      draw() {
        ctx.strokeStyle = '#6cb8ff'; ctx.lineWidth = 3; ctx.strokeRect(0, 0, WORLD.w, WORLD.h);
        text('0', 4, -6, '#6cb8ff', 13); text(`${WORLD.w}`, WORLD.w - 4, -6, '#6cb8ff', 13, 'right');
        text(`${WORLD.h}`, -6, WORLD.h, '#6cb8ff', 13, 'right');
        if (ship.dead <= 0) text(`(${f0(ship.x)}, ${f0(ship.y)})`, clamp(ship.x, 40, WORLD.w - 40), clamp(ship.y + 40, 20, WORLD.h - 6), '#e6e9ef', 13, 'center');
        for (const o of lost()) {
          const x = clamp(o.x, 6, WORLD.w - 6), y = clamp(o.y, 14, WORLD.h - 6);
          circle(x, y, 5, '#ff6b6b');
          text(`lost at (${f0(o.x)}, ${f0(o.y)})`, clamp(x + 8, 8, WORLD.w - 170), y - 8, '#ff6b6b', 12);
        }
      },
      live() {
        const r = state.lastRaw, n = WORLD.w;
        return `ship x before wrap  ${f1(r.x)}\n x % ${n}            ${f1(rem(r.x, n))}\n ((x % ${n}) + ${n}) % ${n}  ${f1(tmod(r.x, n))}\nship y before wrap  ${f1(r.y)}\n y % ${WORLD.h}            ${f1(rem(r.y, WORLD.h))}\n true mod           ${f1(tmod(r.y, WORLD.h))}\nusing               ${settings.trueMod ? 'true modulo' : 'remainder (bug!)'}\nobjects lost off-screen  ${lost().length}`;
      },
    },
    {
      name: 'Animation frames', chap: 'Chapter 2.4',
      formula: 'frame = floor(t × fps) mod n\nrocks:  16 frames at 12 fps\nflame:   4 frames at 20 fps\nboom:    8 frames at 16 fps (no loop)',
      used: ['Walk cycles and idle loops', 'Spinning coins, flickering torches',
        'Explosions that play once', 'Blinking cursors and UI pulses'],
      tryThis: 'Each rock shows its frame number counting 0 … 15 and starting again at 0. Thrust and watch the flame loop 0, 1, 2, 3, 0, 1…',
      draw() {
        for (const r of rocks) text(String(r.frame), r.x, r.y + 4, '#ffb547', 13, 'center');
        if (ship.dead <= 0 && ship.thrust) text(`flame ${Math.floor(state.time * FLAME_FPS) % FLAME_FRAMES}`, ship.x, ship.y + 34, '#ffb547', 12, 'center');
      },
      live() {
        const r = nearestRock();
        const fl = Math.floor(state.time * FLAME_FPS);
        let s = `flame  t = ${f2(state.time)} s\n floor(t × 20) = ${fl}\n ${fl} mod 4 = ${fl % 4}`;
        if (r) {
          const n = Math.floor(r.age * ROCK_FPS) + r.offset;
          s += `\n\nnearest rock  t = ${f2(r.age)} s, start ${r.offset}\n floor(t × 12) + ${r.offset} = ${n}\n ${n} mod 16 = ${n % 16}${r.reverse ? `\n spins backward: 15 − ${n % 16} = ${15 - n % 16}` : ''}\n frame ${r.frame}`;
        }
        return s;
      },
    },
    {
      name: 'Sprite sheet', chap: 'Chapter 2.5',
      formula: 'row = floor(i ÷ 8)     col = i mod 8\nsource x = col × 32   source y = row × 32\ni = row × 8 + col\n8 = 2³:  i mod 8 = i & 7,  i ÷ 8 = i >> 3',
      used: ['Sprite sheets and texture atlases', 'Tilemaps: tile number ↔ (row, col)',
        'Inventory grids and level-select screens', 'Storing a 2D grid in one long list'],
      tryThis: 'Turn slowly: the blue box walks across the ship rows of the sheet. Frame 8 is the first cell of row 1, because 8 ÷ 8 = 1 remainder 0.',
      draw() {
        const sc = 1.25, w = COLS * CELL * sc, h = ROWS * CELL * sc, x0 = WORLD.w - w - 16, y0 = 44;
        ctx.fillStyle = 'rgba(17,21,28,.92)'; ctx.fillRect(x0 - 8, y0 - 8, w + 16, h + 30);
        ctx.drawImage(sheet, x0, y0, w, h);
        ctx.strokeStyle = 'rgba(154,163,178,.35)'; ctx.lineWidth = 1; ctx.beginPath();
        for (let c = 0; c <= COLS; c++) { ctx.moveTo(x0 + c * CELL * sc, y0); ctx.lineTo(x0 + c * CELL * sc, y0 + h); }
        for (let r = 0; r <= ROWS; r++) { ctx.moveTo(x0, y0 + r * CELL * sc); ctx.lineTo(x0 + w, y0 + r * CELL * sc); }
        ctx.stroke();
        for (let i = 0; i < FRAMES; i++) text(String(i), x0 + (i % COLS) * CELL * sc + 2, y0 + Math.floor(i / COLS) * CELL * sc + 10, '#6b7385', 9);
        const mark = (i, color) => {
          if (!(i >= 0 && i < FRAMES)) return;
          ctx.strokeStyle = color; ctx.lineWidth = 3;
          ctx.strokeRect(x0 + (i % COLS) * CELL * sc, y0 + Math.floor(i / COLS) * CELL * sc, CELL * sc, CELL * sc);
        };
        const r = nearestRock();
        if (r) mark(ROCK0 + r.frame, '#ffb547');
        if (ship.dead <= 0) mark(SHIP0 + shipFrame(), '#6cb8ff');
        text('8 columns × 6 rows of 32 × 32 px', x0, y0 + h + 16, '#9aa3b2', 12);
      },
      live() {
        const i = SHIP0 + shipFrame(), r = nearestRock();
        const line1 = i >= 0 ? `ship frame i = ${i}\n row = floor(${i} ÷ 8) = ${Math.floor(i / 8)}\n col = ${i} mod 8 = ${i % 8}\n source pixel (${(i % 8) * CELL}, ${Math.floor(i / 8) * CELL})\n check ${Math.floor(i / 8)} × 8 + ${i % 8} = ${i}\n bits: ${i} & 7 = ${i & 7},  ${i} >> 3 = ${i >> 3}`
          : `ship frame i = ${i}  (negative: no such cell!)`;
        if (!r) return line1;
        const j = ROCK0 + r.frame;
        return `${line1}\n\nrock frame i = ${j}\n row ${Math.floor(j / 8)}, col ${j % 8}, pixel (${(j % 8) * CELL}, ${Math.floor(j / 8) * CELL})`;
      },
    },
    {
      name: 'Headings', chap: 'Chapter 2.6',
      formula: 'θ ← mod(θ ± 270°·Δt, 360)\nframe = mod(round(θ ÷ 22.5°), 16)',
      used: ['Choosing 8- or 16-direction sprites', 'Compass headings and minimap arrows',
        'Turrets and characters that spin forever', 'Radial menus with n slices'],
      tryThis: 'Turn right past 360° and θ starts again at 0. Then untick "True modulo" and turn left past 0°: θ goes negative, the frame index goes negative, and the ship\'s sprite is missing.',
      controls: modControl,
      draw() {
        if (ship.dead > 0) return;
        const R = 46, i = shipFrame();
        for (let k = 0; k < HEADINGS; k++) {
          const a = k * STEP_DEG * RAD;
          line(ship.x + Math.cos(a) * 26, ship.y + Math.sin(a) * 26, ship.x + Math.cos(a) * R, ship.y + Math.sin(a) * R,
            k === i ? '#6cb8ff' : 'rgba(154,163,178,.45)', k === i ? 3 : 1.5);
          if (k % 4 === 0) text(String(k), ship.x + Math.cos(a) * (R + 10), ship.y + Math.sin(a) * (R + 10) + 4, '#9aa3b2', 11, 'center');
        }
        const a = ship.deg * RAD;
        line(ship.x, ship.y, ship.x + Math.cos(a) * (R + 4), ship.y + Math.sin(a) * (R + 4), '#ffb547', 2);
        text(`θ = ${f1(ship.deg)}°`, ship.x, ship.y - R - 10, '#ffb547', 13, 'center');
      },
      live() {
        const q = ship.deg / STEP_DEG, k = Math.round(q);
        return `heading θ         ${f1(ship.deg)}°\nθ ÷ 22.5°         ${f2(q)}\nround(…)          ${k}\n${k} % 16           ${rem(k, 16)}\nmod(${k}, 16)      ${tmod(k, 16)}\nframe used        ${shipFrame()}${shipFrame() < 0 ? '  ← no such frame' : ''}\n\ntry: −30° % 360 = ${rem(-30, 360)}\n     mod(−30°, 360) = ${tmod(-30, 360)}`;
      },
    },
    {
      name: 'Clocks & turns', chap: 'Chapter 2.7',
      formula: 'mm:ss  = floor(s ÷ 60) : s mod 60\nday min = (floor(t × 24) + 480) mod 1440\nhh:mm  = floor(min ÷ 60) : min mod 60\ncannon = shot number mod 3',
      used: ['Day/night cycles and in-game calendars', 'Countdown and race timers',
        'Turn order in board games and RPGs', 'Round-robin AI updates and spawn points'],
      tryThis: 'Watch the clock in the corner: one day lasts 60 s. After 20:00 it is night and every rock is worth double. Fire a burst and the cannons take turns: left, nose, right, left…',
      draw() {
        if (ship.dead > 0) return;
        const next = state.shots % 3;
        const fx = Math.cos(ship.deg * RAD), fy = Math.sin(ship.deg * RAD);
        [-10, 0, 10].forEach((side, c) => {
          const fwd = [4, 16, 4][c];
          circle(ship.x + fx * fwd - fy * side, ship.y + fy * fwd + fx * side, c === next ? 5 : 3, c === next ? '#5fd18b' : '#6b7385');
        });
        text(`next: ${CANNONS[next]}`, ship.x, ship.y + 38, '#5fd18b', 12, 'center');
      },
      live() {
        const t = Math.floor(state.time), m = dayMinutes(), n = Math.floor(state.time * 24) + START_MIN;
        return `play time s = ${t}\n mm:ss = ${Math.floor(t / 60)}:${pad2(t % 60)}   (${t} = ${Math.floor(t / 60)} × 60 + ${t % 60})\n\nday clock\n floor(t × 24) + 480 = ${n}\n ${n} mod 1440 = ${m}\n hh:mm = ${pad2(Math.floor(m / 60))}:${pad2(m % 60)}   ${isNight() ? 'night (×2)' : 'day'}\n\nshots fired ${state.shots}\n next cannon ${state.shots} mod 3 = ${state.shots % 3} (${CANNONS[state.shots % 3]})`;
      },
    },
  ];
  for (const l of LENSES) l.on = false;

  // ---------- Panel ----------
  const lensesEl = document.getElementById('lenses');
  const cardEl = document.getElementById('card');
  let selected = null, liveEl = null;
  LENSES.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'lens';
    b.innerHTML = `<kbd>${i + 1}</kbd>${l.name}`;
    b.addEventListener('click', () => toggleLens(l));
    l.btn = b; lensesEl.appendChild(b);
  });
  function toggleLens(l) {
    if (!l) return;
    if (l.on && selected === l) l.on = false; else l.on = true;
    selected = l.on ? l : LENSES.find(x => x.on) || null;
    for (const x of LENSES) { x.btn.classList.toggle('on', x.on); x.btn.classList.toggle('sel', x === selected); }
    renderCard();
  }
  function renderCard() {
    if (!selected) {
      cardEl.innerHTML = `<h2>No lens on</h2><p style="margin:0;color:var(--muted)">Play a round first. Then press 1–5 to see the integer math behind wrapping, animation and sprite sheets.</p>`;
      liveEl = null; return;
    }
    const l = selected;
    cardEl.innerHTML = `
      <h2>${l.name}</h2><span class="chap">${l.chap}</span>
      <div class="formula">${l.formula}</div>
      <h3>Where it's used in games</h3>
      <ul>${l.used.map(u => `<li>${u}</li>`).join('')}</ul>
      <h3>Try this</h3><div class="try">${l.tryThis}</div>
      ${l.controls ? `<div class="controls">${l.controls}</div>` : ''}
      <h3>Live numbers</h3><div class="live"></div>`;
    liveEl = cardEl.querySelector('.live');
    cardEl.querySelectorAll('[data-set]').forEach(el => {
      const key = el.dataset.set;
      const showEl = cardEl.querySelector(`[data-show="${key}"]`);
      if (el.type === 'checkbox') el.checked = settings[key]; else el.value = settings[key];
      if (showEl) showEl.textContent = settings[key];
      el.addEventListener('input', () => {
        settings[key] = el.type === 'checkbox' ? el.checked : parseFloat(el.value);
        if (showEl) showEl.textContent = settings[key];
      });
    });
    updateLive();
  }
  function updateLive() { if (liveEl && selected) liveEl.textContent = selected.live(); }
  renderCard();

  // ---------- Loop ----------
  reset();
  let last = performance.now(), liveTimer = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (started && !paused) update(dt);
    render();
    liveTimer -= dt;
    if (liveTimer <= 0) { updateLive(); liveTimer = 0.1; }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
