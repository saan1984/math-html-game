<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stealth Guard</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b23;
    --panel-2: #1f2430;
    --line: #2a3140;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #6cb8ff;
    --warn: #ffb547;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #app { display: flex; height: 100vh; }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { width: 340px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .lenses { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .lens { display: flex; align-items: center; gap: 6px; text-align: left; padding: 7px 8px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font: inherit; font-size: 12.5px; cursor: pointer; }
  .lens kbd { font: 11px Menlo, Consolas, monospace; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px; }
  .lens.on { border-color: var(--accent); background: #1d2b3d; }
  .lens.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .chap { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid #2d4766;
    border-radius: 999px; padding: 1px 8px; margin-bottom: 8px; }
  .formula { font: 13px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin: 6px 0 10px; white-space: pre-wrap; color: #cfe6ff; }
  .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 4px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin: 2px 0; }
  .try { color: var(--warn); }
  .live { font: 12.5px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin-top: 6px; white-space: pre; overflow-x: auto; min-height: 3em; }
  .controls { margin-top: 8px; display: grid; gap: 6px; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls input[type=range] { flex: 1; }
  .help { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  .help b { color: var(--text); }
  @media (max-width: 820px) {
    #app { flex-direction: column; height: auto; }
    #stage { flex: none; height: 62vh; }
    #panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
  <aside id="panel">
    <h1>Stealth Guard</h1>
    <p class="sub">Reach the green exit without being spotted. Every guard decides what it can see with one dot product.</p>
    <div class="lenses" id="lenses"></div>
    <div class="card" id="card"></div>
    <div class="help">
      <b>Move</b> WASD / arrows · <b>Takedown</b> E or Space (from behind) ·
      <b>Lenses</b> keys 1–4 · <b>Restart</b> R · <b>Pause</b> P
    </div>
  </aside>
</div>

<script>
(() => {
  // ---------- Vector math ----------
  const V = (x = 0, y = 0) => ({ x, y });
  const add = (a, b) => V(a.x + b.x, a.y + b.y);
  const sub = (a, b) => V(a.x - b.x, a.y - b.y);
  const mul = (a, s) => V(a.x * s, a.y * s);
  const len = a => Math.hypot(a.x, a.y);
  const norm = a => { const l = len(a); return l > 0 ? V(a.x / l, a.y / l) : V(); };
  const dot = (a, b) => a.x * b.x + a.y * b.y;
  const dist = (a, b) => len(sub(a, b));
  const fromAngle = (t, r = 1) => V(Math.cos(t) * r, Math.sin(t) * r);
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const f2 = n => (Math.abs(n) < 0.005 ? 0 : n).toFixed(2);
  const f0 = n => Math.round(n).toString();
  const deg = r => r * 180 / Math.PI;
  const angleDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

  const settings = {
    fov: 90,          // degrees, full cone
    normalizeD: true, // the classic pitfall when false
    slide: true,      // project velocity along walls
    graded: true,     // peripheral vision
  };
  const RANGE = 260;
  const BEHIND = -0.5;      // f̂·d̂ ≤ −0.5  ⇔  θ ≥ 120°
  const TAKEDOWN_DIST = 46;

  // ---------- Level ----------
  const WORLD = { w: 1200, h: 760 };
  const rects = [
    { x: 0, y: 0, w: 1200, h: 20 }, { x: 0, y: 740, w: 1200, h: 20 },
    { x: 0, y: 0, w: 20, h: 760 }, { x: 1180, y: 0, w: 20, h: 760 },
    { x: 380, y: 20, w: 20, h: 280 }, { x: 380, y: 400, w: 20, h: 340 },
    { x: 800, y: 20, w: 20, h: 500 }, { x: 800, y: 620, w: 20, h: 120 },
    { x: 400, y: 380, w: 150, h: 20 }, { x: 650, y: 380, w: 150, h: 20 },
    { x: 160, y: 190, w: 70, h: 70 }, { x: 540, y: 180, w: 60, h: 60 },
    { x: 560, y: 550, w: 70, h: 70 }, { x: 1040, y: 520, w: 70, h: 60 },
  ];
  const segs = [
    { a: V(150, 580), b: V(270, 490), t: 16 },
    { a: V(900, 460), b: V(1020, 360), t: 16 },
  ];
  const EXIT = { x: 1100, y: 32, w: 66, h: 66 };
  const START = V(70, 690);

  // ---------- Geometry helpers ----------
  function closestOnRect(p, r) { return V(clamp(p.x, r.x, r.x + r.w), clamp(p.y, r.y, r.y + r.h)); }
  function closestOnSeg(p, s) {
    const ab = sub(s.b, s.a);
    const t = clamp(dot(sub(p, s.a), ab) / dot(ab, ab), 0, 1);   // projection again!
    return add(s.a, mul(ab, t));
  }
  function blocked(p) {
    for (const r of rects) if (p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h) return true;
    for (const s of segs) if (dist(p, closestOnSeg(p, s)) < s.t / 2) return true;
    return false;
  }
  // Line of sight by sampling (Chapter 22 does this properly with ray casts)
  function lineOfSight(a, b) {
    const d = dist(a, b), n = Math.ceil(d / 6);
    for (let i = 1; i < n; i++) if (blocked(add(a, mul(sub(b, a), i / n)))) return false;
    return true;
  }

  // ---------- Canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 800, H = 600, DPR = 1, S = 1, OX = 0, OY = 0;
  function resize() {
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    S = Math.min(W / WORLD.w, H / WORLD.h);                // scale to fit (Chapter 3)
    OX = (W - WORLD.w * S) / 2; OY = (H - WORLD.h * S) / 2;
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  // ---------- Input ----------
  const keys = {};
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (/^[1-4]$/.test(k)) { toggleLens(LENSES[+k - 1]); return; }
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
    if (!started) { started = true; }
    if (k === 'r') reset();
    if (k === 'p') paused = !paused;
    if ((k === 'e' || k === ' ') && !state.over) takedown();
    keys[k] = true;
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  canvas.addEventListener('pointerdown', () => { started = true; if (state.over) reset(); });

  // ---------- State ----------
  let state, player, guards, popups, contact;
  let started = false, paused = false;

  function makeGuard(points) {
    const p0 = points[0];
    return { pos: V(p0.x, p0.y), points, i: 1, mode: 'patrol', facing: Math.atan2(points[1].y - p0.y, points[1].x - p0.x),
      lookT: 0, lookBase: 0, suspicion: 0, seen: false, dotVal: 0, rawDot: 0, distTo: 0, los: true,
      a: 0, rate: 0, behindVal: 0, down: false, r: 14 };
  }

  function reset() {
    state = { over: null, time: 0, takedowns: 0, spotted: 0 };
    player = { pos: V(START.x, START.y), vel: V(), want: V(), r: 13, speed: 165 };
    contact = null;
    popups = [];
    guards = [
      makeGuard([V(80, 100), V(320, 100), V(320, 300), V(80, 300)]),
      makeGuard([V(440, 100), V(760, 100), V(760, 320), V(440, 320)]),
      makeGuard([V(760, 700), V(440, 700), V(440, 450), V(760, 450)]),
      makeGuard([V(860, 700), V(1140, 700), V(1140, 240), V(860, 240)]),
    ];
  }
  reset();

  function popup(pos, text, color) { popups.push({ pos: V(pos.x, pos.y), text, color, life: 1.4 }); }

  // Takedown: only from behind — f̂ · d̂ ≤ −0.5
  function takedown() {
    let best = null, bd = Infinity;
    for (const g of guards) if (!g.down) { const d = dist(g.pos, player.pos); if (d < bd) { bd = d; best = g; } }
    if (!best || bd > TAKEDOWN_DIST) return;
    const b = dot(fromAngle(best.facing), norm(sub(player.pos, best.pos)));
    if (b <= BEHIND) {
      best.down = true; state.takedowns++;
      popup(V(best.pos.x, best.pos.y - 26), `takedown  f̂·d̂ = ${f2(b)}`, '#5fd18b');
    } else {
      best.suspicion = Math.min(1, best.suspicion + 0.5);
      popup(V(best.pos.x, best.pos.y - 26), `not behind! f̂·d̂ = ${f2(b)}`, '#ff6b6b');
    }
  }

  // ---------- Update ----------
  function update(dt) {
    for (const p of popups) { p.life -= dt; p.pos.y -= 22 * dt; }
    popups = popups.filter(p => p.life > 0);
    if (state.over) return;
    state.time += dt;

    // Player movement with wall sliding (projection)
    const ix = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    const iy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    let v = mul(norm(V(ix, iy)), player.speed);
    player.want = v;
    contact = null;
    const touchR = player.r + 1.5;
    const touching = [];
    for (const r of rects) { const q = closestOnRect(player.pos, r); if (dist(q, player.pos) < touchR) touching.push(q); }
    for (const s of segs) {
      const q = closestOnSeg(player.pos, s);
      if (dist(q, player.pos) < touchR + s.t / 2) touching.push(q);
    }
    for (const q of touching) {
      const n = norm(sub(player.pos, q));                    // wall normal, pointing at the player
      const vn = dot(v, n);
      if (vn < 0) {                                          // moving into the wall
        const before = v;
        v = settings.slide ? sub(v, mul(n, vn)) : V();       // v − (v·n̂)n̂
        if (!contact) contact = { q, n, v: before, vn, out: v };
      }
    }
    player.vel = v;
    player.pos = add(player.pos, mul(v, dt));
    // Resolve any remaining overlap
    for (let k = 0; k < 2; k++) {
      for (const r of rects) {
        const q = closestOnRect(player.pos, r), d = dist(q, player.pos);
        if (d < player.r && d > 0) player.pos = add(q, mul(norm(sub(player.pos, q)), player.r));
      }
      for (const s of segs) {
        const q = closestOnSeg(player.pos, s), d = dist(q, player.pos), rr = player.r + s.t / 2;
        if (d < rr && d > 0) player.pos = add(q, mul(norm(sub(player.pos, q)), rr));
      }
    }

    if (player.pos.x > EXIT.x && player.pos.x < EXIT.x + EXIT.w && player.pos.y > EXIT.y && player.pos.y < EXIT.y + EXIT.h) {
      state.over = 'escaped';
    }

    // Guards
    const cosHalf = Math.cos(settings.fov * Math.PI / 360);
    for (const g of guards) {
      if (g.down) continue;
      const toPlayer = sub(player.pos, g.pos);
      g.distTo = len(toPlayer);
      const f = fromAngle(g.facing);
      const dhat = norm(toPlayer);
      g.rawDot = dot(f, toPlayer);
      g.dotVal = settings.normalizeD ? dot(f, dhat) : g.rawDot;
      g.behindVal = dot(f, dhat);
      const inCone = g.dotVal >= cosHalf;
      const inRange = g.distTo <= RANGE;
      g.los = inRange ? lineOfSight(g.pos, player.pos) : false;
      g.seen = inCone && inRange && g.los;

      if (g.seen) {
        // Peripheral vision: how centered is the player? a = 0 at the edge, 1 dead ahead
        g.a = clamp((g.dotVal - cosHalf) / (1 - cosHalf), 0, 1);
        const near = 1 - g.distTo / RANGE;
        g.rate = settings.graded ? (0.35 + 1.2 * g.a) * (0.5 + 0.8 * near) : 2;
        g.suspicion += g.rate * dt;
      } else {
        g.a = 0; g.rate = 0;
        g.suspicion = Math.max(0, g.suspicion - 0.25 * dt);
      }
      if (g.suspicion >= 1) {
        g.suspicion = 1; state.over = 'caught'; state.spotted++;
        popup(V(g.pos.x, g.pos.y - 26), '!', '#ff6b6b');
      }

      // Behavior
      if (g.suspicion > 0.45 && g.seen) g.mode = 'alert';
      else if (g.mode === 'alert' && g.suspicion < 0.2) g.mode = 'patrol';

      if (g.mode === 'alert') {
        turnToward(g, Math.atan2(toPlayer.y, toPlayer.x), 3.5 * dt);
      } else if (g.mode === 'look') {
        g.lookT += dt;
        g.facing = g.lookBase + 0.9 * Math.sin(g.lookT / 1.8 * Math.PI * 2);
        if (g.lookT >= 1.8) { g.facing = g.lookBase; g.mode = 'patrol'; }
      } else {
        const target = g.points[g.i];
        const to = sub(target, g.pos);
        if (len(to) < 3) {
          g.pos = V(target.x, target.y); g.i = (g.i + 1) % g.points.length;
          g.mode = 'look'; g.lookT = 0; g.lookBase = g.facing;
        } else {
          g.pos = add(g.pos, mul(norm(to), Math.min(len(to), 72 * dt)));
          turnToward(g, Math.atan2(to.y, to.x), 4 * dt);
        }
      }
    }
  }
  function turnToward(g, target, maxStep) {
    const d = angleDiff(g.facing, target);
    g.facing += clamp(d, -maxStep, maxStep);
  }

  // ---------- Drawing ----------
  function arrow(from, vec, color, label, lw = 2.5) {
    const to = add(from, vec);
    if (len(vec) < 2) return;
    const a = Math.atan2(vec.y, vec.x);
    ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(to.x, to.y);
    ctx.lineTo(to.x - Math.cos(a - .4) * 10, to.y - Math.sin(a - .4) * 10);
    ctx.lineTo(to.x - Math.cos(a + .4) * 10, to.y - Math.sin(a + .4) * 10);
    ctx.closePath(); ctx.fill();
    if (label) text(label, to.x + 6, to.y - 6, color, 13);
  }
  function text(t, x, y, color = '#e6e9ef', size = 12, align = 'left') {
    ctx.font = `${size}px Menlo, Consolas, monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,12,16,.9)'; ctx.strokeText(t, x, y);
    ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  function circle(p, r, fill, stroke, lw = 2) {
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);

    ctx.fillStyle = '#131720'; ctx.fillRect(0, 0, WORLD.w, WORLD.h);
    ctx.strokeStyle = '#1a1f29'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= WORLD.w; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.h); }
    for (let y = 0; y <= WORLD.h; y += 40) { ctx.moveTo(0, y); ctx.lineTo(WORLD.w, y); }
    ctx.stroke();

    // Exit
    ctx.fillStyle = 'rgba(95,209,139,.18)'; ctx.fillRect(EXIT.x, EXIT.y, EXIT.w, EXIT.h);
    ctx.strokeStyle = '#5fd18b'; ctx.lineWidth = 2; ctx.strokeRect(EXIT.x, EXIT.y, EXIT.w, EXIT.h);
    text('EXIT', EXIT.x + EXIT.w / 2, EXIT.y + EXIT.h / 2 + 5, '#5fd18b', 14, 'center');

    // Vision cones (part of the gameplay, always drawn)
    const half = settings.fov * Math.PI / 360;
    for (const g of guards) {
      if (g.down) continue;
      // March rays across the cone so the drawn cone stops at walls
      ctx.beginPath(); ctx.moveTo(g.pos.x, g.pos.y);
      const rays = Math.max(12, Math.round(settings.fov / 2.5));
      for (let i = 0; i <= rays; i++) {
        const dir = fromAngle(g.facing - half + (2 * half) * i / rays);
        let r = 8;
        while (r < RANGE && !blocked(add(g.pos, mul(dir, r)))) r += 8;
        const p = add(g.pos, mul(dir, Math.min(r, RANGE)));
        ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      const alpha = 0.07 + g.suspicion * 0.18;
      ctx.fillStyle = g.seen ? `rgba(255,107,107,${alpha + 0.05})` : `rgba(255,181,71,${alpha})`;
      ctx.fill();
    }

    // Walls
    ctx.fillStyle = '#2b3242';
    for (const r of rects) ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = '#2b3242'; ctx.lineCap = 'round';
    for (const s of segs) { ctx.lineWidth = s.t; ctx.beginPath(); ctx.moveTo(s.a.x, s.a.y); ctx.lineTo(s.b.x, s.b.y); ctx.stroke(); }
    ctx.lineCap = 'butt';

    // Guards
    for (const g of guards) {
      if (g.down) {
        circle(g.pos, g.r, '#22262f', '#4a5162');
        text('×', g.pos.x, g.pos.y + 5, '#6b7385', 16, 'center');
        continue;
      }
      circle(g.pos, g.r, '#3b2a20', g.seen ? '#ff6b6b' : '#ffb547', 3);
      const tip = add(g.pos, fromAngle(g.facing, g.r + 7));
      ctx.strokeStyle = '#ffb547'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(g.pos.x, g.pos.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
      if (g.suspicion > 0.01) {
        ctx.fillStyle = '#1f2430'; ctx.fillRect(g.pos.x - 18, g.pos.y - g.r - 12, 36, 5);
        ctx.fillStyle = g.suspicion > 0.45 ? '#ff6b6b' : '#ffb547';
        ctx.fillRect(g.pos.x - 18, g.pos.y - g.r - 12, 36 * g.suspicion, 5);
        if (g.mode === 'alert') text('?', g.pos.x + 22, g.pos.y - g.r - 6, '#ff6b6b', 14);
      }
    }

    // Player
    circle(player.pos, player.r, '#2a5d8f', '#6cb8ff', 3);

    for (const l of LENSES) if (l.on) l.draw();

    for (const p of popups) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      text(p.text, p.pos.x, p.pos.y, p.color, 14, 'center');
      ctx.globalAlpha = 1;
    }

    // HUD
    text(`time ${state.time.toFixed(1)}s   takedowns ${state.takedowns}   FOV ${settings.fov}°   threshold cos(${settings.fov / 2}°) = ${f2(Math.cos(settings.fov * Math.PI / 360))}`,
      30, 15, '#9aa3b2', 13);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!started) overlay('STEALTH GUARD', ['Reach the EXIT without filling a guard\'s meter', 'WASD to move · E or Space for a takedown from behind', 'Press any key to start']);
    else if (state.over === 'caught') overlay('SPOTTED', ['A guard\'s meter filled up', 'Press R or click to try again']);
    else if (state.over === 'escaped') overlay('ESCAPED', [`${state.time.toFixed(1)} s · ${state.takedowns} takedowns`, 'Press R or click to play again']);
    else if (paused) overlay('PAUSED', ['Press P to resume']);
  }

  function overlay(title, lines) {
    ctx.fillStyle = 'rgba(10,12,16,.72)'; ctx.fillRect(0, 0, W, H);
    text(title, W / 2, H / 2 - 16, '#e6e9ef', 28, 'center');
    lines.forEach((l, i) => text(l, W / 2, H / 2 + 14 + i * 20, '#9aa3b2', 13, 'center'));
  }

  // ---------- Lenses ----------
  function nearestGuard() {
    let best = null, bd = Infinity;
    for (const g of guards) if (!g.down && g.distTo < bd) { bd = g.distTo; best = g; }
    return best;
  }
  const LENSES = [
    {
      name: 'Vision cone', chap: 'Chapter 12.5',
      formula: 'f̂ · d̂ = fx·dx + fy·dy = cos θ\nseen if  f̂ · d̂ ≥ cos(fov / 2)\n   and  |d| ≤ range  and no wall between',
      used: ['Guard and camera vision in stealth games', 'Turrets that only fire inside an arc',
        'Enemies that notice you only when you are in front', 'Spotlights and flashlight cones'],
      tryThis: 'Untick "Normalize d": the guards now "see" almost anything in front of them, because f̂ · d grows with distance. Then drag the FOV to 180°: the threshold becomes cos 90° = 0.',
      controls: `<label>FOV <input type="range" min="30" max="180" step="5" data-set="fov"> <span data-show="fov"></span>°</label>
        <label><input type="checkbox" data-set="normalizeD"> Normalize d (use d̂, not d)</label>`,
      draw() {
        const th = Math.cos(settings.fov * Math.PI / 360);
        for (const g of guards) {
          if (g.down) continue;
          ctx.setLineDash([5, 6]); circle(g.pos, RANGE, null, 'rgba(255,181,71,.35)', 1); ctx.setLineDash([]);
          arrow(g.pos, fromAngle(g.facing, 70), '#ffb547', 'f̂');
          arrow(g.pos, mul(norm(sub(player.pos, g.pos)), 70), '#6cb8ff', settings.normalizeD ? 'd̂' : 'd');
          const v = g.dotVal;
          text(`f̂·${settings.normalizeD ? 'd̂' : 'd'} = ${settings.normalizeD ? f2(v) : f0(v)} ${v >= th ? '≥' : '<'} ${f2(th)}`,
            g.pos.x, g.pos.y + g.r + 22, g.seen ? '#ff6b6b' : '#e6e9ef', 13, 'center');
        }
      },
      live() {
        const g = nearestGuard(); if (!g) return 'all guards down';
        const f = fromAngle(g.facing), d = norm(sub(player.pos, g.pos));
        const th = Math.cos(settings.fov * Math.PI / 360);
        return `nearest guard\n f̂ = (${f2(f.x)}, ${f2(f.y)})\n d̂ = (${f2(d.x)}, ${f2(d.y)})\n f̂·d̂ = ${f2(f.x)}×${f2(d.x)} + ${f2(f.y)}×${f2(d.y)}\n     = ${f2(dot(f, d))}  → θ ≈ ${f0(deg(Math.acos(clamp(dot(f, d), -1, 1))))}°\n f̂·d (unnormalized) = ${f0(g.rawDot)}\n threshold cos(${settings.fov / 2}°) = ${f2(th)}\n distance ${f0(g.distTo)} / ${RANGE}\n wall in the way? ${g.los || g.distTo > RANGE ? 'no' : 'yes'}\n SEES YOU: ${g.seen ? 'YES' : 'no'}`;
      },
    },
    {
      name: 'Behind check', chap: 'Chapter 12.6',
      formula: 'behind if  f̂ · d̂ ≤ −0.5   (θ ≥ 120°)\n    and  |d| ≤ 46',
      used: ['Backstabs and silent takedowns', 'Flanking and rear-armor damage bonuses',
        'Sneak-attack critical hits', 'Enemies turning around when hit from behind'],
      tryThis: 'Creep up behind a guard until the marker turns green, then press E. Try it from the side: f̂ · d̂ is near 0, and the guard notices.',
      draw() {
        for (const g of guards) {
          if (g.down) continue;
          const ok = g.behindVal <= BEHIND && g.distTo <= TAKEDOWN_DIST;
          ctx.beginPath(); ctx.moveTo(g.pos.x, g.pos.y);
          ctx.arc(g.pos.x, g.pos.y, TAKEDOWN_DIST, g.facing + Math.PI * 2 / 3, g.facing + Math.PI * 4 / 3); ctx.closePath();
          ctx.fillStyle = ok ? 'rgba(95,209,139,.45)' : 'rgba(95,209,139,.15)'; ctx.fill();
          if (g.distTo < 160) text(`f̂·d̂ = ${f2(g.behindVal)}`, g.pos.x, g.pos.y - g.r - 18, ok ? '#5fd18b' : '#e6e9ef', 13, 'center');
        }
      },
      live() {
        const g = nearestGuard(); if (!g) return 'all guards down';
        const ok = g.behindVal <= BEHIND && g.distTo <= TAKEDOWN_DIST;
        return `nearest guard\n f̂·d̂        ${f2(g.behindVal)}  (≤ −0.50 needed)\n angle       ${f0(deg(Math.acos(clamp(g.behindVal, -1, 1))))}°  (≥ 120° needed)\n distance    ${f0(g.distTo)}  (≤ ${TAKEDOWN_DIST} needed)\n takedown?   ${ok ? 'READY — press E' : 'no'}`;
      },
    },
    {
      name: 'Wall sliding', chap: 'Chapter 12.8',
      formula: 'into the wall if  v · n̂ < 0\nv_slide = v − (v · n̂) n̂',
      used: ['Character controllers sliding along walls', 'Cars scraping along guard rails',
        'Cameras sliding along walls instead of clipping', 'Ice and slopes: removing part of a velocity'],
      tryThis: 'Walk diagonally into a wall. Then untick "Slide along walls": without the projection you stick to every wall you touch.',
      controls: `<label><input type="checkbox" data-set="slide"> Slide along walls (projection)</label>`,
      draw() {
        if (!contact) { text('touch a wall while moving', player.pos.x, player.pos.y - 24, '#9aa3b2', 12, 'center'); return; }
        const p = player.pos, c = contact;
        arrow(c.q, mul(c.n, 50), '#b48cff', 'n̂');
        arrow(p, mul(c.v, 0.45), '#9aa3b2', 'v');
        arrow(p, mul(c.n, c.vn * 0.45), '#ff6b6b', '(v·n̂)n̂');
        arrow(p, mul(c.out, 0.45), '#5fd18b', 'v_slide');
      },
      live() {
        if (!contact) return 'move into a wall to see the projection';
        const c = contact;
        return `v          (${f0(c.v.x)}, ${f0(c.v.y)})\nn̂          (${f2(c.n.x)}, ${f2(c.n.y)})\nv·n̂        ${f0(c.vn)}  (negative: into the wall)\n(v·n̂)n̂     (${f0(c.n.x * c.vn)}, ${f0(c.n.y * c.vn)})\nv_slide    (${f0(c.out.x)}, ${f0(c.out.y)})\ncheck v_slide·n̂ = ${f2(dot(c.out, c.n))}`;
      },
    },
    {
      name: 'Peripheral vision', chap: 'Chapter 12.7',
      formula: 'a = (f̂·d̂ − cos(fov/2)) / (1 − cos(fov/2))\nrate = (0.35 + 1.2a) × (0.5 + 0.8(1 − |d|/range))',
      used: ['Detection meters that fill faster when you are centered', 'Aim-assist strength and lock-on priority',
        'Choosing the most "looked at" object to interact with', 'Directional audio focus'],
      tryThis: 'Stand at the edge of a cone and the meter barely moves; step to its center and it fills in about half a second. Untick "Graded" to make every part of the cone equally deadly.',
      controls: `<label><input type="checkbox" data-set="graded"> Graded (peripheral) detection</label>`,
      draw() {
        for (const g of guards) {
          if (g.down || !g.seen) continue;
          text(`a = ${f2(g.a)}  rate ${f2(g.rate)}/s`, g.pos.x, g.pos.y - g.r - 20, '#ff6b6b', 13, 'center');
        }
      },
      live() {
        const g = nearestGuard(); if (!g) return 'all guards down';
        return `nearest guard\n f̂·d̂        ${f2(g.dotVal)}\n a (0 edge → 1 center)  ${f2(g.a)}\n rate       ${f2(g.rate)} per second\n meter      ${f0(g.suspicion * 100)}%\n state      ${g.mode}`;
      },
    },
  ];
  for (const l of LENSES) l.on = false;

  // ---------- Panel ----------
  const lensesEl = document.getElementById('lenses');
  const cardEl = document.getElementById('card');
  let selected = null, liveEl = null;
  LENSES.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'lens';
    b.innerHTML = `<kbd>${i + 1}</kbd>${l.name}`;
    b.addEventListener('click', () => toggleLens(l));
    l.btn = b; lensesEl.appendChild(b);
  });
  function toggleLens(l) {
    if (!l) return;
    if (l.on && selected === l) l.on = false; else l.on = true;
    selected = l.on ? l : LENSES.find(x => x.on) || null;
    for (const x of LENSES) { x.btn.classList.toggle('on', x.on); x.btn.classList.toggle('sel', x === selected); }
    renderCard();
  }
  function renderCard() {
    if (!selected) {
      cardEl.innerHTML = `<h2>No lens on</h2><p style="margin:0;color:var(--muted)">Play a round first. Then press 1–4 to see the dot products the guards are calculating.</p>`;
      liveEl = null; return;
    }
    const l = selected;
    cardEl.innerHTML = `
      <h2>${l.name}</h2><span class="chap">${l.chap}</span>
      <div class="formula">${l.formula}</div>
      <h3>Where it's used in games</h3>
      <ul>${l.used.map(u => `<li>${u}</li>`).join('')}</ul>
      <h3>Try this</h3><div class="try">${l.tryThis}</div>
      ${l.controls ? `<div class="controls">${l.controls}</div>` : ''}
      <h3>Live numbers</h3><div class="live"></div>`;
    liveEl = cardEl.querySelector('.live');
    cardEl.querySelectorAll('[data-set]').forEach(el => {
      const key = el.dataset.set;
      const showEl = cardEl.querySelector(`[data-show="${key}"]`);
      if (el.type === 'checkbox') el.checked = settings[key]; else el.value = settings[key];
      if (showEl) showEl.textContent = settings[key];
      el.addEventListener('input', () => {
        settings[key] = el.type === 'checkbox' ? el.checked : parseFloat(el.value);
        if (showEl) showEl.textContent = settings[key];
      });
    });
    updateLive();
  }
  function updateLive() { if (liveEl && selected) liveEl.textContent = selected.live(); }
  renderCard();

  // ---------- Loop ----------
  let last = performance.now(), liveTimer = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (started && !paused) update(dt);
    render();
    liveTimer -= dt;
    if (liveTimer <= 0) { updateLive(); liveTimer = 0.1; }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
