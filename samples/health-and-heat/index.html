<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health &amp; Heat</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b23;
    --panel-2: #1f2430;
    --line: #2a3140;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #6cb8ff;
    --warn: #ffb547;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #app { display: flex; height: 100vh; }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { width: 340px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .lenses { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .lens { display: flex; align-items: center; gap: 6px; text-align: left; padding: 7px 8px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font: inherit; font-size: 12.5px; cursor: pointer; }
  .lens kbd { font: 11px Menlo, Consolas, monospace; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px; }
  .lens.on { border-color: var(--accent); background: #1d2b3d; }
  .lens.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .chap { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid #2d4766;
    border-radius: 999px; padding: 1px 8px; margin-bottom: 8px; }
  .formula { font: 13px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin: 6px 0 10px; white-space: pre-wrap; color: #cfe6ff; }
  .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 4px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin: 2px 0; }
  .try { color: var(--warn); }
  .live { font: 12.5px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin-top: 6px; white-space: pre; overflow-x: auto; min-height: 3em; }
  .controls { margin-top: 8px; display: grid; gap: 6px; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls select, .controls input[type=range] { flex: 1; }
  select { background: #11151c; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
  .help { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  .help b { color: var(--text); }
  @media (max-width: 820px) {
    #app { flex-direction: column; height: auto; }
    #stage { flex: none; height: 62vh; }
    #panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
  <aside id="panel">
    <h1>Health &amp; Heat</h1>
    <p class="sub">Grab cooling cores from around the heat vents before you cook. Every bar, color and meter here is a lerp, a remap or a clamp.</p>
    <div class="lenses" id="lenses"></div>
    <div class="card" id="card"></div>
    <div class="help">
      <b>Move</b> WASD / arrows (hold Shift to walk) or drag anywhere as an analog stick ·
      <b>Lenses</b> keys 1–6 · <b>Restart</b> R · <b>Pause</b> P
    </div>
  </aside>
</div>

<script>
(() => {
  // ---------- Small vector helpers ----------
  const V = (x = 0, y = 0) => ({ x, y });
  const add = (a, b) => V(a.x + b.x, a.y + b.y);
  const sub = (a, b) => V(a.x - b.x, a.y - b.y);
  const mul = (a, s) => V(a.x * s, a.y * s);
  const len = a => Math.hypot(a.x, a.y);
  const dist = (a, b) => len(sub(a, b));
  const f0 = n => Math.round(n).toString();
  const f1 = n => n.toFixed(1);
  const f2 = n => n.toFixed(2);

  const settings = {
    clampT: true,     // the pitfall switch: off = no clamping of t anywhere
    deadZone: true,   // ignore small stick readings
    colorMode: 0,     // 0 = blend health color by hue, 1 = by RGB channels
  };

  // ---------- The mapping toolkit (Chapter 5) ----------
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const clamp01 = t => settings.clampT ? clamp(t, 0, 1) : t;
  const lerp = (a, b, t) => a + (b - a) * t;                       // a + (b − a)t
  const invLerp = (a, b, v) => clamp01((v - a) / (b - a));         // (v − a) / (b − a)
  const remap = (v, a, b, c, d) => lerp(c, d, invLerp(a, b, v));   // lerp(c, d, invLerp(a, b, v))
  // Piecewise-linear: a list of [x, y] stops. Outside the stops: flat (clamped) or extrapolated.
  function piecewise(stops, x) {
    const n = stops.length;
    if (x <= stops[0][0] && settings.clampT) return stops[0][1];
    if (x >= stops[n - 1][0] && settings.clampT) return stops[n - 1][1];
    let i = 0;
    while (i < n - 2 && x > stops[i + 1][0]) i++;
    const [x0, y0] = stops[i], [x1, y1] = stops[i + 1];
    return lerp(y0, y1, (x - x0) / (x1 - x0));
  }

  // ---------- Game constants (every number here is quoted in Chapter 5) ----------
  const WORLD = { w: 1200, h: 760 };
  const MAX_SPEED = 220, DEAD = 0.2, STICK_R = 70;     // stick: full speed at full tilt
  const PLAYER_R = 14;
  const VENT_CORE = 40, REACH = 240, REACH_FLARE = 330; // heat fades from the core edge to the reach
  const PEAK = 80, PEAK_FLARE = 110;                    // degrees added at the core edge
  const AMB_START = 20, AMB_END = 45, AMB_TIME = 180;   // ambient temperature rises over 3 minutes
  const DAMAGE = [[30, -3], [50, 0], [80, 6], [100, 20]]; // temperature → health lost per second
  const VOL_NEAR = 60, VOL_FAR = 420;                   // roar volume: 1 at 60, 0 at 420
  const HAZE_FROM = 60, HAZE_TO = 110, HAZE_MAX = 0.55; // heat-haze opacity
  const CORE_LIFE = 9, CORE_FADE = 6, CORE_HEAL = 10, CORE_PICK = 26, WIN = 20;
  const BAR_W = 220;
  const VENT_SPOTS = [V(300, 250), V(900, 250), V(600, 560), V(160, 620), V(1040, 620), V(600, 280)];
  const VENTS_AT = [0, 0, 0, 5, 10, 15];               // cores needed before each vent opens

  // Flare cycle: idle → warn 1 s → rise 0.8 s → hold 2 s → fall 0.8 s
  const WARN = 1, RISE = 0.8, HOLD = 2, FALL = 0.8;

  // ---------- Canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 800, H = 600, DPR = 1, S = 1, OX = 0, OY = 0;
  function resize() {
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    S = Math.min(W / WORLD.w, H / WORLD.h);
    OX = (W - WORLD.w * S) / 2; OY = (H - WORLD.h * S) / 2;
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  // ---------- Input ----------
  const keys = {};
  const drag = { on: false, base: V(), knob: V() };      // screen pixels
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (/^[1-6]$/.test(k)) { toggleLens(LENSES[+k - 1]); return; }
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
    if (!started) { started = true; }
    if (k === 'r') reset();
    if (k === 'p') paused = !paused;
    keys[k] = true;
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; drag.on = false; });
  canvas.addEventListener('pointerdown', e => {
    if (!started) { started = true; return; }
    if (state.over) { reset(); return; }
    const r = canvas.getBoundingClientRect();
    drag.on = true; drag.base = V(e.clientX - r.left, e.clientY - r.top); drag.knob = V(drag.base.x, drag.base.y);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag.on) return;
    const r = canvas.getBoundingClientRect();
    drag.knob = V(e.clientX - r.left, e.clientY - r.top);
  });
  const endDrag = () => { drag.on = false; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- State ----------
  let state, player, vents, cores, popups, stick;
  let started = false, paused = false;

  function makeVent(i) {
    return { pos: VENT_SPOTS[i], open: VENTS_AT[i], phase: 'idle', t: 0, wait: 3 + i * 1.7, f: 0 };
  }
  function reset() {
    state = { over: null, time: 0, cores: 0, spawnT: 0.5, T: AMB_START, amb: AMB_START, dmg: 0, vol: 0, haze: 0,
      nearest: null, parts: [] };
    player = { pos: V(600, 420), vel: V(), hp: 100, speed: 0 };
    stick = { raw: V(), m: 0, source: 'rest' };
    vents = VENT_SPOTS.map((_, i) => makeVent(i));
    cores = []; popups = [];
  }
  reset();
  const activeVents = () => vents.filter(v => state.cores >= v.open);

  function popup(pos, text, color) { popups.push({ pos: V(pos.x, pos.y), text, color, life: 1.3 }); }

  // ---------- Heat field ----------
  const reachOf = v => lerp(REACH, REACH_FLARE, v.f);   // flare grows the reach…
  const peakOf = v => lerp(PEAK, PEAK_FLARE, v.f);      // …and the peak
  function heatAt(p, parts) {
    const amb = state.amb;
    let T = amb;
    for (const v of activeVents()) {
      const d = dist(p, v.pos);
      const t = invLerp(VENT_CORE, reachOf(v), d);
      const c = lerp(peakOf(v), 0, t);                   // = remap(d, 40…reach → peak…0)
      T += c;
      if (parts) parts.push({ v, d, t, c });
    }
    return T;
  }

  function spawnCore() {
    const act = activeVents();
    for (let tries = 0; tries < 40; tries++) {
      const v = act[Math.floor(Math.random() * act.length)];
      const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 120;
      const p = V(v.pos.x + Math.cos(a) * d, v.pos.y + Math.sin(a) * d);
      if (p.x < 40 || p.x > WORLD.w - 40 || p.y < 110 || p.y > WORLD.h - 30) continue;
      if (act.some(o => dist(o.pos, p) < 60)) continue;
      if (dist(p, player.pos) < 90) continue;
      cores.push({ pos: p, age: 0 });
      return;
    }
  }

  // ---------- Update ----------
  function readStick() {
    let x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    let y = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    if (x || y) {
      const l = Math.hypot(x, y), m = keys.shift ? 0.5 : 1;
      return { raw: V(x / l * m, y / l * m), source: keys.shift ? 'keys (walk)' : 'keys' };
    }
    if (drag.on) {
      const d = sub(drag.knob, drag.base), l = len(d);
      const m = Math.min(1, l / STICK_R);                 // the stick cannot tilt past its rim
      return { raw: l > 0 ? mul(d, m / l) : V(), source: 'drag stick' };
    }
    return { raw: V(0.06, 0.08), source: 'resting (worn stick)' };   // a real stick never reads exactly 0
  }

  function update(dt) {
    for (const p of popups) { p.life -= dt; p.pos.y -= 24 * dt; }
    popups = popups.filter(p => p.life > 0);
    if (state.over) return;
    state.time += dt;
    state.amb = lerp(AMB_START, AMB_END, invLerp(0, AMB_TIME, state.time));   // difficulty over time

    // Stick → speed, with a dead zone
    const s = readStick();
    const m = len(s.raw);
    const speed = settings.deadZone ? remap(m, DEAD, 1, 0, MAX_SPEED) : MAX_SPEED * m;
    stick = { raw: s.raw, m, source: s.source };
    player.speed = speed;
    player.vel = m > 0 ? mul(s.raw, speed / m) : V();
    player.pos = add(player.pos, mul(player.vel, dt));                 // p ← p + v·Δt (Chapter 4)
    player.pos.x = clamp(player.pos.x, PLAYER_R, WORLD.w - PLAYER_R);
    player.pos.y = clamp(player.pos.y, 100 + PLAYER_R, WORLD.h - PLAYER_R);

    // Vents: flare cycle; f = how far into the flare we are, from 0 to 1
    for (const v of activeVents()) {
      v.t += dt;
      if (v.phase === 'idle' && v.t >= v.wait) { v.phase = 'warn'; v.t = 0; }
      else if (v.phase === 'warn' && v.t >= WARN) { v.phase = 'rise'; v.t = 0; }
      else if (v.phase === 'rise' && v.t >= RISE) { v.phase = 'hold'; v.t = 0; }
      else if (v.phase === 'hold' && v.t >= HOLD) { v.phase = 'fall'; v.t = 0; }
      else if (v.phase === 'fall' && v.t >= FALL) { v.phase = 'idle'; v.t = 0; v.wait = 7 + Math.random() * 4; }
      v.f = v.phase === 'rise' ? clamp(v.t / RISE, 0, 1) : v.phase === 'hold' ? 1 : v.phase === 'fall' ? 1 - clamp(v.t / FALL, 0, 1) : 0;
    }

    // Temperature, damage, volume, haze
    const parts = [];
    state.T = heatAt(player.pos, parts);
    state.parts = parts;
    state.dmg = piecewise(DAMAGE, state.T);
    player.hp = clamp(player.hp - state.dmg * dt, 0, 100);              // health itself always stays 0…100
    let nd = Infinity, nv = null;
    for (const p of parts) if (p.d < nd) { nd = p.d; nv = p.v; }
    state.nearest = nv ? { v: nv, d: nd } : null;
    state.vol = remap(nd, VOL_NEAR, VOL_FAR, 1, 0);
    state.haze = remap(state.T, HAZE_FROM, HAZE_TO, 0, HAZE_MAX);

    // Cores
    state.spawnT -= dt;
    if (state.spawnT <= 0 && cores.length < 3) { spawnCore(); state.spawnT = 2.5; }
    for (const c of cores) c.age += dt;
    cores = cores.filter(c => {
      if (dist(c.pos, player.pos) < CORE_PICK) {
        state.cores++; player.hp = Math.min(100, player.hp + CORE_HEAL);
        popup(c.pos, `+1 core  +${CORE_HEAL} hp`, '#7fe0ff');
        const opened = vents.find(v => v.open === state.cores && v.open > 0);
        if (opened) popup(opened.pos, 'a new vent opens!', '#ff9a4a');
        return false;
      }
      return c.age < CORE_LIFE;
    });

    if (state.cores >= WIN) state.over = 'won';
    else if (player.hp <= 0) state.over = 'cooked';
  }

  // ---------- Colors ----------
  const hpHue = hp => remap(hp, 0, 100, 0, 130);             // red at 0, green at 100
  const heatHue = T => remap(T, 20, 100, 200, 0);             // blue when cool, red when hot
  function hslToRgb(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [255 * f(0), 255 * f(8), 255 * f(4)];
  }
  const HP_LOW = hslToRgb(0, 70, 55), HP_HIGH = hslToRgb(130, 70, 55);
  function hpRgb(hp) {
    if (settings.colorMode === 0) return hslToRgb(hpHue(hp), 70, 55);
    const t = invLerp(0, 100, hp);
    return [0, 1, 2].map(i => lerp(HP_LOW[i], HP_HIGH[i], t));
  }
  const rgbStr = c => `rgb(${c.map(v => Math.round(v)).join(', ')})`;
  const heatColor = T => `hsl(${heatHue(T)} 80% 60%)`;

  // ---------- Drawing ----------
  function text(t, x, y, color = '#e6e9ef', size = 12, align = 'left') {
    ctx.font = `${size}px Menlo, Consolas, monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,12,16,.9)'; ctx.strokeText(t, x, y);
    ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  function circle(p, r, fill, stroke, lw = 2) {
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line(a, b, color, lw = 1.5) {
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
    ctx.fillStyle = '#15130f'; ctx.fillRect(0, 0, WORLD.w, WORLD.h);
    ctx.fillStyle = '#101318'; ctx.fillRect(0, 0, WORLD.w, 100);
    ctx.strokeStyle = '#1d1a16'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= WORLD.w; x += 40) { ctx.moveTo(x, 100); ctx.lineTo(x, WORLD.h); }
    for (let y = 100; y <= WORLD.h; y += 40) { ctx.moveTo(0, y); ctx.lineTo(WORLD.w, y); }
    ctx.stroke();

    // Vents
    for (const v of activeVents()) {
      const reach = reachOf(v);
      const g = ctx.createRadialGradient(v.pos.x, v.pos.y, VENT_CORE, v.pos.x, v.pos.y, reach);
      g.addColorStop(0, `rgba(255,110,40,${0.32 + 0.2 * v.f})`);
      g.addColorStop(1, 'rgba(255,110,40,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(v.pos.x, v.pos.y, reach, 0, Math.PI * 2); ctx.fill();
      circle(v.pos, VENT_CORE, v.f > 0 ? '#ffcc66' : '#d9622b', '#ff9a4a', 3);
      circle(v.pos, VENT_CORE * 0.55, '#3a1b0e');
      if (v.phase === 'warn') {
        const pulse = 0.5 + 0.5 * Math.sin(v.t * 18);
        circle(v.pos, VENT_CORE + 8 + pulse * 6, null, `rgba(255,220,120,${0.4 + 0.5 * pulse})`, 3);
        text('FLARE!', v.pos.x, v.pos.y - VENT_CORE - 18, '#ffcc66', 13, 'center');
      }
    }

    // Cores (fade out over their last 3 seconds: opacity = remap(age, 6…9 → 1…0))
    for (const c of cores) {
      const a = remap(c.age, CORE_FADE, CORE_LIFE, 1, 0);
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.fillStyle = '#7fe0ff'; ctx.strokeStyle = '#e6f9ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(c.pos.x, c.pos.y - 11); ctx.lineTo(c.pos.x + 9, c.pos.y);
      ctx.lineTo(c.pos.x, c.pos.y + 11); ctx.lineTo(c.pos.x - 9, c.pos.y); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Player: body color follows the temperature
    circle(player.pos, PLAYER_R, heatColor(state.T), '#0b0d12', 3);

    for (const l of LENSES) if (l.on && l.draw) l.draw();

    for (const p of popups) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      text(p.text, p.pos.x, p.pos.y, p.color, 13, 'center');
      ctx.globalAlpha = 1;
    }

    // Heat haze over the whole arena
    if (state.haze !== 0) {
      const g = ctx.createRadialGradient(600, 430, 200, 600, 430, 720);
      g.addColorStop(0, 'rgba(255,80,20,0)');
      g.addColorStop(1, `rgba(255,80,20,${state.haze})`);
      ctx.fillStyle = g; ctx.fillRect(0, 100, WORLD.w, WORLD.h - 100);
    }

    drawHud();

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (drag.on) drawStickWidget(drag.base, false);
    for (const l of LENSES) if (l.on && l.screen) l.screen();
    if (!started) overlay('HEALTH & HEAT', ['Collect 20 cooling cores from around the heat vents', 'Stay cool: health drains when the temperature passes 50°',
      'WASD or drag anywhere to move', 'Press any key to start']);
    else if (state.over === 'won') overlay('COOLED DOWN', [`${WIN} cores in ${f1(state.time)} s · ${f0(player.hp)} hp left`, 'Press R or click to play again']);
    else if (state.over === 'cooked') overlay('OVERHEATED', [`${state.cores} of ${WIN} cores · ${f1(state.time)} s`, 'Press R or click to try again']);
    else if (paused) overlay('PAUSED', ['Press P to resume']);
  }

  function drawHud() {
    const x = 20;
    // Health bar: width = lerp(0, 220, hp / 100); color by hue (or RGB)
    ctx.fillStyle = '#1f2430'; ctx.fillRect(x, 18, BAR_W, 16);
    ctx.fillStyle = rgbStr(hpRgb(player.hp));
    ctx.fillRect(x, 18, lerp(0, BAR_W, invLerp(0, 100, player.hp)), 16);
    text(`HP ${f0(player.hp)}`, x + BAR_W + 10, 31, '#e6e9ef', 13);
    // Heat bar: width = lerp(0, 220, invLerp(0, 100, T))
    ctx.fillStyle = '#1f2430'; ctx.fillRect(x, 44, BAR_W, 16);
    ctx.fillStyle = heatColor(state.T);
    ctx.fillRect(x, 44, lerp(0, BAR_W, invLerp(0, 100, state.T)), 16);
    text(`HEAT ${f0(state.T)}°`, x + BAR_W + 10, 57, '#e6e9ef', 13);
    ctx.strokeStyle = '#6b7385'; ctx.lineWidth = 1.5;
    const tick = x + BAR_W * 0.5;
    ctx.beginPath(); ctx.moveTo(tick, 42); ctx.lineTo(tick, 62); ctx.stroke();
    text(`${state.dmg > 0 ? '−' + f1(state.dmg) : '+' + f1(-state.dmg)} hp/s · ambient ${f0(state.amb)}°`, x, 84, state.dmg > 0 ? '#ff8a6b' : '#5fd18b', 12);

    text(`cores ${state.cores}/${WIN}`, 600, 34, '#7fe0ff', 18, 'center');
    text(`time ${f1(state.time)} s`, 600, 58, '#9aa3b2', 13, 'center');

    // Volume meter (visual only): 10 segments, lit = round(volume × 10)
    const mx = 1000, my = 18, lit = Math.round(state.vol * 10);
    text('VENT ROAR', mx - 10, 32, '#9aa3b2', 12, 'right');
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = i < lit ? (i < 6 ? '#5fd18b' : i < 8 ? '#ffb547' : '#ff6b6b') : '#1f2430';
      ctx.fillRect(mx + i * 17, my, 13, 18);
    }
    for (let i = 10; i < lit; i++) { ctx.fillStyle = '#ff2bd6'; ctx.fillRect(mx + i * 17, my, 13, 18); }   // overshoot!
    text(`volume ${f0(state.vol * 100)}%`, mx, 58, state.vol < 0 || state.vol > 1 ? '#ff6b6b' : '#9aa3b2', 12);
  }

  function overlay(title, lines) {
    ctx.fillStyle = 'rgba(10,12,16,.72)'; ctx.fillRect(0, 0, W, H);
    text(title, W / 2, H / 2 - 30, '#e6e9ef', 28, 'center');
    lines.forEach((l, i) => text(l, W / 2, H / 2 + i * 20, '#9aa3b2', 13, 'center'));
  }

  // Analog stick picture in screen pixels
  function drawStickWidget(c, labels) {
    const deadR = DEAD * STICK_R;
    circle(c, STICK_R, 'rgba(31,36,48,.55)', '#4a5162', 2);
    if (settings.deadZone) { circle(c, deadR, 'rgba(255,107,107,.15)', '#ff6b6b', 1.5); }
    const k = add(c, mul(stick.raw, STICK_R));
    line(c, k, '#6cb8ff', 2);
    circle(k, 8, '#6cb8ff', '#0b0d12', 2);
    if (labels) {
      text(`m = ${f2(stick.m)}`, c.x, c.y + STICK_R + 18, '#e6e9ef', 12, 'center');
      text(`speed ${f0(player.speed)} px/s`, c.x, c.y + STICK_R + 34, player.speed < 0 ? '#ff6b6b' : '#6cb8ff', 12, 'center');
      if (settings.deadZone) text('dead zone', c.x, c.y - deadR - 4, '#ff6b6b', 11, 'center');
    }
  }

  // ---------- Lenses ----------
  const LENSES = [
    {
      name: 'Lerp & bars', chap: 'Chapter 5.2–5.3',
      formula: 'lerp(a, b, t) = a + (b − a)·t\ninvLerp(a, b, v) = (v − a) / (b − a)\nbar width = lerp(0, 220, hp / 100)\nreach = lerp(240, 330, flare)',
      used: ['Health, mana, progress and loading bars', 'Blending between two positions, sizes or colors',
        'Growing and shrinking effects over time', 'Moving a camera part of the way to a target'],
      tryThis: 'Wait for a vent to flare. Its flare value f goes 0 → 1 in 0.8 s, and its reach slides from 240 to 330 by lerp.',
      draw() {
        for (const v of activeVents()) {
          ctx.setLineDash([5, 6]); circle(v.pos, reachOf(v), null, 'rgba(255,181,71,.6)', 1.5); ctx.setLineDash([]);
          text(`f = ${f2(v.f)} → reach ${f0(reachOf(v))}`, v.pos.x, v.pos.y + VENT_CORE + 20, '#ffb547', 12, 'center');
        }
        text(`t = ${f2(invLerp(0, 100, player.hp))}`, 20 + BAR_W / 2, 31, '#0b0d12', 12, 'center');
      },
      live() {
        const t = invLerp(0, 100, player.hp);
        const v = state.nearest && state.nearest.v;
        return `health\n t = invLerp(0, 100, ${f1(player.hp)}) = ${f2(t)}\n width = lerp(0, 220, ${f2(t)}) = ${f1(lerp(0, BAR_W, t))} px\n` +
          (v ? `\nnearest vent (${v.phase})\n f = ${f2(v.f)}\n reach = 240 + (330 − 240) × ${f2(v.f)} = ${f1(reachOf(v))}\n peak  = 80 + (110 − 80) × ${f2(v.f)} = ${f1(peakOf(v))}` : '') +
          `\n\nambient = lerp(20, 45, ${f2(invLerp(0, AMB_TIME, state.time))}) = ${f1(state.amb)}°`;
      },
    },
    {
      name: 'Remap & clamp', chap: 'Chapter 5.4–5.5',
      formula: 'heat from a vent:\n  c = remap(d, 40…240 → 80…0)\nT = ambient + sum of every c\nclamp t to 0…1 before the lerp',
      used: ['Heat, radiation and damage falling off with distance', 'Fog density and draw distance',
        'Difficulty scaling by level or time', 'Mapping any input range to any output range'],
      tryThis: 'Untick "Clamp t". Far from a vent, d > 240 makes c negative, so the heat bar runs backwards and you heal. Close in, T shoots past 100 and your color goes wrong.',
      controls: `<label><input type="checkbox" data-set="clampT"> Clamp t (stay inside 0…1)</label>`,
      draw() {
        for (const p of state.parts) {
          ctx.setLineDash([3, 5]); circle(p.v.pos, reachOf(p.v), null, 'rgba(255,154,74,.5)', 1); ctx.setLineDash([]);
          if (p.c === 0 && settings.clampT) continue;
          line(player.pos, p.v.pos, p.c >= 0 ? 'rgba(255,154,74,.8)' : 'rgba(108,184,255,.8)', 1.5);
          const mid = mul(add(player.pos, p.v.pos), 0.5);
          text(`d ${f0(p.d)} → ${p.c >= 0 ? '+' : ''}${f1(p.c)}°`, mid.x, mid.y - 6, p.c >= 0 ? '#ffb547' : '#6cb8ff', 12, 'center');
        }
      },
      live() {
        let s = `clamp t: ${settings.clampT ? 'on' : 'OFF'}\nambient ${f1(state.amb)}°\n`;
        for (const p of state.parts) s += `vent d=${f0(p.d).padStart(4)}  t=${f2(p.t).padStart(5)}  c=${f1(p.c).padStart(6)}°\n`;
        s += `T = ${f1(state.T)}°`;
        return s;
      },
    },
    {
      name: 'Colors', chap: 'Chapter 5.6',
      formula: 'health hue = remap(hp, 0…100 → 0°…130°)\nbody hue   = remap(T, 20…100 → 200°…0°)\nRGB blend  = lerp each of R, G, B',
      used: ['Health bars going green → yellow → red', 'Heat, cold and damage tints',
        'Day–night sky colors', 'Fading sprites in and out'],
      tryThis: 'Switch the health bar to "RGB channels" and lose some health. Halfway, the hue blend is yellow; the RGB blend is a muddy olive.',
      controls: `<label>Blend health color by <select data-set="colorMode"><option value="0">hue</option><option value="1">RGB channels</option></select></label>`,
      screen() {
        // Two gradient strips: hue blend and RGB blend, from hp 0 to hp 100
        const x = 16, y = H - 66, w = Math.min(260, W - 32);
        for (let i = 0; i < w; i++) {
          const hp = i / (w - 1) * 100;
          ctx.fillStyle = rgbStr(hslToRgb(remap(hp, 0, 100, 0, 130), 70, 55)); ctx.fillRect(x + i, y, 1, 16);
          const t = hp / 100;
          ctx.fillStyle = rgbStr([0, 1, 2].map(k => lerp(HP_LOW[k], HP_HIGH[k], t))); ctx.fillRect(x + i, y + 30, 1, 16);
        }
        text('hue blend', x, y - 4, '#9aa3b2', 11);
        text('RGB blend', x, y + 26, '#9aa3b2', 11);
        const mx = x + clamp(player.hp / 100, 0, 1) * (w - 1);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(mx, y - 2); ctx.lineTo(mx, y + 48); ctx.stroke();
      },
      live() {
        const c = hpRgb(player.hp);
        return `hp ${f1(player.hp)}\nhue = remap(hp, 0…100 → 0…130) = ${f0(hpHue(player.hp))}°\nbar color (${settings.colorMode ? 'RGB' : 'hue'}) = ${rgbStr(c)}\n\nT ${f1(state.T)}°\nbody hue = remap(T, 20…100 → 200…0) = ${f0(heatHue(state.T))}°`;
      },
    },
    {
      name: 'Volume & fading', chap: 'Chapter 5.7',
      formula: 'volume  = remap(d, 60…420 → 1…0)\nhaze    = remap(T, 60…110 → 0…0.55)\nopacity = remap(age, 6…9 → 1…0)',
      used: ['Sound fading with distance', 'Fog and atmospheric fade', 'Damage vignettes and screen tints',
        'Pickups and corpses fading before they vanish'],
      tryThis: 'Walk straight away from a vent and watch the meter fall one bar every 36 px. Untick "Clamp t" (lens 2): the meter goes negative far away and over 100% up close.',
      draw() {
        const n = state.nearest; if (!n) return;
        line(player.pos, n.v.pos, 'rgba(95,209,139,.8)', 1.5);
        ctx.setLineDash([4, 6]);
        circle(n.v.pos, VOL_NEAR, null, 'rgba(95,209,139,.7)', 1); circle(n.v.pos, VOL_FAR, null, 'rgba(95,209,139,.4)', 1);
        ctx.setLineDash([]);
        text(`d = ${f0(n.d)} → volume ${f0(state.vol * 100)}%`, player.pos.x, player.pos.y - 24, '#5fd18b', 12, 'center');
        for (const c of cores) text(`${f2(remap(c.age, CORE_FADE, CORE_LIFE, 1, 0))}`, c.pos.x, c.pos.y - 16, '#7fe0ff', 11, 'center');
      },
      live() {
        const n = state.nearest;
        return `nearest vent d   ${n ? f0(n.d) : '–'}\nt = (d − 60) / 360 = ${n ? f2((n.d - VOL_NEAR) / (VOL_FAR - VOL_NEAR)) : '–'}\nvolume           ${f0(state.vol * 100)}%\n\nT                ${f1(state.T)}°\nhaze opacity     ${f2(state.haze)}\n\ncores (age → opacity)\n` +
          cores.map(c => ` ${f1(c.age)} s → ${f2(remap(c.age, CORE_FADE, CORE_LIFE, 1, 0))}`).join('\n');
      },
    },
    {
      name: 'Stick & dead zone', chap: 'Chapter 5.8',
      formula: 'm = how far the stick is tilted (0…1)\nspeed = remap(m, 0.2…1 → 0…220)\nwithout a dead zone: speed = 220·m',
      used: ['Analog-stick movement and steering', 'Triggers mapped to throttle',
        'Mouse or touch drag mapped to aim speed', 'Ignoring stick drift'],
      tryThis: 'Let go of every key: the worn stick still reads m = 0.10. Untick "Dead zone" and you creep. With the dead zone on but "Clamp t" off, you creep backwards.',
      controls: `<label><input type="checkbox" data-set="deadZone"> Dead zone (ignore m below 0.2)</label>`,
      screen() { drawStickWidget(V(W - STICK_R - 24, H - STICK_R - 54), true); },
      live() {
        const t = (stick.m - DEAD) / (1 - DEAD);
        return `input        ${stick.source}\nstick        (${f2(stick.raw.x)}, ${f2(stick.raw.y)})\nm = |stick|  ${f2(stick.m)}\n` +
          (settings.deadZone ? `t = (m − 0.2) / 0.8 = ${f2(t)}${settings.clampT ? ` → ${f2(clamp(t, 0, 1))}` : ' (not clamped)'}\nspeed = lerp(0, 220, t) = ${f1(player.speed)} px/s` : `speed = 220 × ${f2(stick.m)} = ${f1(player.speed)} px/s`);
      },
    },
    {
      name: 'Piecewise damage', chap: 'Chapter 5.9',
      formula: 'temperature → health lost per second\n 30° → −3   (healing)\n 50° →  0\n 80° →  6\n100° → 20\nstraight lines between the stops',
      used: ['Damage and armor curves', 'Experience and loot tables between key levels',
        'Engine torque and gear curves', 'Color gradients with several stops'],
      tryThis: 'Stand where T is about 65°: you lose 3 hp per second. Step 15° hotter, to 80°, and it doubles to 6. At 90° it is 13 per second.',
      screen() {
        const x = 16, w = 240, h = 110, y = H - 140;
        const X = T => x + T / 130 * w, Y = r => y + h - (r + 5) / 30 * h;
        ctx.fillStyle = 'rgba(17,21,28,.85)'; ctx.fillRect(x - 6, y - 18, w + 12, h + 34);
        ctx.strokeStyle = '#2a3140'; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(x, Y(0)); ctx.lineTo(x + w, Y(0)); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.stroke();
        ctx.strokeStyle = '#ffb547'; ctx.lineWidth = 2; ctx.beginPath();
        for (let i = 0; i <= w; i++) { const T = i / w * 130, r = piecewise(DAMAGE, T); if (i) ctx.lineTo(X(T), Y(r)); else ctx.moveTo(X(T), Y(r)); }
        ctx.stroke();
        for (const [T, r] of DAMAGE) circle(V(X(T), Y(r)), 3, '#ffb547');
        const T = clamp(state.T, 0, 130);
        circle(V(X(T), Y(clamp(state.dmg, -5, 25))), 5, '#6cb8ff', '#0b0d12', 2);
        text('hp/s lost', x, y - 6, '#9aa3b2', 11);
        text('T →', x + w - 24, y + h + 12, '#9aa3b2', 11);
      },
      live() {
        const T = state.T;
        let i = 0; while (i < DAMAGE.length - 2 && T > DAMAGE[i + 1][0]) i++;
        const [a, ra] = DAMAGE[i], [b, rb] = DAMAGE[i + 1];
        const out = T < DAMAGE[0][0] || T > DAMAGE[DAMAGE.length - 1][0];
        return `T = ${f1(T)}°\nsegment ${a}°…${b}° (${ra} → ${rb} hp/s)\nt = (${f1(T)} − ${a}) / ${b - a} = ${f2((T - a) / (b - a))}` +
          `${out ? (settings.clampT ? ' → clamped' : '  (EXTRAPOLATING)') : ''}\nrate = ${f2(state.dmg)} hp/s\nhealth ${f1(player.hp)}`;
      },
    },
  ];
  for (const l of LENSES) l.on = false;

  // ---------- Panel ----------
  const lensesEl = document.getElementById('lenses');
  const cardEl = document.getElementById('card');
  let selected = null, liveEl = null;
  LENSES.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'lens';
    b.innerHTML = `<kbd>${i + 1}</kbd>${l.name}`;
    b.addEventListener('click', () => { toggleLens(l); b.blur(); });
    l.btn = b; lensesEl.appendChild(b);
  });
  function toggleLens(l) {
    if (!l) return;
    if (l.on && selected === l) l.on = false; else l.on = true;
    selected = l.on ? l : LENSES.find(x => x.on) || null;
    for (const x of LENSES) { x.btn.classList.toggle('on', x.on); x.btn.classList.toggle('sel', x === selected); }
    renderCard();
  }
  function renderCard() {
    if (!selected) {
      cardEl.innerHTML = `<h2>No lens on</h2><p style="margin:0;color:var(--muted)">Play a round first. Then press 1–6 to see the lerps, remaps and clamps behind every bar and color.</p>`;
      liveEl = null; return;
    }
    const l = selected;
    cardEl.innerHTML = `
      <h2>${l.name}</h2><span class="chap">${l.chap}</span>
      <div class="formula">${l.formula}</div>
      <h3>Where it's used in games</h3>
      <ul>${l.used.map(u => `<li>${u}</li>`).join('')}</ul>
      <h3>Try this</h3><div class="try">${l.tryThis}</div>
      ${l.controls ? `<div class="controls">${l.controls}</div>` : ''}
      <h3>Live numbers</h3><div class="live"></div>`;
    liveEl = cardEl.querySelector('.live');
    cardEl.querySelectorAll('[data-set]').forEach(el => {
      const key = el.dataset.set;
      const showEl = cardEl.querySelector(`[data-show="${key}"]`);
      if (el.type === 'checkbox') el.checked = settings[key]; else el.value = settings[key];
      if (showEl) showEl.textContent = settings[key];
      el.addEventListener('input', () => {
        settings[key] = el.type === 'checkbox' ? el.checked : parseFloat(el.value);
        if (showEl) showEl.textContent = settings[key];
      });
      el.addEventListener('change', () => el.blur());
    });
    updateLive();
  }
  function updateLive() { if (liveEl && selected) liveEl.textContent = selected.live(); }
  renderCard();

  // ---------- Loop ----------
  let last = performance.now(), liveTimer = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (started && !paused) update(dt);
    render();
    liveTimer -= dt;
    if (liveTimer <= 0) { updateLive(); liveTimer = 0.1; }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
