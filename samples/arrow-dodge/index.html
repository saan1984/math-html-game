<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrow Dodge</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b23;
    --panel-2: #1f2430;
    --line: #2a3140;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #6cb8ff;
    --warn: #ffb547;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #app { display: flex; height: 100vh; }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { width: 340px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .lenses { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .lens { display: flex; align-items: center; gap: 6px; text-align: left; padding: 7px 8px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font: inherit; font-size: 12.5px; cursor: pointer; }
  .lens kbd { font: 11px Menlo, Consolas, monospace; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px; }
  .lens.on { border-color: var(--accent); background: #1d2b3d; }
  .lens.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .chap { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid #2d4766;
    border-radius: 999px; padding: 1px 8px; margin-bottom: 8px; }
  .formula { font: 13px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin: 6px 0 10px; white-space: pre-wrap; color: #cfe6ff; }
  .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 4px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin: 2px 0; }
  .try { color: var(--warn); }
  .live { font: 12.5px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin-top: 6px; white-space: pre; overflow-x: auto; min-height: 3em; }
  .controls { margin-top: 8px; display: grid; gap: 6px; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls input[type=range] { flex: 1; }
  .help { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  .help b { color: var(--text); }
  @media (max-width: 820px) {
    #app { flex-direction: column; height: auto; }
    #stage { flex: none; height: 62vh; }
    #panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
  <aside id="panel">
    <h1>Arrow Dodge</h1>
    <p class="sub">Four archers aim at you. Dodge their arrows, grab gems, and score close calls.</p>
    <div class="lenses" id="lenses"></div>
    <div class="card" id="card"></div>
    <div class="help">
      <b>Move</b> WASD / arrows · <b>Lenses</b> keys 1–6 · <b>Restart</b> R · <b>Pause</b> P
    </div>
  </aside>
</div>

<script>
(() => {
  // ---------- Vector math (this whole chapter, in six lines) ----------
  const V = (x = 0, y = 0) => ({ x, y });
  const add = (a, b) => V(a.x + b.x, a.y + b.y);
  const sub = (a, b) => V(a.x - b.x, a.y - b.y);
  const mul = (a, s) => V(a.x * s, a.y * s);
  const len = a => Math.hypot(a.x, a.y);
  const norm = a => { const l = len(a); return l > 0 ? V(a.x / l, a.y / l) : V(); };
  const dist = (a, b) => len(sub(a, b));
  const fromAngle = (t, r = 1) => V(Math.cos(t) * r, Math.sin(t) * r);
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const rand = (a, b) => a + Math.random() * (b - a);
  const f0 = n => Math.round(n).toString();
  const f1 = n => (Math.abs(n) < 0.05 ? 0 : n).toFixed(1);
  const f2 = n => (Math.abs(n) < 0.005 ? 0 : n).toFixed(2);
  const vs = (v, f = f0) => `(${f(v.x)}, ${f(v.y)})`;

  const settings = {
    normalizeInput: true,
    normalizeAim: true,
    wind: true,
    homing: false,     // forced on from the lens; otherwise appears after 30 s
    timeScale: 1,
  };
  const PLAYER_SPEED = 200;
  const ARROW_SPEED = 260;
  const NEAR = 36;               // close-call radius
  const HOMING_TURN = 600;       // max steering, px/s per second
  const KNOCKBACK = 400;

  // ---------- Canvas ----------
  const WORLD = { w: 1000, h: 700 };
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 800, H = 600, DPR = 1, S = 1, OX = 0, OY = 0;
  function resize() {
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    S = Math.min(W / WORLD.w, H / WORLD.h);
    OX = (W - WORLD.w * S) / 2; OY = (H - WORLD.h * S) / 2;
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  // ---------- Input ----------
  const keys = {};
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (/^[1-6]$/.test(k)) { toggleLens(LENSES[+k - 1]); return; }
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
    if (!started) started = true;
    if (k === 'r') reset();
    if (k === 'p') paused = !paused;
    keys[k] = true;
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  canvas.addEventListener('pointerdown', () => { started = true; if (state.over) reset(); });

  // ---------- State ----------
  let state, player, archers, arrows, gems, popups, wind, lastShot;
  let started = false, paused = false;

  function reset() {
    state = { over: false, time: 0, score: 0, closeCalls: 0, gems: 0, windTimer: 0 };
    player = { pos: V(500, 380), input: V(), vel: V(), push: V(), r: 14, hearts: 3, hurt: 0 };
    // Archers walk back and forth along the four edges
    archers = [
      { edge: 'top', t: 0.2, dir: 1, cd: 1.0 },
      { edge: 'right', t: 0.6, dir: -1, cd: 1.6 },
      { edge: 'bottom', t: 0.8, dir: -1, cd: 2.2 },
      { edge: 'left', t: 0.3, dir: 1, cd: 2.8 },
    ];
    for (const a of archers) a.pos = edgePos(a);
    arrows = []; gems = []; popups = [];
    wind = V(); newWind();
    lastShot = null;
    for (let i = 0; i < 3; i++) spawnGem();
  }

  function edgePos(a) {
    const m = 30;
    if (a.edge === 'top') return V(m + a.t * (WORLD.w - 2 * m), m);
    if (a.edge === 'bottom') return V(m + a.t * (WORLD.w - 2 * m), WORLD.h - m);
    if (a.edge === 'left') return V(m, m + a.t * (WORLD.h - 2 * m));
    return V(WORLD.w - m, m + a.t * (WORLD.h - 2 * m));
  }
  function newWind() {
    wind = fromAngle(rand(0, Math.PI * 2), rand(20, 80));
    state.windTimer = 12;
  }
  function spawnGem() {
    gems.push({ pos: V(rand(90, WORLD.w - 90), rand(90, WORLD.h - 90)), t: rand(0, 6) });
  }
  function popup(pos, text, color) { popups.push({ pos: V(pos.x, pos.y), text, color, life: 1.2 }); }

  // Aim: direction = normalize(target − archer), velocity = direction × speed (+ wind)
  function shoot(a) {
    const d = sub(player.pos, a.pos);
    const homing = settings.homing || state.time > 30 && Math.random() < 0.3;
    const launch = settings.normalizeAim ? mul(norm(d), ARROW_SPEED) : mul(d, 0.9);
    const w = settings.wind ? wind : V();
    const vel = add(launch, w);
    const arrow = { pos: V(a.pos.x, a.pos.y), vel, launch, wind: w, d, from: a, homing, life: homing ? 4.5 : 7,
      minDist: Infinity, done: false, steer: null, desired: null };
    arrows.push(arrow);
    lastShot = arrow;
  }

  // ---------- Update ----------
  function update(dt) {
    for (const p of popups) { p.life -= dt; p.pos.y -= 24 * dt; }
    popups = popups.filter(p => p.life > 0);
    if (state.over) return;
    state.time += dt;
    state.windTimer -= dt;
    if (state.windTimer <= 0) newWind();

    // Player: input vector → (normalize) → × speed, plus a decaying knockback push
    const ix = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    const iy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    let input = V(ix, iy);
    if (settings.normalizeInput) input = norm(input);
    player.input = input;
    player.vel = add(mul(input, PLAYER_SPEED), player.push);
    player.pos = add(player.pos, mul(player.vel, dt));            // p ← p + v·Δt
    player.pos.x = clamp(player.pos.x, 60, WORLD.w - 60);
    player.pos.y = clamp(player.pos.y, 60, WORLD.h - 60);
    player.push = mul(player.push, Math.exp(-6 * dt));
    player.hurt -= dt;

    // Archers
    const interval = Math.max(0.9, 2.6 - state.time * 0.03);
    for (const a of archers) {
      a.t += a.dir * 0.08 * dt;
      if (a.t > 0.95 || a.t < 0.05) { a.dir *= -1; a.t = clamp(a.t, 0.05, 0.95); }
      a.pos = edgePos(a);
      a.cd -= dt;
      if (a.cd <= 0) { shoot(a); a.cd = interval * rand(0.8, 1.25); }
    }

    // Arrows
    for (const ar of arrows) {
      if (ar.homing) {
        // Steering: desired − current, limited, then keep the speed
        const speed = len(ar.vel);
        const desired = mul(norm(sub(player.pos, ar.pos)), speed);
        let steer = sub(desired, ar.vel);
        const maxStep = HOMING_TURN * dt;
        if (len(steer) > maxStep) steer = mul(norm(steer), maxStep);
        ar.vel = mul(norm(add(ar.vel, steer)), speed);
        ar.desired = desired; ar.steer = steer;
      }
      ar.pos = add(ar.pos, mul(ar.vel, dt));
      ar.life -= dt;

      // Distance: hit, or close call when the arrow starts moving away again
      const d = dist(ar.pos, player.pos);
      if (!ar.done && d < player.r + 4) {
        ar.done = true; ar.life = 0;
        if (player.hurt <= 0) {
          player.hearts--; player.hurt = 1;
          player.push = mul(norm(ar.vel), KNOCKBACK);            // knockback along the arrow
          popup(V(player.pos.x, player.pos.y - 26), 'HIT', '#ff6b6b');
          if (player.hearts <= 0) state.over = true;
        }
      } else if (!ar.done) {
        if (d < ar.minDist) ar.minDist = d;
        else if (ar.minDist < NEAR) {
          ar.done = true; state.closeCalls++; state.score += 5;
          popup(V(player.pos.x, player.pos.y - 26), `close call! ${f0(ar.minDist)} px`, '#ffb547');
        }
      }
    }
    arrows = arrows.filter(ar => ar.life > 0 && ar.pos.x > -40 && ar.pos.y > -40 && ar.pos.x < WORLD.w + 40 && ar.pos.y < WORLD.h + 40);

    // Gems
    for (const g of gems) {
      g.t += dt;
      if (dist(g.pos, player.pos) < player.r + 12) {
        g.taken = true; state.gems++; state.score += 10;
        popup(V(g.pos.x, g.pos.y - 16), '+10', '#5fd18b');
      }
    }
    gems = gems.filter(g => !g.taken);
    while (gems.length < 3) spawnGem();
    state.score += dt;
  }

  // ---------- Drawing ----------
  function arrowVec(from, vec, color, label, lw = 2.5, labelColor) {
    const to = add(from, vec);
    if (len(vec) < 2) return;
    const a = Math.atan2(vec.y, vec.x);
    ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(to.x, to.y);
    ctx.lineTo(to.x - Math.cos(a - .4) * 10, to.y - Math.sin(a - .4) * 10);
    ctx.lineTo(to.x - Math.cos(a + .4) * 10, to.y - Math.sin(a + .4) * 10);
    ctx.closePath(); ctx.fill();
    if (label) text(label, to.x + 6, to.y - 6, labelColor || color, 13);
  }
  function text(t, x, y, color = '#e6e9ef', size = 12, align = 'left') {
    ctx.font = `${size}px Menlo, Consolas, monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,12,16,.9)'; ctx.strokeText(t, x, y);
    ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  function circle(p, r, fill, stroke, lw = 2) {
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function dashed(on) { ctx.setLineDash(on ? [6, 6] : []); }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);

    ctx.fillStyle = '#131720'; ctx.fillRect(0, 0, WORLD.w, WORLD.h);
    ctx.strokeStyle = '#1a1f29'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= WORLD.w; x += 50) { ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.h); }
    for (let y = 0; y <= WORLD.h; y += 50) { ctx.moveTo(0, y); ctx.lineTo(WORLD.w, y); }
    ctx.stroke();
    ctx.strokeStyle = '#2b3242'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, WORLD.w - 2, WORLD.h - 2);

    // Gems bob a little
    for (const g of gems) {
      const p = V(g.pos.x, g.pos.y + Math.sin(g.t * 3) * 3);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#5fd18b'; ctx.fillRect(-7, -7, 14, 14);
      ctx.strokeStyle = '#1f7a45'; ctx.lineWidth = 2; ctx.strokeRect(-7, -7, 14, 14);
      ctx.restore();
    }

    // Archers
    for (const a of archers) {
      circle(a.pos, 15, '#3b2a20', '#ffb547', 3);
      const aim = norm(sub(player.pos, a.pos));
      const tip = add(a.pos, mul(aim, 22));
      ctx.strokeStyle = '#ffb547'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(a.pos.x, a.pos.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
    }

    // Arrows point along their velocity
    for (const ar of arrows) {
      const dir = norm(ar.vel);
      const tail = sub(ar.pos, mul(dir, 22));
      ctx.strokeStyle = ar.homing ? '#b48cff' : '#e6e9ef'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(tail.x, tail.y); ctx.lineTo(ar.pos.x, ar.pos.y); ctx.stroke();
      const a = Math.atan2(dir.y, dir.x);
      ctx.fillStyle = ar.homing ? '#b48cff' : '#e6e9ef';
      ctx.beginPath(); ctx.moveTo(ar.pos.x + dir.x * 4, ar.pos.y + dir.y * 4);
      ctx.lineTo(ar.pos.x - Math.cos(a - .5) * 8, ar.pos.y - Math.sin(a - .5) * 8);
      ctx.lineTo(ar.pos.x - Math.cos(a + .5) * 8, ar.pos.y - Math.sin(a + .5) * 8);
      ctx.closePath(); ctx.fill();
    }

    // Player
    const blink = player.hurt > 0 && Math.floor(player.hurt * 12) % 2 === 0;
    if (!blink) circle(player.pos, player.r, '#2a5d8f', '#6cb8ff', 3);

    for (const l of LENSES) if (l.on) l.draw();

    for (const p of popups) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      text(p.text, p.pos.x, p.pos.y, p.color, 14, 'center');
      ctx.globalAlpha = 1;
    }

    // HUD
    text(`${'♥'.repeat(Math.max(0, player.hearts))}${'♡'.repeat(3 - Math.max(0, player.hearts))}`, 60, 34, '#ff6b6b', 20);
    text(`score ${f0(state.score)}   time ${state.time.toFixed(1)}s   close calls ${state.closeCalls}   gems ${state.gems}`, 160, 32, '#9aa3b2', 13);
    // Wind gauge
    const gc = V(WORLD.w - 190, 34);
    text('wind', gc.x - 62, gc.y + 5, '#9aa3b2', 12);
    circle(gc, 22, 'rgba(23,27,35,.9)', '#2a3140', 1);
    if (settings.wind) arrowVec(gc, mul(wind, 0.25), '#6cb8ff', null, 2);
    text(settings.wind ? `w = ${vs(wind)}` : 'off', gc.x + 30, gc.y + 5, '#6cb8ff', 12);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!started) overlay('ARROW DODGE', ['Dodge the arrows · grab the gems', 'WASD or arrow keys to move', 'Press any key to start']);
    else if (state.over) overlay('OUT OF HEARTS', [`score ${f0(state.score)} · ${state.time.toFixed(1)} s · ${state.closeCalls} close calls`, 'Press R or click to play again']);
    else if (paused) overlay('PAUSED', ['Press P to resume']);
  }

  function overlay(title, lines) {
    ctx.fillStyle = 'rgba(10,12,16,.72)'; ctx.fillRect(0, 0, W, H);
    text(title, W / 2, H / 2 - 16, '#e6e9ef', 28, 'center');
    lines.forEach((l, i) => text(l, W / 2, H / 2 + 14 + i * 20, '#9aa3b2', 13, 'center'));
  }

  // ---------- Lenses ----------
  function nearestArcher() {
    let best = null, bd = Infinity;
    for (const a of archers) { const d = dist(a.pos, player.pos); if (d < bd) { bd = d; best = a; } }
    return best;
  }
  function nearestArrow() {
    let best = null, bd = Infinity;
    for (const ar of arrows) { const d = dist(ar.pos, player.pos); if (d < bd) { bd = d; best = ar; } }
    return best;
  }
  const LENSES = [
    {
      name: 'Points & directions', chap: 'Chapter 11.1–11.3',
      formula: 'position  p = (x, y)   measured from the origin\ndisplacement  d = p − a   from a to p',
      used: ['Positions of every object in the world', 'The arrow from an enemy to the player',
        'Offsets: a weapon held 20 px in front of a hand', 'Camera position vs camera-to-target'],
      tryThis: 'Move around: p changes, the origin stays in the top-left corner. d always runs from the nearest archer to you.',
      draw() {
        arrowVec(V(0, 0), V(120, 0), '#ff6b6b', '+x'); arrowVec(V(0, 0), V(0, 120), '#5fd18b', '+y');
        text('origin (0, 0)', 10, 140, '#e6e9ef', 12);
        dashed(true);
        ctx.strokeStyle = 'rgba(230,233,239,.45)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(player.pos.x, player.pos.y); ctx.stroke();
        const a = nearestArcher();
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(a.pos.x, a.pos.y); ctx.stroke();
        dashed(false);
        text(`p = ${vs(player.pos)}`, player.pos.x + 18, player.pos.y + 28, '#e6e9ef', 13);
        text(`a = ${vs(a.pos)}`, a.pos.x + 18, a.pos.y + (a.pos.y < 100 ? 36 : -20), '#ffb547', 13);
        const d = sub(player.pos, a.pos);
        arrowVec(a.pos, d, '#6cb8ff', null, 3);
        const mid = add(a.pos, mul(d, 0.5));
        text(`d = p − a = ${vs(d)}`, mid.x + 10, mid.y, '#6cb8ff', 13);
      },
      live() {
        const a = nearestArcher(), d = sub(player.pos, a.pos);
        return `player  p = ${vs(player.pos)}\narcher  a = ${vs(a.pos)}\n\nd = p − a\n  = (${f0(player.pos.x)} − ${f0(a.pos.x)}, ${f0(player.pos.y)} − ${f0(a.pos.y)})\n  = ${vs(d)}`;
      },
    },
    {
      name: 'Adding (wind)', chap: 'Chapter 11.3',
      formula: 'v = v_launch + w\n(vx, vy) = (lx + wx, ly + wy)',
      used: ['Wind, river currents and conveyor belts', 'Moving platforms carrying the player',
        'Recoil and knockback added to movement', 'Combining several forces into one'],
      tryThis: 'Watch the newest arrow: the white launch arrow plus the blue wind arrow lands on the green total. Untick wind and every arrow flies straight at you.',
      controls: `<label><input type="checkbox" data-set="wind"> Wind on</label>`,
      draw() {
        const ar = lastShot && arrows.includes(lastShot) ? lastShot : null;
        if (!ar) { text('wait for the next arrow', player.pos.x, player.pos.y - 30, '#9aa3b2', 12, 'center'); return; }
        const s = 0.6, o = ar.from.pos;
        arrowVec(o, mul(ar.launch, s), '#e6e9ef', 'launch');
        arrowVec(add(o, mul(ar.launch, s)), mul(ar.wind, s), '#6cb8ff', 'w');
        arrowVec(o, mul(add(ar.launch, ar.wind), s), '#5fd18b', 'v', 3);
      },
      live() {
        const ar = lastShot;
        if (!ar) return 'wait for the first arrow';
        const v = add(ar.launch, ar.wind);
        return `launch  ${vs(ar.launch)}\nwind w  ${vs(ar.wind)}\n\nv = launch + w\n  = (${f0(ar.launch.x)} + ${f0(ar.wind.x)}, ${f0(ar.launch.y)} + ${f0(ar.wind.y)})\n  = ${vs(v)}\nspeed |v| = ${f0(len(v))} px/s`;
      },
    },
    {
      name: 'Scaling & velocity', chap: 'Chapter 11.4',
      formula: 'k·v = (k·vx, k·vy)\nstep per frame = v × Δt\nvelocity = speed × direction',
      used: ['Moving every object: position += velocity × Δt', 'Speed boosts and slow motion',
        'Reversing direction (multiply by −1)', 'Scaling a unit direction to any speed'],
      tryThis: 'Drag the time-scale slider to 0.25: every step v × Δt shrinks by four and the whole game moves in slow motion.',
      controls: `<label>Time scale <input type="range" min="0.25" max="1" step="0.05" data-set="timeScale"> <span data-show="timeScale"></span>×</label>`,
      draw() {
        arrowVec(player.pos, mul(player.vel, 0.3), '#5fd18b', player.vel.x || player.vel.y ? 'v' : null);
        for (const ar of arrows) arrowVec(ar.pos, mul(ar.vel, 0.25), 'rgba(108,184,255,.85)', null, 2);
      },
      live() {
        const ar = nearestArrow();
        const dt = lastDt * settings.timeScale;
        let s = `Δt = ${f1(lastDt * 1000)} ms × ${settings.timeScale} = ${f1(dt * 1000)} ms\nplayer v = ${vs(player.vel)}\nplayer step = v × Δt = ${vs(mul(player.vel, dt), f1)}`;
        if (ar) s += `\n\nnearest arrow v = ${vs(ar.vel)}\nstep = ${vs(mul(ar.vel, dt), f1)} px`;
        return s;
      },
    },
    {
      name: 'Length & distance', chap: 'Chapter 11.5',
      formula: '|v| = √(vx² + vy²)\ndistance = |b − a|\nclose call if min distance < 36',
      used: ['Hit tests and pickup radius', 'Close-call / near-miss bonuses', 'Finding the nearest enemy or item',
        'Fading sound and detail with distance'],
      tryThis: 'Let an arrow pass just beside you. When its distance stops shrinking below 36 px, you score a close call.',
      draw() {
        dashed(true); circle(player.pos, NEAR, null, 'rgba(255,181,71,.7)', 1.5); dashed(false);
        for (const ar of arrows) {
          const d = dist(ar.pos, player.pos);
          if (d > 160) continue;
          ctx.strokeStyle = d < NEAR ? '#ffb547' : 'rgba(230,233,239,.5)'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(player.pos.x, player.pos.y); ctx.lineTo(ar.pos.x, ar.pos.y); ctx.stroke();
          text(f0(d), (player.pos.x + ar.pos.x) / 2 + 6, (player.pos.y + ar.pos.y) / 2, d < NEAR ? '#ffb547' : '#e6e9ef', 12);
        }
        for (const g of gems) text(f0(dist(g.pos, player.pos)), g.pos.x + 12, g.pos.y - 10, '#5fd18b', 12);
      },
      live() {
        const ar = nearestArrow();
        if (!ar) return 'no arrows in flight';
        const d = sub(ar.pos, player.pos);
        return `nearest arrow\n b − a = ${vs(d)}\n |b − a| = √(${f0(d.x)}² + ${f0(d.y)}²)\n         = ${f1(len(d))} px\n closest so far ${f1(ar.minDist)} px\n close call under ${NEAR} px`;
      },
    },
    {
      name: 'Normalizing', chap: 'Chapter 11.6–11.7',
      formula: 'v̂ = v ÷ |v|        (length 1)\ninput: normalize(right−left, down−up)\naim: normalize(p − a) × 260',
      used: ['Fixing faster diagonal movement', 'Aiming at a target with a fixed speed',
        'Turning any offset into a pure direction', 'Analog stick input'],
      tryThis: 'Untick "Normalize input" and hold W + D: speed jumps from 200 to 283. Untick "Normalize aim": far archers now shoot faster arrows than near ones.',
      controls: `<label><input type="checkbox" data-set="normalizeInput"> Normalize input</label>
        <label><input type="checkbox" data-set="normalizeAim"> Normalize aim</label>`,
      draw() {
        arrowVec(player.pos, mul(player.input, 50), '#5fd18b', `|input| = ${f2(len(player.input))}`);
        for (const a of archers) arrowVec(a.pos, mul(norm(sub(player.pos, a.pos)), 60), '#ffb547', 'd̂');
      },
      live() {
        const a = nearestArcher(), d = sub(player.pos, a.pos), l = len(d);
        const v = settings.normalizeAim ? mul(norm(d), ARROW_SPEED) : mul(d, 0.9);
        return `input       ${vs(player.input, f2)}  |input| = ${f2(len(player.input))}\nplayer speed ${f0(len(mul(player.input, PLAYER_SPEED)))} px/s\n\nnearest archer\n d = ${vs(d)}  |d| = ${f0(l)}\n d̂ = d ÷ |d| = ${vs(norm(d), f2)}\n arrow v = ${settings.normalizeAim ? 'd̂ × 260' : 'd × 0.9 (bug!)'}\n         = ${vs(v)}  speed ${f0(len(v))}`;
      },
    },
    {
      name: 'Homing (steering)', chap: 'Chapter 11.8',
      formula: 'desired = normalize(p − arrow) × speed\nsteer = desired − v   (limited)\nv ← normalize(v + steer) × speed',
      used: ['Homing missiles and seeking projectiles', 'Enemies chasing smoothly instead of snapping',
        'Flocking birds and fish', 'Cars and ships with turning limits'],
      tryThis: 'Tick "Homing arrows" and run in a circle: purple arrows bend toward you, but the steering limit stops them from turning instantly.',
      controls: `<label><input type="checkbox" data-set="homing"> Homing arrows (otherwise after 30 s)</label>`,
      draw() {
        for (const ar of arrows) {
          if (!ar.homing || !ar.desired) continue;
          arrowVec(ar.pos, mul(ar.vel, 0.3), '#e6e9ef', 'v', 2);
          arrowVec(ar.pos, mul(ar.desired, 0.3), '#5fd18b', 'desired', 2);
          arrowVec(add(ar.pos, mul(ar.vel, 0.3)), mul(sub(ar.desired, ar.vel), 0.3), 'rgba(180,140,255,.9)', null, 2);
        }
      },
      live() {
        const ar = arrows.find(a => a.homing && a.desired);
        if (!ar) return 'no homing arrow in flight';
        const full = sub(ar.desired, ar.vel);
        return `v        ${vs(ar.vel)}\ndesired  ${vs(ar.desired)}\ndesired − v = ${vs(full)}\n  |…| = ${f0(len(full))}\nlimited to ${f1(HOMING_TURN * lastDt * settings.timeScale)} per frame\n  steer = ${vs(ar.steer, f1)}`;
      },
    },
  ];
  for (const l of LENSES) l.on = false;

  // ---------- Panel ----------
  const lensesEl = document.getElementById('lenses');
  const cardEl = document.getElementById('card');
  let selected = null, liveEl = null;
  LENSES.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'lens';
    b.innerHTML = `<kbd>${i + 1}</kbd>${l.name}`;
    b.addEventListener('click', () => toggleLens(l));
    l.btn = b; lensesEl.appendChild(b);
  });
  function toggleLens(l) {
    if (!l) return;
    if (l.on && selected === l) l.on = false; else l.on = true;
    selected = l.on ? l : LENSES.find(x => x.on) || null;
    for (const x of LENSES) { x.btn.classList.toggle('on', x.on); x.btn.classList.toggle('sel', x === selected); }
    renderCard();
  }
  function renderCard() {
    if (!selected) {
      cardEl.innerHTML = `<h2>No lens on</h2><p style="margin:0;color:var(--muted)">Play a round first. Then press 1–6 to see the vectors behind every arrow.</p>`;
      liveEl = null; return;
    }
    const l = selected;
    cardEl.innerHTML = `
      <h2>${l.name}</h2><span class="chap">${l.chap}</span>
      <div class="formula">${l.formula}</div>
      <h3>Where it's used in games</h3>
      <ul>${l.used.map(u => `<li>${u}</li>`).join('')}</ul>
      <h3>Try this</h3><div class="try">${l.tryThis}</div>
      ${l.controls ? `<div class="controls">${l.controls}</div>` : ''}
      <h3>Live numbers</h3><div class="live"></div>`;
    liveEl = cardEl.querySelector('.live');
    cardEl.querySelectorAll('[data-set]').forEach(el => {
      const key = el.dataset.set;
      const showEl = cardEl.querySelector(`[data-show="${key}"]`);
      if (el.type === 'checkbox') el.checked = settings[key]; else el.value = settings[key];
      if (showEl) showEl.textContent = settings[key];
      el.addEventListener('input', () => {
        settings[key] = el.type === 'checkbox' ? el.checked : parseFloat(el.value);
        if (showEl) showEl.textContent = settings[key];
      });
    });
    updateLive();
  }
  function updateLive() { if (liveEl && selected) liveEl.textContent = selected.live(); }
  renderCard();

  // ---------- Loop ----------
  reset();
  let last = performance.now(), lastDt = 1 / 60, liveTimer = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now; lastDt = dt;
    if (started && !paused) update(dt * settings.timeScale);
    render();
    liveTimer -= dt;
    if (liveTimer <= 0) { updateLive(); liveTimer = 0.1; }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
