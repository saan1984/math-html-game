<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Seed</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b23;
    --panel-2: #1f2430;
    --line: #2a3140;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #6cb8ff;
    --warn: #ffb547;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #app { display: flex; height: 100vh; }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { width: 340px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .seedrow { display: flex; gap: 6px; margin: 0 0 12px; }
  .seedrow input { flex: 1; min-width: 0; font: 13px Menlo, Consolas, monospace; background: #11151c; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .btn { font: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .lenses { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .lens { display: flex; align-items: center; gap: 6px; text-align: left; padding: 7px 8px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font: inherit; font-size: 12.5px; cursor: pointer; }
  .lens kbd { font: 11px Menlo, Consolas, monospace; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px; }
  .lens.on { border-color: var(--accent); background: #1d2b3d; }
  .lens.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .chap { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid #2d4766;
    border-radius: 999px; padding: 1px 8px; margin-bottom: 8px; }
  .formula { font: 13px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin: 6px 0 10px; white-space: pre-wrap; color: #cfe6ff; }
  .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 4px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin: 2px 0; }
  .try { color: var(--warn); }
  .live { font: 12.5px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin-top: 6px; white-space: pre; overflow-x: auto; min-height: 3em; }
  .controls { margin-top: 8px; display: grid; gap: 6px; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls select { font: inherit; font-size: 12.5px; background: #11151c; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .controls .row { display: flex; gap: 6px; }
  .help { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  .help b { color: var(--text); }
  @media (max-width: 820px) {
    #app { flex-direction: column; height: auto; }
    #stage { flex: none; height: 62vh; }
    #panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
  <aside id="panel">
    <h1>Dungeon Seed</h1>
    <p class="sub">Three cave floors grown from one seed. Open chests, read the loot table, land crits, find the stairs. Same seed, same dungeon.</p>
    <div class="seedrow">
      <input id="seed" type="text" maxlength="24" spellcheck="false" aria-label="Seed">
      <button class="btn" id="play">Play seed</button>
      <button class="btn" id="random">Random</button>
    </div>
    <div class="lenses" id="lenses"></div>
    <div class="card" id="card"></div>
    <div class="help">
      <b>Move / attack / open</b> WASD or arrows · <b>Wait</b> Space · <b>Lenses</b> keys 1–6 ·
      <b>Restart same seed</b> R · <b>New seed</b> N · <b>Pause</b> P
    </div>
  </aside>
</div>

<script>
(() => {
  // ---------- Helpers ----------
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const f0 = n => Math.round(n).toString();
  const f1 = n => (Math.abs(n) < 0.05 ? 0 : n).toFixed(1);
  const f2 = n => (Math.abs(n) < 0.005 ? 0 : n).toFixed(2);
  const f3 = n => (Math.abs(n) < 0.0005 ? 0 : n).toFixed(3);
  const hex8 = n => (n >>> 0).toString(16).padStart(8, '0');

  // ---------- Game constants ----------
  const COLS = 40, ROWS = 26, T = 24, MAP_Y = 40;
  const WORLD = { w: COLS * T, h: MAP_Y + ROWS * T + 4 };   // 960 × 668 world units
  const FLOORS = 3;
  const MAX_HP = 16;
  const HIT = 2, CRIT_MULT = 2;      // a crit doubles the 2 damage to 4
  const CRIT_P = 0.25;               // nominal crit chance
  const PRD_C = 0.084744;            // PRD constant whose long-run crit rate is 25%
  const POISSON_R = 3.5;             // minimum distance between props, in tiles
  const POISSON_K = 30;              // candidates tried around each active point
  const REVEAL = 5;                  // you can see 5 tiles around you
  const WAKE = 6;                    // monsters notice you within 6 tiles
  const STAIRS_HEAL = 4;             // the stairs restore 4 HP
  const MIN_FLOOR = 300;             // smallest cave we accept, in tiles
  const STEP_TIME = 0.14;            // seconds between steps while a key is held
  const CHESTS = 6, RUNES = 4;
  const ENEMIES = [0, 3, 5, 7];      // per floor
  const THRESH = { perlin: -0.03, value: -0.05 };

  // Chapter 27.3: the loot table. Weights add up to 100.
  const LOOT = [
    { name: 'Copper', w: 50, gold: 2, color: '#d08a4c' },
    { name: 'Silver', w: 30, gold: 5, color: '#c9d1dc' },
    { name: 'Potion', w: 15, gold: 0, heal: 4, color: '#ff6b8a' },
    { name: 'Gem', w: 4, gold: 25, color: '#5fd1c8' },
    { name: 'Crown', w: 1, gold: 100, color: '#ffd54a' },
  ];
  // Chapter 27.5: a 7-rune shuffle bag
  const RUNES_LIST = [
    { name: 'Gold', text: '+10 gold', color: '#ffd54a' },
    { name: 'Mend', text: '+4 HP', color: '#ff6b8a' },
    { name: 'Sight', text: 'map revealed', color: '#6cb8ff' },
    { name: 'Spark', text: '3 damage nearby', color: '#ffb547' },
    { name: 'Ward', text: 'shield 3', color: '#5fd1c8' },
    { name: 'Thorn', text: '−2 HP', color: '#ff6b6b' },
    { name: 'Lure', text: 'monsters wake', color: '#b48cff' },
  ];
  const MONSTERS = {
    slime: { hp: 3, dmg: 1, gold: 1, color: '#5fd18b' },
    bat: { hp: 2, dmg: 1, gold: 1, color: '#b48cff' },
    skeleton: { hp: 4, dmg: 2, gold: 3, color: '#e6e9ef' },
  };
  const MONSTER_TABLE = [null,
    [{ type: 'slime', w: 3 }, { type: 'bat', w: 1 }],
    [{ type: 'slime', w: 2 }, { type: 'bat', w: 1 }, { type: 'skeleton', w: 1 }],
    [{ type: 'slime', w: 1 }, { type: 'bat', w: 1 }, { type: 'skeleton', w: 2 }],
  ];

  // ---------- Chapter 27.2: seeds and pseudo-random streams ----------
  // FNV-1a hash: turns any seed text into a 32-bit number
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  // mulberry32: the state steps by a fixed odd constant (mod 2^32), then is scrambled into u in [0, 1)
  function makeStream(seedText, name, seeded) {
    const st = { name, seeded, seed: hashStr(seedText + '/' + name), count: 0, last: [] };
    st.state = st.seed;
    st.next = () => {
      let u;
      if (st.seeded) {
        st.state = (st.state + 0x6D2B79F5) >>> 0;
        let t = st.state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        u = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      } else {
        u = Math.random();                      // unseeded: different every time
      }
      st.count++;
      st.last.push(u); if (st.last.length > 3) st.last.shift();
      return u;
    };
    return st;
  }

  // ---------- Chapter 27.3: turning u into choices ----------
  function pickWeighted(table, u) {
    const total = table.reduce((s, e) => s + e.w, 0);
    let x = u * total;
    for (const e of table) { if (x < e.w) return e; x -= e.w; }
    return table[table.length - 1];
  }
  // ---------- Chapter 27.5: shuffles ----------
  function fisherYates(a, rnd) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function naiveShuffle(a, rnd) {               // biased: every slot swaps with ANY slot
    for (let i = 0; i < a.length; i++) {
      const j = Math.floor(rnd() * a.length);
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  // ---------- Chapter 27.6: pseudo-random distribution ----------
  const critChance = (N, prd) => prd ? Math.min(1, PRD_C * N) : CRIT_P;

  // ---------- Chapter 27.7: noise ----------
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);    // 6t⁵ − 15t⁴ + 10t³
  function makeNoise(R, type) {
    const octaves = [{ cell: 8, amp: 1 }, { cell: 4, amp: 0.5 }];
    for (const o of octaves) {
      o.gw = Math.ceil(COLS / o.cell) + 1; o.gh = Math.ceil(ROWS / o.cell) + 1;
      o.g = [];
      for (let i = 0; i < o.gw * o.gh; i++) {
        if (type === 'perlin') { const th = 2 * Math.PI * R(); o.g.push({ x: Math.cos(th), y: Math.sin(th) }); }
        else o.g.push(2 * R() - 1);
      }
    }
    return { type, octaves };
  }
  function octaveSample(o, type, x, y) {
    const gx = x / o.cell, gy = y / o.cell;
    const i = Math.floor(gx), j = Math.floor(gy), fx = gx - i, fy = gy - j;
    const corners = [];
    for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
      const g = o.g[(j + dy) * o.gw + (i + dx)];
      const ox = fx - dx, oy = fy - dy;                      // offset from the corner to the point
      const d = type === 'perlin' ? g.x * ox + g.y * oy : g;  // gradient · offset (or a plain value)
      corners.push({ dx, dy, g, ox, oy, d });
    }
    const u = fade(fx), v = fade(fy);
    const val = lerp(lerp(corners[0].d, corners[1].d, u), lerp(corners[2].d, corners[3].d, u), v);
    return { i, j, fx, fy, u, v, corners, val };
  }
  function noiseAt(N, x, y) {
    let s = 0, a = 0;
    for (const o of N.octaves) { s += o.amp * octaveSample(o, N.type, x, y).val; a += o.amp; }
    return s / a;
  }

  // ---------- Building one floor ----------
  const idx = (c, r) => r * COLS + c;
  function largestRegion(tiles) {
    const mark = new Int32Array(COLS * ROWS).fill(-1);
    let best = [];
    for (let s = 0; s < tiles.length; s++) {
      if (!tiles[s] || mark[s] >= 0) continue;
      const region = [s], stack = [s]; mark[s] = s;
      while (stack.length) {
        const k = stack.pop(), c = k % COLS, r = (k - c) / COLS;
        for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nc = c + dc, nr = r + dr;
          if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
          const n = idx(nc, nr);
          if (tiles[n] && mark[n] < 0) { mark[n] = s; region.push(n); stack.push(n); }
        }
      }
      if (region.length > best.length) best = region;
    }
    return best;
  }
  function stepsFrom(tiles, s) {
    const d = new Int32Array(COLS * ROWS).fill(-1), q = [s]; d[s] = 0;
    for (let h = 0; h < q.length; h++) {
      const k = q[h], c = k % COLS, r = (k - c) / COLS;
      for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const n = idx(c + dc, r + dr);
        if (tiles[n] && d[n] < 0) { d[n] = d[k] + 1; q.push(n); }
      }
    }
    return d;
  }
  function farthest(d) { let b = 0; for (let i = 0; i < d.length; i++) if (d[i] > d[b]) b = i; return b; }

  // Chapter 27.8: Poisson-disk sampling on tile centers (Bridson's method)
  function poissonDisk(tiles, region, start, exit, R) {
    const r2 = POISSON_R * POISSON_R;
    const pts = [{ c: start % COLS, r: Math.floor(start / COLS) }, { c: exit % COLS, r: Math.floor(exit / COLS) }];
    const active = [0, 1];
    let tried = 0, rejected = 0;
    const ok = (c, r) => {
      if (c < 1 || r < 1 || c >= COLS - 1 || r >= ROWS - 1 || !tiles[idx(c, r)]) return false;
      for (const p of pts) if ((p.c - c) ** 2 + (p.r - r) ** 2 < r2) return false;
      return true;
    };
    const grow = () => {
      while (active.length) {
        const ai = Math.floor(R() * active.length), p = pts[active[ai]];
        let found = false;
        for (let k = 0; k < POISSON_K; k++) {
          const th = 2 * Math.PI * R(), rho = POISSON_R * (1 + R());     // ring r … 2r
          const c = Math.floor(p.c + 0.5 + rho * Math.cos(th)), r = Math.floor(p.r + 0.5 + rho * Math.sin(th));
          tried++;
          if (ok(c, r)) { pts.push({ c, r }); active.push(pts.length - 1); found = true; break; }
          rejected++;
        }
        if (!found) active.splice(ai, 1);                  // no room left around this point
      }
    };
    grow();
    for (let restart = 0; restart < 40; restart++) {         // reach pockets the rings missed: restart from a free tile
      const k = region[Math.floor(R() * region.length)], c = k % COLS, r = (k - c) / COLS;
      tried++;
      if (!ok(c, r)) { rejected++; continue; }
      pts.push({ c, r }); active.push(pts.length - 1);
      grow();
    }
    return { pts: pts.slice(2), tried, rejected };
  }

  function buildFloor(seedText, f, opt) {
    const R = makeStream(seedText, 'map' + f, opt.seeded);
    const L = makeStream(seedText, 'loot' + f, opt.seeded);
    const n = COLS * ROWS;
    let tiles, noise, N, region, attempts = 0;
    for (;;) {
      attempts++;
      N = makeNoise(R.next, opt.noiseType);
      tiles = new Uint8Array(n); noise = new Float32Array(n);
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const v = noiseAt(N, c + 0.5, r + 0.5);
        noise[idx(c, r)] = v;
        const inside = c > 0 && r > 0 && c < COLS - 1 && r < ROWS - 1;
        tiles[idx(c, r)] = inside && v > THRESH[opt.noiseType] ? 1 : 0;
      }
      region = largestRegion(tiles);
      if (region.length >= MIN_FLOOR || attempts >= 25) break;
    }
    const keep = new Uint8Array(n);
    for (const k of region) keep[k] = 1;
    for (let k = 0; k < n; k++) if (!keep[k]) tiles[k] = 0;

    // Start and exit far apart: farthest from a random tile, then farthest from that
    const t0 = region[Math.floor(R.next() * region.length)];
    const start = farthest(stepsFrom(tiles, t0));
    const exit = farthest(stepsFrom(tiles, start));

    // Props: Poisson-disk points (or plain uniform points when the switch is off)
    const pd = poissonDisk(tiles, region, start, exit, R.next);
    let spots = pd.pts;
    if (!opt.poisson) {
      const used = new Set([start, exit]);
      spots = spots.map(() => {
        let k;
        do { k = region[Math.floor(R.next() * region.length)]; } while (used.has(k));
        used.add(k);
        return { c: k % COLS, r: Math.floor(k / COLS) };
      });
    }
    fisherYates(spots, R.next);
    let minD = Infinity;
    const all = spots.concat([{ c: start % COLS, r: Math.floor(start / COLS) }, { c: exit % COLS, r: Math.floor(exit / COLS) }]);
    for (let a = 0; a < spots.length; a++) for (let b = a + 1; b < all.length; b++)     // start–exit pair skipped
      minD = Math.min(minD, Math.hypot(all[a].c - all[b].c, all[a].r - all[b].r));

    const nE = Math.min(ENEMIES[f], Math.max(0, spots.length - CHESTS - RUNES));
    const chests = [], runes = [], enemies = [], decor = [];
    spots.forEach((s, i) => {
      if (i < CHESTS) {
        const u = L.next();                                  // rolled now, so it belongs to the chest
        chests.push({ c: s.c, r: s.r, u, item: pickWeighted(LOOT, u), opened: false });
      } else if (i < CHESTS + RUNES) runes.push({ c: s.c, r: s.r, used: false });
      else if (i < CHESTS + RUNES + nE) {
        const type = pickWeighted(MONSTER_TABLE[f], R.next()).type;
        const m = MONSTERS[type];
        enemies.push({ c: s.c, r: s.r, x: s.c, y: s.r, type, hp: m.hp, max: m.hp, awake: false, flash: 0 });
      } else decor.push({ c: s.c, r: s.r, kind: R.next() < 0.5 ? 'mushroom' : 'crystal' });
    });

    // Fingerprint: a hash of everything that was generated
    let fp = '';
    for (let k = 0; k < n; k++) fp += tiles[k];
    fp += `|${start}|${exit}|`;
    for (const c of chests) fp += `c${c.c},${c.r},${c.item.name};`;
    for (const r of runes) fp += `r${r.c},${r.r};`;
    for (const e of enemies) fp += `e${e.c},${e.r},${e.type};`;
    for (const d of decor) fp += `d${d.c},${d.r};`;

    return {
      f, tiles, noise, N, start, exit, chests, runes, enemies, decor, attempts,
      seen: new Uint8Array(n), mapStream: R, lootStream: L,
      poisson: { count: spots.length, tried: pd.tried, rejected: pd.rejected, minD, on: opt.poisson },
      fingerprint: hashStr(fp),
    };
  }

  // ---------- Canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 800, H = 600, DPR = 1, S = 1, OX = 0, OY = 0;
  function resize() {
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    S = Math.min(W / WORLD.w, H / WORLD.h);
    OX = (W - WORLD.w * S) / 2; OY = (H - WORLD.h * S) / 2;
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  // ---------- Settings ----------
  const settings = {
    seeded: true,        // pitfall switch: off = unseeded Math.random
    fairShuffle: true,   // pitfall switch: off = naive biased shuffle
    poisson: true,
    prd: true,
    noiseType: 'perlin',
  };

  // ---------- State ----------
  let seedText = '4242';
  let run, fl, player, popups, rollFx, started = false, paused = false;
  let stepCd = 0, lastDir = null;
  const fpLog = [];               // fingerprints of floor 1 for each build
  const sim = { n: 0, sum: 0, target: 0, means: [], stream: null };
  const shuf = { counts: null, total: 0, fair: true };

  function newRun() {
    run = {
      seed: seedText, floor: 1, hp: MAX_HP, gold: 0, shield: 0, kills: 0, turns: 0, time: 0,
      chestsOpened: 0, chestGold: 0, attacks: 0, crits: 0, prdN: 0, dry: 0, maxDry: 0, history: [],
      lastAttack: null, bag: [], bagsFilled: 0, drawn: [], over: null,
      fight: makeStream(seedText, 'fight', settings.seeded),
      bagStream: makeStream(seedText, 'bag', settings.seeded),
    };
    popups = []; rollFx = null;
    sim.n = 0; sim.sum = 0; sim.target = 0; sim.means = [];
    sim.stream = makeStream(seedText, 'sim', settings.seeded);
    enterFloor(1);
    fpLog.push({ seed: seedText, fp: fl.fingerprint, seeded: settings.seeded });
    if (fpLog.length > 40) fpLog.shift();
  }
  function enterFloor(f) {
    run.floor = f;
    fl = buildFloor(seedText, f, { seeded: settings.seeded, noiseType: settings.noiseType, poisson: settings.poisson });
    const c = fl.start % COLS, r = Math.floor(fl.start / COLS);
    player = { c, r, x: c, y: r, flash: 0 };
    reveal();
  }
  function reveal() {
    for (let r = player.r - REVEAL; r <= player.r + REVEAL; r++) for (let c = player.c - REVEAL; c <= player.c + REVEAL; c++) {
      if (c < 0 || r < 0 || c >= COLS || r >= ROWS) continue;
      if ((c - player.c) ** 2 + (r - player.r) ** 2 <= REVEAL * REVEAL) fl.seen[idx(c, r)] = 1;
    }
  }
  const visibleNow = (c, r) => (c - player.c) ** 2 + (r - player.r) ** 2 <= REVEAL * REVEAL;
  const isFloor = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS && fl.tiles[idx(c, r)] === 1;
  const enemyAt = (c, r) => fl.enemies.find(e => e.hp > 0 && e.c === c && e.r === r);
  const chestAt = (c, r) => fl.chests.find(k => !k.opened && k.c === c && k.r === r);

  function popup(c, r, text, color) { popups.push({ x: c * T + T / 2, y: MAP_Y + r * T, text, color, life: 1.2 }); }

  // ---------- Turns ----------
  function tryStep(dc, dr) {
    if (!run || run.over) return;
    const nc = player.c + dc, nr = player.r + dr;
    const e = enemyAt(nc, nr);
    if (e) { attack(e); endTurn(); return; }
    if (!isFloor(nc, nr)) return;                         // bumping a wall costs nothing
    const chest = chestAt(nc, nr);
    if (chest) { openChest(chest); endTurn(); return; }
    player.c = nc; player.r = nr;
    reveal();
    const rune = fl.runes.find(k => !k.used && k.c === nc && k.r === nr);
    if (rune) { rune.used = true; drawRune(rune); }
    if (idx(nc, nr) === fl.exit) {
      if (run.floor < FLOORS) { run.hp = Math.min(MAX_HP, run.hp + STAIRS_HEAL); enterFloor(run.floor + 1); popup(player.c, player.r, `floor ${run.floor}  +${STAIRS_HEAL} HP`, '#5fd18b'); return; }
      run.over = 'escaped'; return;
    }
    endTurn();
  }

  function attack(e) {
    run.attacks++; run.prdN++;
    const P = critChance(run.prdN, settings.prd);
    const u = run.fight.next();
    const crit = u < P;
    run.lastAttack = { N: run.prdN, P, u, crit };
    if (crit) { run.crits++; run.prdN = 0; run.dry = 0; } else { run.dry++; run.maxDry = Math.max(run.maxDry, run.dry); }
    run.history.push(crit); if (run.history.length > 40) run.history.shift();
    const dmg = crit ? HIT * CRIT_MULT : HIT;
    e.hp -= dmg; e.flash = 0.25; e.awake = true;
    popup(e.c, e.r, crit ? `CRIT ${dmg}` : `${dmg}`, crit ? '#ffb547' : '#e6e9ef');
    if (e.hp <= 0) {
      const g = MONSTERS[e.type].gold;
      run.gold += g; run.kills++;
      popup(e.c, e.r + 0.7, `+${g} gold`, '#ffd54a');
    }
  }

  function openChest(k) {
    k.opened = true;
    const it = k.item;
    run.chestsOpened++; run.chestGold += it.gold; run.gold += it.gold;
    if (it.heal) run.hp = Math.min(MAX_HP, run.hp + it.heal);
    rollFx = { u: k.u, item: it, t: 0 };
    popup(k.c, k.r, it.heal ? `${it.name} +${it.heal} HP` : `${it.name} +${it.gold}`, it.color);
  }

  function refillBag() {
    const a = [0, 1, 2, 3, 4, 5, 6];
    (settings.fairShuffle ? fisherYates : naiveShuffle)(a, run.bagStream.next);
    run.bag = a; run.bagsFilled++;
  }
  function drawRune(tile) {
    if (!run.bag.length) refillBag();
    const id = run.bag.shift();
    run.drawn.push(id);
    const rn = RUNES_LIST[id];
    popup(tile.c, tile.r, `${rn.name}: ${rn.text}`, rn.color);
    if (id === 0) run.gold += 10;
    else if (id === 1) run.hp = Math.min(MAX_HP, run.hp + 4);
    else if (id === 2) fl.seen.fill(1);
    else if (id === 3) {
      for (const e of fl.enemies) if (e.hp > 0 && (e.c - player.c) ** 2 + (e.r - player.r) ** 2 <= 9) {
        e.hp -= 3; e.flash = 0.3; popup(e.c, e.r, '3', '#ffb547');
        if (e.hp <= 0) { run.gold += MONSTERS[e.type].gold; run.kills++; }
      }
    } else if (id === 4) run.shield += 3;
    else if (id === 5) hurt(2);
    else if (id === 6) for (const e of fl.enemies) e.awake = true;
  }

  function hurt(d) {
    const blocked = Math.min(run.shield, d);
    run.shield -= blocked; d -= blocked;
    if (d > 0) { run.hp -= d; player.flash = 0.3; popup(player.c, player.r, `−${d}`, '#ff6b6b'); }
    else popup(player.c, player.r, 'blocked', '#5fd1c8');
    if (run.hp <= 0) { run.hp = 0; run.over = 'fallen'; }
  }

  function endTurn() {
    run.turns++;
    const occupied = (c, r) => (c === player.c && r === player.r) || enemyAt(c, r) || chestAt(c, r) || !isFloor(c, r);
    for (const e of fl.enemies) {
      if (e.hp <= 0 || run.over) continue;
      const dc = player.c - e.c, dr = player.r - e.r;
      if (Math.abs(dc) + Math.abs(dr) === 1) { hurt(MONSTERS[e.type].dmg); continue; }
      if (!e.awake && dc * dc + dr * dr <= WAKE * WAKE) e.awake = true;
      if (!e.awake) continue;
      if (e.type === 'slime' && run.turns % 2) continue;      // slimes are slow: they move every other turn
      let moves;
      if (e.type === 'bat' && run.fight.next() < 0.5) {
        moves = [[[1, 0], [-1, 0], [0, 1], [0, -1]][Math.floor(run.fight.next() * 4)]];
      } else {
        const sx = Math.sign(dc), sy = Math.sign(dr);
        moves = Math.abs(dc) >= Math.abs(dr) ? [[sx, 0], [0, sy]] : [[0, sy], [sx, 0]];
      }
      for (const [mx, my] of moves) {
        if (!mx && !my) continue;
        if (!occupied(e.c + mx, e.r + my)) { e.c += mx; e.r += my; break; }
      }
    }
  }

  // ---------- Input ----------
  const keys = {};
  const DIRS = { w: [0, -1], arrowup: [0, -1], s: [0, 1], arrowdown: [0, 1], a: [-1, 0], arrowleft: [-1, 0], d: [1, 0], arrowright: [1, 0] };
  const seedInput = document.getElementById('seed');
  addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' && e.target.type === 'text')) return;
    const k = e.key.toLowerCase();
    if (/^[1-6]$/.test(k)) { toggleLens(LENSES[+k - 1]); return; }
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
    if (!started) { started = true; return; }
    if (k === 'r') { newRun(); return; }
    if (k === 'n') { setSeed(randomSeed()); return; }
    if (k === 'p') { paused = !paused; return; }
    if (paused || run.over) return;
    if (k === ' ' && !e.repeat) endTurn();
    if (DIRS[k]) { keys[k] = true; if (!e.repeat) { stepCd = 0; lastDir = k; } }
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  canvas.addEventListener('pointerdown', () => { if (!started) started = true; else if (run.over) newRun(); });

  const randomSeed = () => String(100000 + Math.floor(Math.random() * 900000));
  function setSeed(s) {
    seedText = (s || '').trim() || '4242';
    seedInput.value = seedText;
    newRun();
    started = true;
  }
  seedInput.addEventListener('keydown', e => { if (e.key === 'Enter') { setSeed(seedInput.value); seedInput.blur(); } });
  document.getElementById('play').addEventListener('click', e => { setSeed(seedInput.value); e.currentTarget.blur(); });
  document.getElementById('random').addEventListener('click', e => { setSeed(randomSeed()); e.currentTarget.blur(); });

  // ---------- Update ----------
  function update(dt) {
    for (const p of popups) { p.life -= dt; p.y -= 20 * dt; }
    popups = popups.filter(p => p.life > 0);
    if (rollFx) { rollFx.t += dt; if (rollFx.t > 2.8) rollFx = null; }
    const k = 1 - Math.exp(-22 * dt);                       // smooth tile-to-tile motion (Chapter 7)
    player.x += (player.c - player.x) * k; player.y += (player.r - player.y) * k;
    player.flash = Math.max(0, player.flash - dt);
    for (const e of fl.enemies) { e.x += (e.c - e.x) * k; e.y += (e.r - e.y) * k; e.flash = Math.max(0, e.flash - dt); }

    // Loot lens: simulate chests for the law of large numbers
    if (sim.n < sim.target) {
      const steps = Math.min(sim.target - sim.n, Math.ceil(400 * dt));
      for (let i = 0; i < steps; i++) {
        sim.n++; sim.sum += pickWeighted(LOOT, sim.stream.next()).gold;
        sim.means.push(sim.sum / sim.n);
      }
    }
    // Shuffle lens: run many test shuffles in the background
    if (lens('bag').on) {
      if (!shuf.counts || shuf.fair !== settings.fairShuffle) {
        shuf.counts = Array.from({ length: 7 }, () => new Array(7).fill(0)); shuf.total = 0; shuf.fair = settings.fairShuffle;
      }
      for (let s = 0; s < 300; s++) {
        const a = [0, 1, 2, 3, 4, 5, 6];
        (settings.fairShuffle ? fisherYates : naiveShuffle)(a, Math.random);
        for (let p = 0; p < 7; p++) shuf.counts[a[p]][p]++;
        shuf.total++;
      }
    }

    if (run.over) return;
    run.time += dt;
    stepCd -= dt;
    const dir = lastDir && keys[lastDir] ? lastDir : Object.keys(DIRS).find(d => keys[d]);
    if (dir && stepCd <= 0) { tryStep(DIRS[dir][0], DIRS[dir][1]); stepCd = STEP_TIME; }
  }

  // ---------- Drawing ----------
  function text(t, x, y, color = '#e6e9ef', size = 12, align = 'left') {
    ctx.font = `${size}px Menlo, Consolas, monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,12,16,.9)'; ctx.strokeText(t, x, y);
    ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  function circle(x, y, r, fill, stroke, lw = 2) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function arrow(x1, y1, x2, y2, color, lw = 2) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - Math.cos(a - .45) * 8, y2 - Math.sin(a - .45) * 8);
    ctx.lineTo(x2 - Math.cos(a + .45) * 8, y2 - Math.sin(a + .45) * 8);
    ctx.closePath(); ctx.fill();
  }
  function box(x, y, w, h) {
    ctx.fillStyle = 'rgba(15,18,24,.9)'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#2a3140'; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
  }
  const cx = c => c * T + T / 2, cy = r => MAP_Y + r * T + T / 2;

  function drawMap(xray) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const k = idx(c, r);
      if (!fl.seen[k] && !xray) continue;
      const x = c * T, y = MAP_Y + r * T;
      if (fl.tiles[k]) {
        const v = clamp(fl.noise[k], -1, 1);
        ctx.fillStyle = `rgb(${38 + v * 14 | 0},${44 + v * 14 | 0},${56 + v * 12 | 0})`;
        ctx.fillRect(x, y, T, T);
      } else {
        const edge = isFloor(c + 1, r) || isFloor(c - 1, r) || isFloor(c, r + 1) || isFloor(c, r - 1);
        ctx.fillStyle = edge ? '#2b3242' : '#141820';
        ctx.fillRect(x, y, T, T);
      }
      if (!visibleNow(c, r)) { ctx.fillStyle = 'rgba(7,8,11,.5)'; ctx.fillRect(x, y, T, T); }
    }
  }

  function drawProps(xray) {
    const show = (c, r) => xray || fl.seen[idx(c, r)];
    // exit stairs
    const ec = fl.exit % COLS, er = Math.floor(fl.exit / COLS);
    if (show(ec, er)) {
      ctx.fillStyle = 'rgba(95,209,139,.25)'; ctx.fillRect(ec * T + 1, MAP_Y + er * T + 1, T - 2, T - 2);
      ctx.strokeStyle = '#5fd18b'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(ec * T + 5 + i * 3, MAP_Y + er * T + 7 + i * 5); ctx.lineTo(ec * T + T - 5, MAP_Y + er * T + 7 + i * 5); ctx.stroke(); }
    }
    for (const d of fl.decor) if (show(d.c, d.r)) {
      const x = cx(d.c), y = cy(d.r);
      if (d.kind === 'mushroom') { ctx.fillStyle = '#e8dcc8'; ctx.fillRect(x - 1.5, y, 3, 6); circle(x, y, 5, '#c0504d'); }
      else { ctx.fillStyle = '#5fd1c8'; ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 8); ctx.lineTo(x - 5, y); ctx.closePath(); ctx.fill(); }
    }
    for (const k of fl.runes) if (show(k.c, k.r)) {
      const x = cx(k.c), y = cy(k.r);
      if (k.used) { circle(x, y, 7, null, '#3a3352', 1.5); continue; }
      circle(x, y, 9, 'rgba(180,140,255,.18)', '#b48cff', 2);
      text('?', x, y + 4, '#b48cff', 12, 'center');
    }
    for (const k of fl.chests) if (show(k.c, k.r)) {
      const x = k.c * T + 3, y = MAP_Y + k.r * T + 5;
      ctx.fillStyle = k.opened ? '#2f2a24' : '#8a5a2b'; ctx.fillRect(x, y, T - 6, T - 10);
      ctx.strokeStyle = k.opened ? '#4a4036' : '#ffd54a'; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, T - 6, T - 10);
      if (!k.opened) { ctx.fillStyle = '#ffd54a'; ctx.fillRect(x + (T - 6) / 2 - 2, y + 4, 4, 5); }
    }
  }

  function drawEnemy(e, xray) {
    if (e.hp <= 0) return;
    if (!xray && !visibleNow(e.c, e.r)) return;
    const x = e.x * T + T / 2, y = MAP_Y + e.y * T + T / 2, m = MONSTERS[e.type];
    const col = e.flash > 0 ? '#ffffff' : m.color;
    if (e.type === 'slime') {
      ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y + 3, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
      circle(x - 3, y + 1, 1.6, '#0b0d12'); circle(x + 3, y + 1, 1.6, '#0b0d12');
    } else if (e.type === 'bat') {
      ctx.fillStyle = col; ctx.beginPath();
      ctx.moveTo(x - 11, y - 3); ctx.lineTo(x - 3, y + 2); ctx.lineTo(x, y - 2); ctx.lineTo(x + 3, y + 2); ctx.lineTo(x + 11, y - 3); ctx.lineTo(x, y + 6); ctx.closePath(); ctx.fill();
    } else {
      circle(x, y - 1, 8, col); ctx.fillStyle = '#0b0d12'; ctx.fillRect(x - 5, y - 3, 3, 3); ctx.fillRect(x + 2, y - 3, 3, 3);
      ctx.fillStyle = col; ctx.fillRect(x - 5, y + 5, 10, 4);
    }
    if (e.hp < e.max) {
      ctx.fillStyle = '#1f2430'; ctx.fillRect(x - 10, y - 14, 20, 3);
      ctx.fillStyle = '#ff6b6b'; ctx.fillRect(x - 10, y - 14, 20 * e.hp / e.max, 3);
    }
    if (!e.awake && visibleNow(e.c, e.r)) text('z', x + 9, y - 8, '#9aa3b2', 10);
  }

  function drawRoll() {
    if (!rollFx) return;
    const x0 = 250, y0 = MAP_Y + 8, w = 460;
    box(x0 - 12, y0, w + 24, 74);
    text('LOOT ROLL   u × 100 lands in the table', x0, y0 + 16, '#9aa3b2', 11);
    let x = x0;
    for (const it of LOOT) {
      const ww = it.w / 100 * w;
      ctx.fillStyle = it.color; ctx.globalAlpha = it === rollFx.item ? 1 : 0.45;
      ctx.fillRect(x, y0 + 24, ww - 1, 16); ctx.globalAlpha = 1;
      if (ww > 40) text(`${it.name} ${it.w}`, x + 4, y0 + 36, '#0b0d12', 10);
      x += ww;
    }
    const t = clamp(rollFx.t / 0.6, 0, 1), e = 1 - (1 - t) ** 3;
    const mx = x0 + rollFx.u * w * e;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(mx, y0 + 22); ctx.lineTo(mx - 5, y0 + 15); ctx.lineTo(mx + 5, y0 + 15); ctx.closePath(); ctx.fill();
    ctx.fillRect(mx - 1, y0 + 22, 2, 20);
    if (t >= 1) text(`roll ${f1(rollFx.u * 100)} → ${rollFx.item.name}${rollFx.item.heal ? ` (+${rollFx.item.heal} HP)` : ` (+${rollFx.item.gold} gold)`}`, x0, y0 + 60, rollFx.item.color, 13);
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#07080b'; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
    ctx.fillStyle = '#07080b'; ctx.fillRect(0, 0, WORLD.w, WORLD.h);

    const xray = lens('noise').on || lens('poisson').on;
    drawMap(lens('noise').on);
    drawProps(xray);
    for (const e of fl.enemies) drawEnemy(e, lens('poisson').on);
    // player
    const px = player.x * T + T / 2, py = MAP_Y + player.y * T + T / 2;
    circle(px, py, 8.5, player.flash > 0 ? '#ff6b6b' : '#2a5d8f', '#6cb8ff', 2.5);
    if (run.shield > 0) circle(px, py, 12, null, '#5fd1c8', 1.5);

    for (const l of LENSES) if (l.on) l.draw();
    drawRoll();

    for (const p of popups) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      text(p.text, p.x, p.y, p.color, 13, 'center');
      ctx.globalAlpha = 1;
    }

    // HUD
    ctx.fillStyle = '#0f1218'; ctx.fillRect(0, 0, WORLD.w, MAP_Y - 4);
    text(`FLOOR ${run.floor}/${FLOORS}`, 10, 24, '#e6e9ef', 14);
    text(`HP ${run.hp}/${MAX_HP}`, 130, 24, run.hp <= 4 ? '#ff6b6b' : '#ff8fa3', 14);
    for (let i = 0; i < MAX_HP; i++) {
      ctx.fillStyle = i < run.hp ? '#ff6b8a' : '#2a3140'; ctx.fillRect(236 + i * 7, 13, 5, 12);
    }
    if (run.shield) text(`+${run.shield}`, 322, 24, '#5fd1c8', 13);
    text(`GOLD ${run.gold}`, 360, 24, '#ffd54a', 14);
    text(`seed "${run.seed.slice(0, 10)}"  map #${hex8(fl.fingerprint)}${settings.seeded ? '' : '  UNSEEDED'}`, 480, 24, settings.seeded ? '#9aa3b2' : '#ff6b6b', 12);
    // rune bag: which runes are still in it (not their order)
    text('bag', 812, 24, '#9aa3b2', 12);
    for (let i = 0; i < 7; i++) {
      const inBag = run.bag.includes(i);
      circle(846 + i * 15, 19, 5.5, inBag ? RUNES_LIST[i].color : '#2a3140');
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!started) overlay('DUNGEON SEED', ['Find the stairs on all 3 floors · collect gold', 'WASD to move · walk into chests, runes and monsters', 'The seed decides everything: same seed, same dungeon', 'Press any key to start']);
    else if (run.over === 'fallen') overlay('YOU FELL', [`floor ${run.floor} · ${run.gold} gold · seed "${run.seed}"`, 'Press R to replay this seed, N for a new one']);
    else if (run.over === 'escaped') overlay('ESCAPED!', [`${run.gold} gold · ${run.kills} monsters · ${run.time.toFixed(0)} s · seed "${run.seed}"`, 'Press R to replay this seed, N for a new one']);
    else if (paused) overlay('PAUSED', ['Press P to resume']);
  }

  function overlay(title, lines) {
    ctx.fillStyle = 'rgba(10,12,16,.72)'; ctx.fillRect(0, 0, W, H);
    text(title, W / 2, H / 2 - 16, '#e6e9ef', 28, 'center');
    lines.forEach((l, i) => text(l, W / 2, H / 2 + 14 + i * 20, '#9aa3b2', 13, 'center'));
  }

  // ---------- Lenses ----------
  const BOTTOM = MAP_Y + ROWS * T;
  const LENSES = [
    {
      id: 'seed', name: 'Seed & generator', chap: 'Chapter 27.2',
      formula: 'seed text → hash → 32-bit number\nstate ← (state + 0x6D2B79F5) mod 2³²\nu = scramble(state) ÷ 2³²   0 ≤ u < 1\nsame seed ⇒ same numbers ⇒ same dungeon',
      used: ['Daily-challenge and speedrun seeds', 'Sharing a whole world as one number',
        'Replays and lockstep multiplayer', 'Reproducing a bug report exactly'],
      tryThis: 'Note the map fingerprint, then press R: the same dungeon comes back, chest for chest. Untick "Seeded generator" and press R again: the seed box has not changed, but the dungeon does, every time.',
      controls: '<label><input type="checkbox" data-set="seeded"> Seeded generator (R to rebuild)</label>',
      draw() {
        const builds = fpLog.filter(b => b.seed === seedText).slice(-6);
        const x0 = 12, y0 = BOTTOM - 26 - builds.length * 22;
        box(x0 - 4, y0 - 24, 330, builds.length * 22 + 34);
        text(`floor-1 builds of seed "${seedText}"`, x0 + 4, y0 - 6, '#9aa3b2', 12);
        builds.forEach((b, i) => {
          const y = y0 + i * 22;
          for (let bit = 0; bit < 32; bit++) {
            ctx.fillStyle = (b.fp >>> bit) & 1 ? '#6cb8ff' : '#1f2430';
            ctx.fillRect(x0 + 4 + bit * 6, y + 2, 5, 14);
          }
          text(`#${hex8(b.fp)}${b.seeded ? '' : ' (unseeded)'}`, x0 + 206, y + 14, b.fp === builds[0].fp ? '#5fd18b' : '#ff6b6b', 11);
        });
      },
      live() {
        const m = fl.mapStream;
        const builds = fpLog.filter(b => b.seed === seedText);
        const same = builds.every(b => b.fp === builds[0].fp);
        return `seed text    "${seedText}"\nhash(seed)   0x${hex8(hashStr(seedText))}\nmap stream   seed 0x${hex8(m.seed)}\n             state 0x${hex8(m.state)}\n             ${m.count} numbers drawn\nlast u       ${m.last.map(f3).join('  ')}\nfingerprint  #${hex8(fl.fingerprint)}\nbuilds       ${builds.length}, ${same ? 'all identical' : 'DIFFERENT'}\nseeded       ${settings.seeded ? 'yes' : 'NO: Math.random'}`;
      },
    },
    {
      id: 'noise', name: 'Noise', chap: 'Chapter 27.7',
      formula: 'dᵢ = gᵢ · (p − cornerᵢ)   gradient · offset\nu = fade(fx), v = fade(fy)\nfade(t) = 6t⁵ − 15t⁴ + 10t³\nn = lerp(lerp(d₀₀, d₁₀, u), lerp(d₀₁, d₁₁, u), v)\ntotal = (n₈ + 0.5 n₄) ÷ 1.5\nfloor if total > threshold',
      used: ['Terrain heightmaps and biomes', 'Caves and islands', 'Clouds, fire, water and marble textures',
        'Camera shake and wobbly motion', 'Grass and foliage swaying in the wind'],
      tryThis: 'Walk around and watch the four corner dot products change smoothly. Switch to Value noise and press R: the same seed now carves blockier caves.',
      controls: `<label>Noise <select data-set="noiseType"><option value="perlin">Perlin (gradient)</option><option value="value">Value</option></select> (R to rebuild)</label>`,
      draw() {
        const o = fl.N.octaves[0], th = THRESH[fl.N.type];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
          const v = fl.noise[idx(c, r)] - th;
          ctx.fillStyle = v > 0 ? `rgba(255,181,71,${clamp(v * 1.3, 0, .55)})` : `rgba(108,184,255,${clamp(-v * 1.3, 0, .55)})`;
          ctx.fillRect(c * T, MAP_Y + r * T, T, T);
        }
        ctx.strokeStyle = 'rgba(230,233,239,.25)'; ctx.lineWidth = 1; ctx.beginPath();
        for (let i = 0; i <= COLS / o.cell; i++) { ctx.moveTo(i * o.cell * T, MAP_Y); ctx.lineTo(i * o.cell * T, BOTTOM); }
        for (let j = 0; j <= ROWS / o.cell; j++) { ctx.moveTo(0, MAP_Y + j * o.cell * T); ctx.lineTo(WORLD.w, MAP_Y + j * o.cell * T); }
        ctx.stroke();
        for (let j = 0; j < o.gh; j++) for (let i = 0; i < o.gw; i++) {
          const x = i * o.cell * T, y = MAP_Y + j * o.cell * T;
          if (y > BOTTOM + 1 || x > WORLD.w + 1) continue;
          const g = o.g[j * o.gw + i];
          if (fl.N.type === 'perlin') arrow(x, y, x + g.x * 40, y + g.y * 40, '#e6e9ef', 2);
          else { circle(x, y, 3 + Math.abs(g) * 9, g > 0 ? 'rgba(255,181,71,.8)' : 'rgba(108,184,255,.8)'); }
        }
        const s = octaveSample(o, fl.N.type, player.c + 0.5, player.r + 0.5);
        const px = cx(player.c), py = cy(player.r);
        for (const k of s.corners) {
          const x = (s.i + k.dx) * o.cell * T, y = MAP_Y + (s.j + k.dy) * o.cell * T;
          ctx.setLineDash([4, 4]); ctx.strokeStyle = '#ffb547'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(px, py); ctx.stroke(); ctx.setLineDash([]);
          text(f2(k.d), lerp(x, px, 0.3), lerp(y, py, 0.3) - 4, '#ffb547', 12, 'center');
        }
      },
      live() {
        const o = fl.N.octaves[0];
        const s = octaveSample(o, fl.N.type, player.c + 0.5, player.r + 0.5);
        const per = fl.N.type === 'perlin';
        const rows = s.corners.map(k => per
          ? ` d${k.dx}${k.dy} = (${f2(k.g.x)}, ${f2(k.g.y)})·(${f2(k.ox)}, ${f2(k.oy)}) = ${f2(k.d)}`
          : ` v${k.dx}${k.dy} = ${f2(k.d)}`).join('\n');
        const total = fl.noise[idx(player.c, player.r)];
        return `${per ? 'Perlin' : 'value'} noise, octave 1 (cell 8 tiles)\ncell (${s.i}, ${s.j})  local (${f2(s.fx)}, ${f2(s.fy)})\n${rows}\n u = fade(${f2(s.fx)}) = ${f2(s.u)}   v = fade(${f2(s.fy)}) = ${f2(s.v)}\n n₈ = ${f3(s.val)}\ntotal with octave 2: ${f3(total)}\nthreshold ${THRESH[fl.N.type]} → ${total > THRESH[fl.N.type] ? 'floor' : 'wall'}`;
      },
    },
    {
      id: 'poisson', name: 'Poisson disks', chap: 'Chapter 27.8',
      formula: `every two props at least r apart\nr = ${POISSON_R} tiles, k = ${POISSON_K} tries per point\ncandidates in the ring r … 2r\nspeed-up grid: cell = r ÷ √2`,
      used: ['Trees, rocks and grass tufts', 'Enemy and loot spawn points', 'Stars and particles that never clump',
        'Stippling and dithering effects'],
      tryThis: 'Every prop owns a disk of radius r/2, and no two disks overlap. Untick "Poisson-disk placement" and press R: plain uniform random points clump together and leave big empty gaps.',
      controls: '<label><input type="checkbox" data-set="poisson"> Poisson-disk placement (R to rebuild)</label>',
      draw() {
        const pts = [].concat(fl.chests, fl.runes, fl.enemies, fl.decor);
        pts.push({ c: fl.start % COLS, r: Math.floor(fl.start / COLS) }, { c: fl.exit % COLS, r: Math.floor(fl.exit / COLS) });
        let best = null, bd = Infinity;
        for (let a = 0; a < pts.length; a++) {
          const p = pts[a];
          circle(cx(p.c), cy(p.r), POISSON_R / 2 * T, 'rgba(180,140,255,.12)', 'rgba(180,140,255,.7)', 1.2);
          for (let b = a + 1; b < pts.length; b++) {
            const d = Math.hypot(p.c - pts[b].c, p.r - pts[b].r);
            if (d < bd) { bd = d; best = [p, pts[b]]; }
          }
        }
        if (best) {
          ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(cx(best[0].c), cy(best[0].r)); ctx.lineTo(cx(best[1].c), cy(best[1].r)); ctx.stroke();
          text(`closest ${f2(bd)}`, cx(best[0].c), cy(best[0].r) - 14, '#ff6b6b', 12, 'center');
        }
      },
      live() {
        const p = fl.poisson;
        return `placement     ${p.on ? 'Poisson disk' : 'UNIFORM random'}\npoints        ${p.count} + start + exit\nr, k          ${POISSON_R} tiles, ${POISSON_K}\ncandidates    ${p.tried} tried\nrejected      ${p.rejected} (too close / wall)\nclosest pair  ${f2(p.minD)} tiles ${p.minD >= POISSON_R ? '≥' : '<'} r\nchests ${fl.chests.length}  runes ${fl.runes.length}  monsters ${fl.enemies.length}  decor ${fl.decor.length}`;
      },
    },
    {
      id: 'loot', name: 'Loot table', chap: 'Chapter 27.3–27.4',
      formula: 'P(item) = weight ÷ total weight (100)\nE[gold] = Σ P × gold = 4.5\nVar = E[gold²] − E[gold]² ≈ 114.25\nσ ≈ 10.69\nmean of n chests → 4.5,  spread ≈ σ ÷ √n',
      used: ['Loot drops and treasure chests', 'Gacha and card-pack odds', 'Enemy spawn tables',
        'Balancing rewards with expected value'],
      tryThis: 'Press "Simulate 1,000 chests" and watch the running average settle toward 4.5 inside the narrowing funnel. Early on, one Crown (1%) can throw it far off.',
      controls: '<div class="row"><button class="btn" data-act="sim">Simulate 1,000 chests</button><button class="btn" data-act="simreset">Reset</button></div>',
      draw() {
        const x0 = 16, y0 = BOTTOM - 196, w = 380, h = 180;
        box(x0 - 6, y0 - 20, w + 22, h + 34);
        text(`running mean of gold per chest   n = ${sim.n}`, x0, y0 - 5, '#9aa3b2', 11);
        const maxN = Math.max(100, sim.target, sim.n), Y = g => y0 + h - clamp(g, 0, 12) / 12 * h;
        ctx.strokeStyle = '#2a3140'; ctx.lineWidth = 1; ctx.strokeRect(x0, y0, w, h);
        // ±2σ/√n funnel
        ctx.fillStyle = 'rgba(108,184,255,.12)'; ctx.beginPath();
        for (let i = 1; i <= maxN; i += Math.max(1, maxN / 200 | 0)) ctx.lineTo(x0 + i / maxN * w, Y(4.5 + 2 * 10.69 / Math.sqrt(i)));
        for (let i = maxN; i >= 1; i -= Math.max(1, maxN / 200 | 0)) ctx.lineTo(x0 + i / maxN * w, Y(4.5 - 2 * 10.69 / Math.sqrt(i)));
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#5fd18b'; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(x0, Y(4.5)); ctx.lineTo(x0 + w, Y(4.5)); ctx.stroke(); ctx.setLineDash([]);
        text('E = 4.5', x0 + w - 56, Y(4.5) - 5, '#5fd18b', 11);
        if (sim.means.length) {
          ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 1.5; ctx.beginPath();
          sim.means.forEach((m, i) => ctx.lineTo(x0 + (i + 1) / maxN * w, Y(m)));
          ctx.stroke();
        }
        text('12', x0 + 3, y0 + 12, '#6b7385', 10); text('0', x0 + 3, y0 + h - 3, '#6b7385', 10);
      },
      live() {
        const rows = LOOT.map(it => `${it.name.padEnd(7)} ${String(it.w).padStart(3)}  ${(it.w / 100).toFixed(2)}  ${it.heal ? '+4 HP' : String(it.gold).padStart(3) + ' g'}`).join('\n');
        return `item    weight  P   value\n${rows}\nE[gold per chest] = 4.50\nthis run: ${run.chestsOpened} chests, ${run.chestGold} gold${run.chestsOpened ? ` (avg ${f2(run.chestGold / run.chestsOpened)})` : ''}\nsimulated: n = ${sim.n}${sim.n ? `, mean ${f2(sim.sum / sim.n)}, σ/√n ≈ ${f2(10.69 / Math.sqrt(sim.n))}` : ''}`;
      },
    },
    {
      id: 'bag', name: 'Shuffle bag', chap: 'Chapter 27.5',
      formula: 'Fisher–Yates: for i = n−1 down to 1\n  j = random integer 0 … i; swap a[i], a[j]\n→ each of 7! = 5040 orders: 1/5040\nnaive: j = random 0 … n−1 for every i\n→ 7⁷ = 823 543 equally likely paths,\n  not a multiple of 5040: biased',
      used: ['Tetris-style 7-bag piece order', 'Card games and deck-builders', 'Music playlists without repeats',
        'Spreading rare events fairly (bad luck protection)'],
      tryThis: 'The heat map counts where each rune lands after thousands of test shuffles: every cell should be near 14.3%. Untick "Fair shuffle" and the naive shuffle\'s bias shows up as a pattern within seconds.',
      controls: '<label><input type="checkbox" data-set="fairShuffle"> Fair shuffle (Fisher–Yates)</label>',
      draw() {
        const cell = 34, x0 = WORLD.w - 7 * cell - 22, y0 = BOTTOM - 7 * cell - 16;
        box(x0 - 74, y0 - 40, 7 * cell + 90, 7 * cell + 50);
        text(`rune × slot after ${shuf.total} shuffles`, x0 - 66, y0 - 24, '#9aa3b2', 11);
        for (let p = 0; p < 7; p++) text(`${p + 1}`, x0 + p * cell + cell / 2, y0 - 6, '#9aa3b2', 11, 'center');
        if (!shuf.counts) return;
        for (let i = 0; i < 7; i++) {
          text(RUNES_LIST[i].name, x0 - 8, y0 + i * cell + cell / 2 + 4, RUNES_LIST[i].color, 11, 'right');
          for (let p = 0; p < 7; p++) {
            const q = shuf.total ? shuf.counts[i][p] / shuf.total : 1 / 7, dev = (q - 1 / 7) * 7;
            ctx.fillStyle = dev > 0 ? `rgba(255,181,71,${clamp(dev * 3, 0, .9)})` : `rgba(108,184,255,${clamp(-dev * 3, 0, .9)})`;
            ctx.fillRect(x0 + p * cell, y0 + i * cell, cell - 2, cell - 2);
            text((q * 100).toFixed(1), x0 + p * cell + cell / 2 - 1, y0 + i * cell + cell / 2 + 3, '#e6e9ef', 9, 'center');
          }
        }
      },
      live() {
        let lo = 1, hi = 0;
        if (shuf.counts && shuf.total) for (const row of shuf.counts) for (const v of row) { lo = Math.min(lo, v / shuf.total); hi = Math.max(hi, v / shuf.total); }
        const left = RUNES_LIST.filter((_, i) => run.bag.includes(i)).map(r => r.name).join(' ');
        const drawn = run.drawn.slice(-7).map(i => RUNES_LIST[i].name).join(' ');
        return `shuffle      ${settings.fairShuffle ? 'Fisher–Yates (fair)' : 'NAIVE (biased)'}\nbags filled  ${run.bagsFilled}\nstill in bag ${left || '(empty: refills at next rune)'}\nlast drawn   ${drawn || '-'}\ntest shuffles ${shuf.total}\ncell range   ${shuf.total ? `${(lo * 100).toFixed(1)}% … ${(hi * 100).toFixed(1)}%` : '-'}\nfair target  ${(100 / 7).toFixed(1)}% everywhere`;
      },
    },
    {
      id: 'crit', name: 'Fair crits', chap: 'Chapter 27.6',
      formula: 'P(crit on attack N) = C × N\nC = 0.0847 → long-run rate 25%\nN counts attacks since the last crit\nC × 12 ≥ 1: a crit by attack 12 at the latest',
      used: ['Critical hits and dodge chances', 'Proc effects on weapons', 'Rare drop "pity timers"',
        'Any chance players feel is "streaky"'],
      tryThis: 'Fight a few monsters and watch the meter: every miss raises the next chance by 8.5 points. Untick "Pseudo-random distribution" for plain 25% rolls: long dry streaks and back-to-back crits both get more common.',
      controls: '<label><input type="checkbox" data-set="prd"> Pseudo-random distribution</label>',
      draw() {
        const N = run.prdN + 1, P = critChance(N, settings.prd);
        const px = player.x * T + T / 2, py = MAP_Y + player.y * T + T / 2;
        ctx.fillStyle = '#1f2430'; ctx.fillRect(px - 30, py - 26, 60, 6);
        ctx.fillStyle = '#ffb547'; ctx.fillRect(px - 30, py - 26, 60 * P, 6);
        text(settings.prd ? `next: ${f3(PRD_C)}×${N} = ${(P * 100).toFixed(0)}%` : 'next: 25%', px, py - 32, '#ffb547', 12, 'center');
        const x0 = 16, y0 = BOTTOM - 40;
        box(x0 - 6, y0 - 22, 40 * 9 + 14, 42);
        text('last 40 attacks (orange = crit)', x0, y0 - 8, '#9aa3b2', 11);
        run.history.forEach((c, i) => { ctx.fillStyle = c ? '#ffb547' : '#3a4152'; ctx.fillRect(x0 + i * 9, y0, 7, 12); });
      },
      live() {
        const a = run.lastAttack;
        const N = run.prdN + 1, P = critChance(N, settings.prd);
        return `mode         ${settings.prd ? 'PRD (C × N)' : 'independent 25%'}\nnext attack  N = ${N}, P = ${(P * 100).toFixed(1)}%\nlast roll    ${a ? `u = ${f3(a.u)} vs P = ${f3(a.P)} → ${a.crit ? 'CRIT' : 'normal'}` : '-'}\nattacks      ${run.attacks}\ncrits        ${run.crits} (${run.attacks ? (run.crits / run.attacks * 100).toFixed(0) : 0}%)\nlongest dry  ${run.maxDry} attacks in a row`;
      },
    },
  ];
  for (const l of LENSES) l.on = false;
  const lens = id => LENSES.find(l => l.id === id);

  // ---------- Panel ----------
  const lensesEl = document.getElementById('lenses');
  const cardEl = document.getElementById('card');
  let selected = null, liveEl = null;
  LENSES.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'lens';
    b.innerHTML = `<kbd>${i + 1}</kbd>${l.name}`;
    b.addEventListener('click', () => { toggleLens(l); b.blur(); });
    l.btn = b; lensesEl.appendChild(b);
  });
  function toggleLens(l) {
    if (!l) return;
    if (l.on && selected === l) l.on = false; else l.on = true;
    selected = l.on ? l : LENSES.find(x => x.on) || null;
    for (const x of LENSES) { x.btn.classList.toggle('on', x.on); x.btn.classList.toggle('sel', x === selected); }
    renderCard();
  }
  function renderCard() {
    if (!selected) {
      cardEl.innerHTML = `<h2>No lens on</h2><p style="margin:0;color:var(--muted)">Play a floor first. Then press 1–6 to see the random numbers behind the dungeon, the loot and the crits.</p>`;
      liveEl = null; return;
    }
    const l = selected;
    cardEl.innerHTML = `
      <h2>${l.name}</h2><span class="chap">${l.chap}</span>
      <div class="formula">${l.formula}</div>
      <h3>Where it's used in games</h3>
      <ul>${l.used.map(u => `<li>${u}</li>`).join('')}</ul>
      <h3>Try this</h3><div class="try">${l.tryThis}</div>
      ${l.controls ? `<div class="controls">${l.controls}</div>` : ''}
      <h3>Live numbers</h3><div class="live"></div>`;
    liveEl = cardEl.querySelector('.live');
    cardEl.querySelectorAll('[data-set]').forEach(el => {
      const key = el.dataset.set;
      if (el.type === 'checkbox') el.checked = settings[key]; else el.value = settings[key];
      el.addEventListener('change', () => {
        settings[key] = el.type === 'checkbox' ? el.checked : el.value;
        el.blur();
      });
    });
    cardEl.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', () => {
      if (el.dataset.act === 'sim') sim.target = sim.n + 1000;
      else { sim.n = 0; sim.sum = 0; sim.target = 0; sim.means = []; sim.stream = makeStream(seedText, 'sim', settings.seeded); }
      el.blur();
    }));
    updateLive();
  }
  function updateLive() { if (liveEl && selected) liveEl.textContent = selected.live(); }

  seedInput.value = seedText;
  newRun();
  renderCard();

  // ---------- Loop ----------
  let last = performance.now(), liveTimer = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (started && !paused) update(dt);
    render();
    liveTimer -= dt;
    if (liveTimer <= 0) { updateLive(); liveTimer = 0.1; }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
