<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turret Defense</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b23;
    --panel-2: #1f2430;
    --line: #2a3140;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #6cb8ff;
    --warn: #ffb547;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #app { display: flex; height: 100vh; }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  #panel { width: 340px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .lenses { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .lens { display: flex; align-items: center; gap: 6px; text-align: left; padding: 7px 8px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font: inherit; font-size: 12.5px; cursor: pointer; }
  .lens kbd { font: 11px Menlo, Consolas, monospace; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px; }
  .lens.on { border-color: var(--accent); background: #1d2b3d; }
  .lens.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .chap { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid #2d4766;
    border-radius: 999px; padding: 1px 8px; margin-bottom: 8px; }
  .formula { font: 13px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin: 6px 0 10px; white-space: pre-wrap; color: #cfe6ff; }
  .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 4px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin: 2px 0; }
  .try { color: var(--warn); }
  .live { font: 12.5px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin-top: 6px; white-space: pre; overflow-x: auto; min-height: 3em; }
  .controls { margin-top: 8px; display: grid; gap: 6px; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls input[type=range] { flex: 1; }
  .help { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  .help b { color: var(--text); }
  @media (max-width: 820px) {
    #app { flex-direction: column; height: auto; }
    #stage { flex: none; height: 62vh; }
    #panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
  <aside id="panel">
    <h1>Turret Defense</h1>
    <p class="sub">Guard the core for ten waves. Every turret finds its target with atan2 and turns the shortest way, at a limited speed.</p>
    <div class="lenses" id="lenses"></div>
    <div class="card" id="card"></div>
    <div class="help">
      <b>Build</b> click an empty pad (60) · <b>Upgrade</b> click a turret · <b>Next wave now</b> Space ·
      <b>Lenses</b> keys 1–5 · <b>Restart</b> R · <b>Pause</b> P
    </div>
  </aside>
</div>

<script>
(() => {
  // ---------- Vector helpers (Chapter 11) ----------
  const V = (x = 0, y = 0) => ({ x, y });
  const add = (a, b) => V(a.x + b.x, a.y + b.y);
  const sub = (a, b) => V(a.x - b.x, a.y - b.y);
  const mul = (a, s) => V(a.x * s, a.y * s);
  const len = a => Math.hypot(a.x, a.y);
  const norm = a => { const l = len(a); return l > 0 ? V(a.x / l, a.y / l) : V(); };
  const dist = (a, b) => len(sub(a, b));
  const fromAngle = (t, r = 1) => V(Math.cos(t) * r, Math.sin(t) * r);   // Chapter 8
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const rand = (a, b) => a + Math.random() * (b - a);
  const f0 = n => Math.round(n).toString();
  const f1 = n => (Math.abs(n) < 0.05 ? 0 : n).toFixed(1);
  const f2 = n => (Math.abs(n) < 0.005 ? 0 : n).toFixed(2);
  const TAU = Math.PI * 2;
  const deg = r => r * 180 / Math.PI;
  const rad = d => d * Math.PI / 180;

  // ---------- The math of this chapter ----------
  // Wrap any angle into (−180°, 180°]:  wrap(a) = a − 360°·⌈(a − 180°) / 360°⌉
  const wrap = a => a - TAU * Math.ceil((a - Math.PI) / TAU);
  // Angle of the direction (dx, dy). With "Use atan2" off: atan(dy/dx), which loses the quadrant.
  function angleOf(dx, dy) {
    if (settings.useAtan2) return Math.atan2(dy, dx);
    if (dx === 0) return dy === 0 ? 0 : Math.sign(dy) * Math.PI / 2;
    return Math.atan(dy / dx);
  }
  // One of 8 direction sprites: index = round(θ / 45°) mod 8   (y-down: 45° is down-right)
  const dir8 = th => ((Math.round(th / (Math.PI / 4)) % 8) + 8) % 8;
  const DIR_NAMES = ['E', 'SE', 'S', 'SW', 'W', 'NW', 'N', 'NE'];
  const quadrant = (dx, dy) => (dy < 0 ? 'up' : dy > 0 ? 'down' : '') + (dx < 0 ? '-left' : dx > 0 ? '-right' : '');

  const settings = {
    useAtan2: true,       // pitfall when false: atan(dy/dx)
    shortestTurn: true,   // pitfall when false: turn by the raw difference, no wrap
  };
  // Turret levels: maximum turn speed ω (°/s), reload (s), damage, range (px), cost
  const LEVELS = [
    { turn: 90,  reload: 0.5,  dmg: 1, range: 220, cost: 60 },
    { turn: 180, reload: 0.4,  dmg: 2, range: 240, cost: 70 },
    { turn: 360, reload: 0.3,  dmg: 3, range: 260, cost: 110 },
  ];
  const AIM_TOL = rad(5);          // fire when |Δθ| ≤ 5°
  const BULLET_SPEED = 520;
  const WAVES = 10, LIVES = 10;
  const START_MONEY = 200, KILL_REWARD = 6, WAVE_BONUS = 25;
  const BREAK = 6;                 // seconds between waves

  // ---------- World ----------
  const WORLD = { w: 1000, h: 700 };
  const CORE = V(500, 350), CORE_R = 30;
  const PADS = [V(380, 280), V(500, 210), V(620, 280), V(620, 420), V(500, 490), V(380, 420),
    V(230, 350), V(770, 350), V(330, 150), V(670, 150), V(330, 550), V(670, 550)];
  const PAD_R = 20;

  // ---------- Canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 800, H = 600, DPR = 1, S = 1, OX = 0, OY = 0;
  function resize() {
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    S = Math.min(W / WORLD.w, H / WORLD.h);
    OX = (W - WORLD.w * S) / 2; OY = (H - WORLD.h * S) / 2;
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  // ---------- Input ----------
  let mouseW = V(-999, -999);
  const toWorld = e => {
    const r = canvas.getBoundingClientRect();
    return V((e.clientX - r.left - OX) / S, (e.clientY - r.top - OY) / S);
  };
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (/^[1-5]$/.test(k)) { toggleLens(LENSES[+k - 1]); return; }
    if (k === ' ') e.preventDefault();
    if (!started) { started = true; return; }
    if (k === 'r') reset();
    if (k === 'p') paused = !paused;
    if ((k === ' ' || k === 'n') && !state.over && !paused) callWave();
  });
  canvas.addEventListener('pointermove', e => { mouseW = toWorld(e); });
  canvas.addEventListener('pointerdown', e => {
    mouseW = toWorld(e);
    if (!started) { started = true; return; }
    if (state.over) { reset(); return; }
    if (!paused) clickAt(mouseW);
  });

  // ---------- State ----------
  let state, turrets, enemies, bullets, popups, sel;
  let started = false, paused = false;

  function reset() {
    state = { over: null, time: 0, wave: 0, lives: LIVES, money: START_MONEY, score: 0, kills: 0,
      breakT: 5, spawnLeft: 0, spawnT: 0, waveActive: false };
    turrets = []; enemies = []; bullets = []; popups = []; sel = null;
  }
  reset();

  function popup(pos, text, color) { popups.push({ pos: V(pos.x, pos.y), text, color, life: 1.3 }); }

  function padAt(p) {
    for (let i = 0; i < PADS.length; i++) if (dist(p, PADS[i]) < PAD_R + 8) return i;
    return -1;
  }
  function clickAt(p) {
    const i = padAt(p);
    if (i < 0) return;
    const t = turrets.find(t => t.pad === i);
    if (!t) {
      if (state.money < LEVELS[0].cost) { popup(V(PADS[i].x, PADS[i].y - 28), `need ${LEVELS[0].cost}`, '#ff6b6b'); return; }
      state.money -= LEVELS[0].cost;
      const nt = { pad: i, pos: V(PADS[i].x, PADS[i].y), level: 1, facing: angleOfTrue(sub(CORE, PADS[i])) + Math.PI,
        reload: 0, target: null, want: 0, trueAngle: 0, rawDiff: 0, diff: 0, step: 0, dx: 0, dy: 0, shots: 0 };
      nt.facing = wrap(nt.facing);
      turrets.push(nt); sel = nt;
      popup(V(nt.pos.x, nt.pos.y - 28), 'built', '#5fd18b');
    } else {
      sel = t;
      if (t.level >= LEVELS.length) { popup(V(t.pos.x, t.pos.y - 28), 'max level', '#9aa3b2'); return; }
      const cost = LEVELS[t.level].cost;
      if (state.money < cost) { popup(V(t.pos.x, t.pos.y - 28), `upgrade ${cost}`, '#ff6b6b'); return; }
      state.money -= cost; t.level++;
      popup(V(t.pos.x, t.pos.y - 28), `level ${t.level}: ${LEVELS[t.level - 1].turn}°/s`, '#5fd18b');
    }
  }
  const angleOfTrue = v => Math.atan2(v.y, v.x);

  function startWave() {
    state.wave++; state.waveActive = true;
    state.spawnLeft = 6 + 2 * state.wave; state.spawnT = 0;
    popup(V(CORE.x, CORE.y - 60), `WAVE ${state.wave}`, '#ffb547');
  }
  function callWave() {
    if (state.waveActive || state.wave >= WAVES) return;
    const bonus = Math.ceil(Math.max(0, state.breakT)) * 3;
    if (bonus > 0) { state.money += bonus; popup(V(CORE.x, CORE.y - 84), `+${bonus} early`, '#ffd166'); }
    startWave();
  }

  // Enemies enter from a random direction θ, on the edge of the world: core + t·(cos θ, sin θ)
  function spawnEnemy() {
    const n = state.wave;
    const th = rand(-Math.PI, Math.PI);
    const c = Math.cos(th), s = Math.sin(th);
    const t = Math.min((WORLD.w / 2 + 20) / Math.max(Math.abs(c), 1e-6), (WORLD.h / 2 + 20) / Math.max(Math.abs(s), 1e-6));
    const runner = n >= 3 && Math.random() < 0.15 + n * 0.03;
    const hp = 2 + Math.round(0.9 * n), hpR = Math.ceil(hp / 2);
    enemies.push({ pos: add(CORE, fromAngle(th, t)), vel: V(), heading: wrap(th + Math.PI), hp: runner ? hpR : hp, maxHp: runner ? hpR : hp,
      r: runner ? 9 : 12, speed: (runner ? 1.7 : 1) * (44 + 2.5 * n), swirl: Math.random() < 0.5 ? 1 : -1, runner });
  }

  function fire(t) {
    const L = LEVELS[t.level - 1];
    bullets.push({ pos: add(t.pos, fromAngle(t.facing, 22)), vel: fromAngle(t.facing, BULLET_SPEED), life: 0.75, dmg: L.dmg });
    t.reload = L.reload; t.shots++;
  }

  // ---------- Update ----------
  function update(dt) {
    for (const p of popups) { p.life -= dt; p.pos.y -= 22 * dt; }
    popups = popups.filter(p => p.life > 0);
    if (state.over) return;
    state.time += dt;

    // Waves
    if (!state.waveActive) {
      state.breakT -= dt;
      if (state.breakT <= 0) startWave();
    } else {
      state.spawnT -= dt;
      if (state.spawnLeft > 0 && state.spawnT <= 0) {
        spawnEnemy(); state.spawnLeft--;
        state.spawnT = Math.max(0.45, 1.5 - 0.1 * state.wave);
      }
      if (state.spawnLeft === 0 && enemies.length === 0) {
        state.waveActive = false;
        state.money += WAVE_BONUS; state.score += 50;
        if (state.wave >= WAVES) { state.over = 'won'; state.score += state.lives * 20; }
        else { state.breakT = BREAK; popup(V(CORE.x, CORE.y - 60), `wave clear +${WAVE_BONUS}`, '#5fd18b'); }
      }
    }

    // Enemies spiral in toward the core; their heading is atan2(vy, vx)
    for (const e of enemies) {
      const to = sub(CORE, e.pos), d = len(to), r = mul(to, 1 / d);
      const swirl = 0.55 * clamp((d - 80) / 250, 0, 1) * e.swirl;
      e.vel = mul(norm(add(r, mul(V(-r.y, r.x), swirl))), e.speed);
      e.pos = add(e.pos, mul(e.vel, dt));
      e.heading = Math.atan2(e.vel.y, e.vel.x);
      if (d < CORE_R + e.r) {
        e.dead = true; state.lives--;
        popup(V(CORE.x, CORE.y - 40), '−1 life', '#ff6b6b');
        if (state.lives <= 0) { state.lives = 0; state.over = 'lost'; }
      }
    }

    // Turrets: aim with atan2, wrap the difference, turn at most ω·Δt
    for (const t of turrets) {
      const L = LEVELS[t.level - 1];
      t.reload -= dt;
      let best = null, bd = Infinity;
      for (const e of enemies) {
        if (e.dead || dist(e.pos, t.pos) > L.range) continue;
        const dc = dist(e.pos, CORE);
        if (dc < bd) { bd = dc; best = e; }
      }
      t.target = best;
      if (!best) { t.step = 0; continue; }
      t.dx = best.pos.x - t.pos.x; t.dy = best.pos.y - t.pos.y;
      t.want = angleOf(t.dx, t.dy);
      t.trueAngle = Math.atan2(t.dy, t.dx);
      t.rawDiff = t.want - t.facing;
      t.diff = settings.shortestTurn ? wrap(t.rawDiff) : t.rawDiff;
      const maxStep = rad(L.turn) * dt;
      t.step = clamp(t.diff, -maxStep, maxStep);
      t.facing = wrap(t.facing + t.step);
      t.aimErr = Math.abs(wrap(t.want - t.facing));
      if (t.aimErr <= AIM_TOL && t.reload <= 0) fire(t);
    }

    // Bullets
    for (const b of bullets) {
      b.pos = add(b.pos, mul(b.vel, dt)); b.life -= dt;
      for (const e of enemies) {
        if (e.dead || dist(b.pos, e.pos) >= e.r + 4) continue;
        e.hp -= b.dmg; b.life = 0;
        if (e.hp <= 0) {
          e.dead = true; state.kills++; state.money += KILL_REWARD; state.score += 10;
          popup(V(e.pos.x, e.pos.y - 14), `+${KILL_REWARD}`, '#ffd166');
        }
        break;
      }
    }
    enemies = enemies.filter(e => !e.dead);
    bullets = bullets.filter(b => b.life > 0);
  }

  // ---------- Drawing ----------
  function arrow(from, vec, color, label, lw = 2.5) {
    const to = add(from, vec);
    if (len(vec) < 2) return;
    const a = Math.atan2(vec.y, vec.x);
    ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(to.x, to.y);
    ctx.lineTo(to.x - Math.cos(a - .4) * 10, to.y - Math.sin(a - .4) * 10);
    ctx.lineTo(to.x - Math.cos(a + .4) * 10, to.y - Math.sin(a + .4) * 10);
    ctx.closePath(); ctx.fill();
    if (label) text(label, to.x + 6, to.y - 6, color, 13);
  }
  function text(t, x, y, color = '#e6e9ef', size = 12, align = 'left') {
    ctx.font = `${size}px Menlo, Consolas, monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,12,16,.9)'; ctx.strokeText(t, x, y);
    ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  function circle(p, r, fill, stroke, lw = 2) {
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function dashed(on) { ctx.setLineDash(on ? [5, 6] : []); }
  // Arc from angle a turning by delta (positive = clockwise on this y-down screen)
  function turnArc(p, r, a, delta, color, lw = 2) {
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, a, a + delta, delta < 0); ctx.stroke();
    const e = a + delta, s = Math.sign(delta) || 1;
    const tip = add(p, fromAngle(e, r)), tan = fromAngle(e + s * Math.PI / 2, 1);
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(tip.x + tan.x * 7, tip.y + tan.y * 7);
    ctx.lineTo(tip.x - tan.x * 2 + Math.cos(e) * 5, tip.y - tan.y * 2 + Math.sin(e) * 5);
    ctx.lineTo(tip.x - tan.x * 2 - Math.cos(e) * 5, tip.y - tan.y * 2 - Math.sin(e) * 5);
    ctx.closePath(); ctx.fill();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);

    ctx.fillStyle = '#131720'; ctx.fillRect(0, 0, WORLD.w, WORLD.h);
    ctx.strokeStyle = '#1a1f29'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= WORLD.w; x += 50) { ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.h); }
    for (let y = 0; y <= WORLD.h; y += 50) { ctx.moveTo(0, y); ctx.lineTo(WORLD.w, y); }
    ctx.stroke();
    ctx.strokeStyle = '#2b3242'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, WORLD.w - 2, WORLD.h - 2);

    // Core
    circle(CORE, CORE_R + 8, 'rgba(108,184,255,.08)', null);
    circle(CORE, CORE_R, '#1d2b3d', '#6cb8ff', 3);
    text(`${state.lives}`, CORE.x, CORE.y + 6, '#cfe6ff', 18, 'center');

    // Pads, with range preview on hover
    const hover = padAt(mouseW);
    PADS.forEach((p, i) => {
      if (turrets.some(t => t.pad === i)) return;
      dashed(true); circle(p, PAD_R, 'rgba(42,49,64,.35)', i === hover ? '#e6e9ef' : '#3a4357', 1.5); dashed(false);
      text(`${LEVELS[0].cost}`, p.x, p.y + 4, state.money >= LEVELS[0].cost ? '#ffd166' : '#6b7385', 11, 'center');
      if (i === hover) { dashed(true); circle(p, LEVELS[0].range, null, 'rgba(230,233,239,.25)', 1); dashed(false); }
    });

    // Range of the selected or hovered turret
    for (const t of turrets) if (t === sel || t.pad === hover) {
      dashed(true); circle(t.pos, LEVELS[t.level - 1].range, null, t === sel ? 'rgba(108,184,255,.35)' : 'rgba(230,233,239,.25)', 1); dashed(false);
    }

    // Enemies: body + one of 8 direction sprites
    for (const e of enemies) {
      const k = dir8(e.heading), a = k * Math.PI / 4;
      circle(e.pos, e.r, e.runner ? '#4a2440' : '#5a2330', e.runner ? '#e07bd0' : '#ff6b6b', 2);
      const tip = add(e.pos, fromAngle(a, e.r + 6)), l = add(e.pos, fromAngle(a + 2.5, e.r - 2)), r = add(e.pos, fromAngle(a - 2.5, e.r - 2));
      ctx.fillStyle = e.runner ? '#e07bd0' : '#ff6b6b';
      ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.lineTo(l.x, l.y); ctx.lineTo(r.x, r.y); ctx.closePath(); ctx.fill();
      if (e.hp < e.maxHp) {
        ctx.fillStyle = '#1f2430'; ctx.fillRect(e.pos.x - 12, e.pos.y - e.r - 9, 24, 4);
        ctx.fillStyle = '#5fd18b'; ctx.fillRect(e.pos.x - 12, e.pos.y - e.r - 9, 24 * e.hp / e.maxHp, 4);
      }
    }

    // Bullets
    ctx.fillStyle = '#cfe6ff';
    for (const b of bullets) { ctx.beginPath(); ctx.arc(b.pos.x, b.pos.y, 3.5, 0, TAU); ctx.fill(); }

    // Turrets
    for (const t of turrets) {
      const col = ['#ffb547', '#6cb8ff', '#b48cff'][t.level - 1];
      circle(t.pos, 17, '#232a37', t === sel ? '#e6e9ef' : col, t === sel ? 3 : 2);
      const tip = add(t.pos, fromAngle(t.facing, 24));
      ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(t.pos.x, t.pos.y); ctx.lineTo(tip.x, tip.y); ctx.stroke(); ctx.lineCap = 'butt';
      circle(t.pos, 7, col);
      for (let i = 0; i < t.level; i++) circle(V(t.pos.x - 8 + i * 8, t.pos.y + 25), 2.5, col);
    }

    for (const l of LENSES) if (l.on) l.draw();

    for (const p of popups) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      text(p.text, p.pos.x, p.pos.y, p.color, 14, 'center');
      ctx.globalAlpha = 1;
    }

    // HUD
    const next = state.waveActive ? `enemies ${enemies.length + state.spawnLeft}` :
      state.wave < WAVES ? `next wave in ${Math.ceil(Math.max(0, state.breakT))}s (Space: now)` : '';
    text(`wave ${state.wave}/${WAVES}   lives ${state.lives}   money ${state.money}   score ${state.score}   ${next}`, 20, 26, '#9aa3b2', 14);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!started) overlay('TURRET DEFENSE', ['Enemies close in from every side. Keep them off the core for 10 waves.',
      'Click a pad to build a turret (60) · click a turret to upgrade it', 'Press any key to start']);
    else if (state.over === 'won') overlay('CORE DEFENDED', [`score ${state.score} · ${state.kills} kills · ${state.lives} lives left`, 'Press R or click to play again']);
    else if (state.over === 'lost') overlay('CORE DESTROYED', [`reached wave ${state.wave} · score ${state.score}`, 'Press R or click to try again']);
    else if (paused) overlay('PAUSED', ['Press P to resume']);
  }

  function overlay(title, lines) {
    ctx.fillStyle = 'rgba(10,12,16,.72)'; ctx.fillRect(0, 0, W, H);
    text(title, W / 2, H / 2 - 16, '#e6e9ef', 28, 'center');
    lines.forEach((l, i) => text(l, W / 2, H / 2 + 14 + i * 20, '#9aa3b2', 13, 'center'));
  }

  // ---------- Lenses ----------
  const focus = () => (sel && turrets.includes(sel) ? sel : turrets[0]) || null;
  function focusEnemy() {
    let best = null, bd = Infinity;
    for (const e of enemies) { const d = dist(e.pos, mouseW); if (d < bd) { bd = d; best = e; } }
    return best;
  }
  const dstr = a => `${f1(deg(a))}°`;

  const LENSES = [
    {
      name: 'Aim with atan2', chap: 'Chapter 9.3–9.4',
      formula: 'dx = enemy.x − turret.x\ndy = enemy.y − turret.y\nθ = atan2(dy, dx)   in (−180°, 180°]\nbullet v = 520·(cos θ, sin θ)',
      used: ['Turrets, guns and players aiming at a target', 'Rotating a sprite to face the mouse',
        'Turning a velocity into a facing angle', 'Angles for radar blips and off-screen arrows'],
      tryThis: 'Untick "Use atan2". Turrets now use atan(dy/dx): every enemy on a turret\'s LEFT (dx < 0) gets aimed at 180° the wrong way, and the bullets fly off into empty space.',
      controls: `<label><input type="checkbox" data-set="useAtan2"> Use atan2 (off: atan(dy/dx))</label>`,
      draw() {
        for (const t of turrets) {
          if (!t.target) continue;
          const p = t.pos, q = t.target.pos, main = t === focus();
          if (!main) { text(`θ ${f0(deg(t.want))}°`, p.x, p.y - 24, '#ffb547', 12, 'center'); continue; }
          dashed(true); ctx.strokeStyle = '#9aa3b2'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 70, p.y); ctx.stroke(); dashed(false);
          text('0°', p.x + 74, p.y + 4, '#9aa3b2', 11);
          ctx.strokeStyle = 'rgba(255,107,107,.75)'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
          text(`dx ${f0(t.dx)}`, (p.x + q.x) / 2, p.y + (t.dy > 0 ? -6 : 16), '#ff6b6b', 11, 'center');
          text(`dy ${f0(t.dy)}`, q.x + 6, (p.y + q.y) / 2, '#ff6b6b', 11);
          turnArc(p, 40, 0, t.want, '#ffb547', 2);
          text(`θ = ${f0(deg(t.want))}°`, p.x + 46, p.y + (t.want < 0 ? -12 : 22), '#ffb547', 13);
          if (Math.abs(wrap(t.want - t.trueAngle)) > 0.01) {
            arrow(p, fromAngle(t.want, 90), '#ff6b6b', 'atan aims here');
            dashed(true); arrow(p, fromAngle(t.trueAngle, 90), '#5fd18b', null, 1.5); dashed(false);
          }
        }
      },
      live() {
        const t = focus();
        if (!t) return 'build a turret first';
        if (!t.target) return `selected turret (pad ${t.pad + 1})\nno enemy in range`;
        const at = t.dx === 0 ? (t.dy > 0 ? 90 : -90) : deg(Math.atan(t.dy / t.dx));
        const tv = fromAngle(t.want, BULLET_SPEED);
        return `selected turret\n dx = ${f0(t.dx)}   dy = ${f0(t.dy)}   (${quadrant(t.dx, t.dy)})\n dy/dx          = ${t.dx === 0 ? '∞' : f2(t.dy / t.dx)}\n atan(dy/dx)    = ${f1(at)}°\n atan2(dy, dx)  = ${dstr(t.trueAngle)}  (${f2(t.trueAngle)} rad)\n aiming with    ${settings.useAtan2 ? 'atan2 ✓' : 'atan ✗'}\n bullet v = 520·(cos θ, sin θ)\n          = (${f0(tv.x)}, ${f0(tv.y)})`;
      },
    },
    {
      name: 'Wrap & shortest turn', chap: 'Chapter 9.5–9.6',
      formula: 'Δθ = target − facing\nwrap(Δθ) into (−180°, 180°]:\n  add or subtract 360° until it fits\nturn by wrap(Δθ), never the long way',
      used: ['Turrets and characters turning to face something', 'Cameras rotating to a new heading',
        'Steering wheels and ship rudders in AI', 'Blending two angles smoothly'],
      tryThis: 'Untick "Shortest turn" and watch a turret whose target crosses straight LEFT of it (the ±180° line): it whips all the way round the long way while the enemy walks past.',
      controls: `<label><input type="checkbox" data-set="shortestTurn"> Shortest turn (wrap Δθ)</label>`,
      draw() {
        for (const t of turrets) {
          if (!t.target) continue;
          const short = wrap(t.rawDiff), long = short > 0 ? short - TAU : short + TAU;
          const usedShort = Math.abs(t.diff - short) < 1e-6;
          turnArc(t.pos, 32, t.facing, short, usedShort ? '#5fd18b' : 'rgba(95,209,139,.35)', usedShort ? 2.5 : 1.5);
          if (t === focus() || !usedShort) turnArc(t.pos, 42, t.facing, long, usedShort ? 'rgba(255,107,107,.35)' : '#ff6b6b', usedShort ? 1.5 : 2.5);
          text(`Δθ ${f0(deg(t.diff))}°`, t.pos.x, t.pos.y - 48, usedShort ? '#5fd18b' : '#ff6b6b', 12, 'center');
        }
      },
      live() {
        const t = focus();
        if (!t) return 'build a turret first';
        if (!t.target) return `facing ${dstr(t.facing)}\nno enemy in range`;
        const w = wrap(t.rawDiff);
        return `selected turret\n facing     ${dstr(t.facing)}\n target     ${dstr(t.want)}\n raw Δθ     ${dstr(t.rawDiff)}\n wrapped Δθ ${dstr(w)}\n turning by ${dstr(t.diff)}  ${settings.shortestTurn ? '(shortest)' : Math.abs(t.diff - w) > 1e-6 ? '(LONG WAY!)' : '(happens to be short)'}`;
      },
    },
    {
      name: 'Turn speed', chap: 'Chapter 9.7',
      formula: 'max step = ω × Δt\nstep = clamp(Δθ, −ω·Δt, +ω·Δt)\nfire when |Δθ| ≤ 5°\nω = 90 / 180 / 360 °/s by level',
      used: ['Tanks and turrets that cannot snap instantly', 'Characters turning on the spot',
        'Giving the player time to dodge a slow boss', 'AI ships and cars with a turning limit'],
      tryThis: 'Watch a level-1 turret (90°/s) chase an enemy that circles past it, then upgrade it twice to 360°/s and compare. The green wedge is the ±5° firing window.',
      draw() {
        for (const t of turrets) {
          const L = LEVELS[t.level - 1];
          ctx.beginPath(); ctx.moveTo(t.pos.x, t.pos.y);
          ctx.arc(t.pos.x, t.pos.y, 60, t.facing - AIM_TOL, t.facing + AIM_TOL); ctx.closePath();
          ctx.fillStyle = t.target && t.aimErr <= AIM_TOL ? 'rgba(95,209,139,.45)' : 'rgba(95,209,139,.15)'; ctx.fill();
          if (t.target) {
            ctx.strokeStyle = 'rgba(230,233,239,.4)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(t.pos.x, t.pos.y); ctx.lineTo(t.target.pos.x, t.target.pos.y); ctx.stroke();
          }
          text(`ω ${L.turn}°/s`, t.pos.x, t.pos.y + 42, '#e6e9ef', 11, 'center');
        }
      },
      live() {
        const t = focus();
        if (!t) return 'build a turret first';
        const L = LEVELS[t.level - 1], step = L.turn * lastDt;
        const left = t.target ? Math.abs(deg(t.diff)) : 0;
        return `selected turret, level ${t.level}\n ω (max turn speed)  ${L.turn}°/s\n Δt this frame       ${f1(lastDt * 1000)} ms\n max step  ω × Δt    ${f2(step)}° per frame\n |Δθ| still to turn  ${f1(left)}°\n time to aim  |Δθ|/ω ${f2(left / L.turn)} s\n on target (≤ 5°)?   ${t.target && t.aimErr <= AIM_TOL ? 'yes — firing' : 'no'}`;
      },
    },
    {
      name: 'Clockwise (y-down)', chap: 'Chapter 9.8',
      formula: 'screen: y points DOWN\n+Δθ turns clockwise on screen\n−Δθ turns counter-clockwise\n(on a y-up graph it is the reverse)',
      used: ['Rotating sprites (positive = clockwise on screen)', 'Choosing "turn left" or "turn right" in AI',
        'Reading angles from a y-up math book correctly', 'Spin direction of wheels and rotors'],
      tryThis: 'Look at the compass on the core: 0° is right, +90° is DOWN, −90° is up. Then watch the turrets: CW when Δθ > 0, CCW when Δθ < 0.',
      draw() {
        const c = CORE, R = 64;
        ctx.strokeStyle = 'rgba(154,163,178,.6)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(c.x - R - 10, c.y); ctx.lineTo(c.x + R + 10, c.y); ctx.moveTo(c.x, c.y - R - 10); ctx.lineTo(c.x, c.y + R + 10); ctx.stroke();
        text('0°', c.x + R + 14, c.y + 4, '#e6e9ef', 12);
        text('+90°', c.x, c.y + R + 24, '#e6e9ef', 12, 'center');
        text('−90°', c.x, c.y - R - 14, '#e6e9ef', 12, 'center');
        text('±180°', c.x - R - 14, c.y + 4, '#e6e9ef', 12, 'right');
        turnArc(c, R - 8, rad(10), rad(70), '#ffb547', 2.5);
        text('+θ: clockwise', c.x + 40, c.y + 56, '#ffb547', 12);
        for (const t of turrets) {
          if (!t.target || Math.abs(t.step) < 1e-6) continue;
          turnArc(t.pos, 30, t.facing - t.step * 6, t.step * 6, t.step > 0 ? '#ffb547' : '#6cb8ff', 2.5);
          text(t.step > 0 ? 'CW (+)' : 'CCW (−)', t.pos.x, t.pos.y - 36, t.step > 0 ? '#ffb547' : '#6cb8ff', 12, 'center');
        }
      },
      live() {
        const t = focus();
        if (!t) return 'build a turret first';
        if (!t.target || Math.abs(t.step) < 1e-6) return `selected turret is not turning\n facing ${dstr(t.facing)}`;
        return `selected turret\n Δθ = ${dstr(t.diff)}\n sign ${t.step > 0 ? '+  → clockwise on screen' : '−  → counter-clockwise on screen'}\n (a y-up graph would call it\n  ${t.step > 0 ? 'counter-clockwise' : 'clockwise'})`;
      },
    },
    {
      name: '8-way sprites', chap: 'Chapter 9.9',
      formula: 'θ = atan2(vy, vx)\nindex = round(θ / 45°) mod 8\n0 E · 1 SE · 2 S · 3 SW\n4 W · 5 NW · 6 N · 7 NE',
      used: ['Picking a walk animation from 8 (or 4, 16) drawn directions', 'Isometric and top-down RPG characters',
        'Compass labels and minimap arrows', 'Snapping aim to 8 directions on a D-pad'],
      tryThis: 'Watch an enemy spiral in: its true heading (thin line) turns smoothly, but its sprite (the arrowhead) jumps in 45° steps whenever θ / 45° crosses a half.',
      draw() {
        const fe = focusEnemy();
        for (const e of enemies) {
          const k = dir8(e.heading);
          ctx.strokeStyle = '#e6e9ef'; ctx.lineWidth = 1.2;
          const h = add(e.pos, fromAngle(e.heading, e.r + 22));
          ctx.beginPath(); ctx.moveTo(e.pos.x, e.pos.y); ctx.lineTo(h.x, h.y); ctx.stroke();
          text(`${k} ${DIR_NAMES[k]}`, e.pos.x, e.pos.y + e.r + 16, '#ffb547', 11, 'center');
          if (e === fe) {
            const a = k * Math.PI / 4;
            ctx.beginPath(); ctx.moveTo(e.pos.x, e.pos.y);
            ctx.arc(e.pos.x, e.pos.y, 46, a - Math.PI / 8, a + Math.PI / 8); ctx.closePath();
            ctx.fillStyle = 'rgba(255,181,71,.22)'; ctx.fill();
          }
        }
      },
      live() {
        const e = focusEnemy();
        if (!e) return 'no enemies on the field';
        const q = deg(e.heading) / 45, k = dir8(e.heading);
        return `enemy nearest the mouse\n v = (${f0(e.vel.x)}, ${f0(e.vel.y)})\n θ = atan2(vy, vx) = ${dstr(e.heading)}\n θ / 45° = ${f2(q)}\n round   = ${Math.round(q)}\n mod 8   = ${k}  → sprite ${DIR_NAMES[k]}\n covers ${f1(k * 45 - 22.5)}° … ${f1(k * 45 + 22.5)}°`;
      },
    },
  ];
  for (const l of LENSES) l.on = false;

  // ---------- Panel ----------
  const lensesEl = document.getElementById('lenses');
  const cardEl = document.getElementById('card');
  let selected = null, liveEl = null;
  LENSES.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'lens';
    b.innerHTML = `<kbd>${i + 1}</kbd>${l.name}`;
    b.addEventListener('click', () => toggleLens(l));
    l.btn = b; lensesEl.appendChild(b);
  });
  function toggleLens(l) {
    if (!l) return;
    if (l.on && selected === l) l.on = false; else l.on = true;
    selected = l.on ? l : LENSES.find(x => x.on) || null;
    for (const x of LENSES) { x.btn.classList.toggle('on', x.on); x.btn.classList.toggle('sel', x === selected); }
    renderCard();
  }
  function renderCard() {
    if (!selected) {
      cardEl.innerHTML = `<h2>No lens on</h2><p style="margin:0;color:var(--muted)">Play a wave or two first. Then press 1–5 to see the angles every turret is calculating. Lenses follow the turret you clicked last.</p>`;
      liveEl = null; return;
    }
    const l = selected;
    cardEl.innerHTML = `
      <h2>${l.name}</h2><span class="chap">${l.chap}</span>
      <div class="formula">${l.formula}</div>
      <h3>Where it's used in games</h3>
      <ul>${l.used.map(u => `<li>${u}</li>`).join('')}</ul>
      <h3>Try this</h3><div class="try">${l.tryThis}</div>
      ${l.controls ? `<div class="controls">${l.controls}</div>` : ''}
      <h3>Live numbers</h3><div class="live"></div>`;
    liveEl = cardEl.querySelector('.live');
    cardEl.querySelectorAll('[data-set]').forEach(el => {
      const key = el.dataset.set;
      const showEl = cardEl.querySelector(`[data-show="${key}"]`);
      if (el.type === 'checkbox') el.checked = settings[key]; else el.value = settings[key];
      if (showEl) showEl.textContent = settings[key];
      el.addEventListener('input', () => {
        settings[key] = el.type === 'checkbox' ? el.checked : parseFloat(el.value);
        if (showEl) showEl.textContent = settings[key];
      });
    });
    updateLive();
  }
  function updateLive() { if (liveEl && selected) liveEl.textContent = selected.live(); }
  renderCard();

  // ---------- Loop ----------
  let last = performance.now(), lastDt = 1 / 60, liveTimer = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now; lastDt = dt;
    if (started && !paused) update(dt);
    render();
    liveTimer -= dt;
    if (liveTimer <= 0) { updateLive(); liveTimer = 0.1; }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
