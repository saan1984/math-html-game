<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Arena</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b23;
    --panel-2: #1f2430;
    --line: #2a3140;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #6cb8ff;
    --good: #5fd18b;
    --warn: #ffb547;
    --bad: #ff6b6b;
    --violet: #b48cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #app { display: flex; height: 100vh; }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  #panel { width: 340px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .lenses { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .lens { display: flex; align-items: center; gap: 6px; text-align: left; padding: 7px 8px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font: inherit; font-size: 12.5px; cursor: pointer; }
  .lens kbd { font: 11px Menlo, Consolas, monospace; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px; }
  .lens.on { border-color: var(--accent); background: #1d2b3d; }
  .lens.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .chap { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid #2d4766;
    border-radius: 999px; padding: 1px 8px; margin-bottom: 8px; }
  .formula { font: 13px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin: 6px 0 10px; white-space: pre-wrap; color: #cfe6ff; }
  .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 4px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin: 2px 0; }
  .try { color: var(--warn); }
  .live { font: 12.5px Menlo, Consolas, monospace; background: #11151c; border-radius: 6px;
    padding: 8px; margin-top: 6px; white-space: pre; overflow-x: auto; min-height: 3em; }
  .controls { margin-top: 8px; display: grid; gap: 6px; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls select, .controls input[type=range] { flex: 1; }
  select { background: #11151c; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
  .help { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  .help b { color: var(--text); }
  @media (max-width: 820px) {
    #app { flex-direction: column; height: auto; }
    #stage { flex: none; height: 65vh; }
    #panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
  <aside id="panel">
    <h1>Math Arena</h1>
    <p class="sub">Play first. Then switch on a lens to see the math that makes the game work.</p>
    <div class="lenses" id="lenses"></div>
    <div class="card" id="card"></div>
    <div class="help">
      <b>Move</b> WASD / arrows · <b>Aim</b> mouse · <b>Shoot</b> hold click ·
      <b>Nova</b> Space or right-click · <b>Lenses</b> keys 0–9 · <b>Pause</b> P
    </div>
  </aside>
</div>

<script>
(() => {
  // ---------- Vector math (Chapter 11) ----------
  const V = (x = 0, y = 0) => ({ x, y });
  const add = (a, b) => V(a.x + b.x, a.y + b.y);
  const sub = (a, b) => V(a.x - b.x, a.y - b.y);
  const mul = (a, s) => V(a.x * s, a.y * s);
  const len = a => Math.hypot(a.x, a.y);
  const norm = a => { const l = len(a); return l > 0 ? V(a.x / l, a.y / l) : V(); };
  const dot = (a, b) => a.x * b.x + a.y * b.y;
  const dist = (a, b) => len(sub(a, b));
  const fromAngle = (t, r = 1) => V(Math.cos(t) * r, Math.sin(t) * r);
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const remap = (x, a, b, c, d) => lerp(c, d, clamp((x - a) / (b - a), 0, 1));
  const deg = r => r * 180 / Math.PI;
  const f1 = n => n.toFixed(1), f2 = n => n.toFixed(2), f0 = n => Math.round(n).toString();
  const rand = (a, b) => a + Math.random() * (b - a);

  const EASINGS = {
    linear: t => t,
    easeOutCubic: t => 1 - Math.pow(1 - t, 3),
    easeInOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    easeInBack: t => 2.70158 * t * t * t - 1.70158 * t * t,
    easeOutElastic: t => t === 0 || t === 1 ? t :
      Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1,
  };

  // ---------- Settings changed from the lens cards ----------
  const settings = {
    normalize: true,
    useDt: true,
    fps: 0,           // 0 = native refresh rate
    camK: 6,          // smoothing rate; 0 = snap
    easing: 'easeOutCubic',
  };

  // ---------- Canvas & coordinate spaces (Chapters 3, 16) ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 800, H = 600, DPR = 1;
  function resize() {
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  const ARENA = 1800;
  const cam = V(ARENA / 2, ARENA / 2);
  const shake = { trauma: 0, off: V() };
  const screenToWorld = s => V(s.x - W / 2 + cam.x, s.y - H / 2 + cam.y);
  const worldToScreen = w => V(w.x - cam.x + W / 2, w.y - cam.y + H / 2);

  // ---------- Input ----------
  const keys = {};
  const mouse = { s: V(W / 2, H / 2), down: false };
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (/^[0-9]$/.test(k)) { toggleLens(LENSES.find(l => l.key === k)); return; }
    if (k === ' ') { e.preventDefault(); nova(); }
    if (k === 'p') paused = !paused;
    if (k === 'r' && state.over) reset();
    keys[k] = true;
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
  canvas.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.s = V(e.clientX - r.left, e.clientY - r.top);
  });
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    if (!started) { started = true; return; }
    if (state.over) { reset(); return; }
    if (e.button === 2) nova(); else mouse.down = true;
  });
  canvas.addEventListener('pointerup', () => { mouse.down = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Game state ----------
  let state, player, bullets, enemyBullets, chasers, sentries, pickups, flyers, popups, spawnMarks;
  let started = false, paused = false, gameTime = 0;
  const LOOT = [
    { item: 'nothing', w: 50 },
    { item: 'coin', w: 35 },
    { item: '3 coins', w: 10 },
    { item: 'heart', w: 5 },
  ];
  const lootTally = { nothing: 0, coin: 0, '3 coins': 0, heart: 0, rolls: 0 };
  const CRIT_CHANCE = 0.1;
  let crits = 0, hits = 0;
  const xpNeeded = lvl => Math.round(40 * Math.pow(lvl, 1.5)); // Chapter 7: polynomial growth

  function reset() {
    state = { over: false, spawnTimer: 1, kills: 0 };
    player = { pos: V(ARENA / 2, ARENA / 2), vel: V(), input: V(), r: 14, speed: 230,
      hp: 100, maxHp: 100, shownHp: 100, aim: 0, cd: 0, novaCd: 0, coins: 0, shownCoins: 0,
      xp: 0, level: 1, hurtFlash: 0 };
    bullets = []; enemyBullets = []; chasers = []; pickups = []; flyers = []; popups = []; spawnMarks = [];
    sentries = [V(400, 400), V(1400, 420), V(420, 1400), V(1400, 1380)].map((p, i) => ({
      pos: p, home: p, r: 18, hp: 6, base: i * Math.PI / 2 + Math.PI / 4, phase: i * 1.7,
      facing: 0, fov: Math.PI / 3, range: 330, cd: 0, seen: false, dead: 0, dotVal: 0 }));
    cam.x = player.pos.x; cam.y = player.pos.y;
  }
  reset();

  function popup(pos, text, color = '#fff') { popups.push({ pos: V(pos.x, pos.y), text, color, life: 1 }); }

  function fire(angle, speed = 620) {
    bullets.push({ pos: add(player.pos, fromAngle(angle, player.r + 4)), vel: fromAngle(angle, speed), life: 1.1 });
  }

  // Chapter 8: points on a circle — p = c + r(cos θ, sin θ)
  function nova() {
    if (!started || state.over || player.novaCd > 0) return;
    const n = 16;
    for (let i = 0; i < n; i++) fire(i * 2 * Math.PI / n, 520);
    player.novaCd = 3;
    shake.trauma = Math.min(1, shake.trauma + 0.35);
  }

  function spawnChaser() {
    const theta = Math.random() * Math.PI * 2;
    const r = 520;
    const p = add(player.pos, fromAngle(theta, r));
    p.x = clamp(p.x, 20, ARENA - 20); p.y = clamp(p.y, 20, ARENA - 20);
    chasers.push({ pos: p, vel: V(), r: 13, hp: 3, speed: rand(95, 140) + player.level * 4 });
    spawnMarks.push({ theta, p: V(p.x, p.y), c: V(player.pos.x, player.pos.y), r, age: 0 });
    if (spawnMarks.length > 8) spawnMarks.shift();
  }

  // Chapter 27: weighted random choice
  function rollLoot(pos) {
    const total = LOOT.reduce((s, l) => s + l.w, 0);
    let r = Math.random() * total;
    const roll = r / total;
    let pick = LOOT[LOOT.length - 1];
    for (const l of LOOT) { if (r < l.w) { pick = l; break; } r -= l.w; }
    lootTally[pick.item]++; lootTally.rolls++;
    if (lens('chance').on) popup(V(pos.x, pos.y - 18), `roll ${f2(roll)} → ${pick.item}`, '#b48cff');
    if (pick.item === 'coin') pickups.push({ pos: V(pos.x, pos.y), kind: 'coin', value: 1, t: rand(0, 6) });
    if (pick.item === '3 coins') for (let i = 0; i < 3; i++)
      pickups.push({ pos: add(pos, fromAngle(i * 2.1, 16)), kind: 'coin', value: 1, t: rand(0, 6) });
    if (pick.item === 'heart') pickups.push({ pos: V(pos.x, pos.y), kind: 'heart', value: 20, t: rand(0, 6) });
  }

  function damageEnemy(e, b) {
    const crit = Math.random() < CRIT_CHANCE;
    hits++; if (crit) crits++;
    const dmg = crit ? 2 : 1;
    e.hp -= dmg;
    if (crit) popup(V(e.pos.x, e.pos.y - 14), 'CRIT', '#ffb547');
    e.pos = add(e.pos, mul(norm(b.vel), 6)); // knockback along bullet direction
  }

  function gainXp(n) {
    player.xp += n;
    while (player.xp >= xpNeeded(player.level)) {
      player.xp -= xpNeeded(player.level);
      player.level++;
      popup(V(player.pos.x, player.pos.y - 30), `LEVEL ${player.level}`, '#5fd18b');
    }
  }

  function hurt(amount) {
    player.hp -= amount;
    player.hurtFlash = 0.15;
    shake.trauma = Math.min(1, shake.trauma + amount / 40);
    if (player.hp <= 0) { player.hp = 0; state.over = true; mouse.down = false; }
  }

  // ---------- Update ----------
  function update(dt) {
    gameTime += dt;
    // Easing flyers and popups keep animating even after game over
    for (const f of flyers) f.t += dt / 0.7;
    for (const f of flyers) if (f.t >= 1) player.coins += f.value;
    flyers = flyers.filter(f => f.t < 1);
    for (const p of popups) { p.life -= dt; p.pos.y -= 30 * dt; }
    popups = popups.filter(p => p.life > 0);
    if (state.over) return;

    // Input vector → velocity (Chapter 11)
    const ix = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    const iy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    let input = V(ix, iy);
    if (settings.normalize) input = norm(input);
    player.input = input;
    player.vel = mul(input, player.speed);
    player.pos = add(player.pos, mul(player.vel, dt)); // p ← p + v·Δt  (Chapter 4)
    player.pos.x = clamp(player.pos.x, player.r, ARENA - player.r);
    player.pos.y = clamp(player.pos.y, player.r, ARENA - player.r);

    // Aim with atan2 (Chapter 9)
    const mw = screenToWorld(mouse.s);
    player.aim = Math.atan2(mw.y - player.pos.y, mw.x - player.pos.x);

    player.cd -= dt; player.novaCd = Math.max(0, player.novaCd - dt); player.hurtFlash -= dt;
    if (mouse.down && player.cd <= 0) { fire(player.aim + rand(-0.03, 0.03)); player.cd = 0.14; }

    // Spawning on a ring (Chapter 8)
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnChaser();
      state.spawnTimer = Math.max(0.45, 1.8 - player.level * 0.12);
    }
    for (const m of spawnMarks) m.age += dt;

    for (const b of bullets) { b.pos = add(b.pos, mul(b.vel, dt)); b.life -= dt; }
    for (const b of enemyBullets) { b.pos = add(b.pos, mul(b.vel, dt)); b.life -= dt; }

    // Chasers move toward the player: direction = normalize(target − position)
    for (const c of chasers) {
      c.vel = mul(norm(sub(player.pos, c.pos)), c.speed);
      c.pos = add(c.pos, mul(c.vel, dt));
      if (dist(c.pos, player.pos) < c.r + player.r) hurt(30 * dt);
    }

    // Sentries sweep with a sine wave (Chapter 10) and see with a dot product (Chapter 12)
    for (const s of sentries) {
      if (s.dead > 0) { s.dead -= dt; if (s.dead <= 0) { s.hp = 6; } continue; }
      s.facing = s.base + Math.sin(gameTime * 0.7 + s.phase) * 1.3;
      const toPlayer = sub(player.pos, s.pos);
      const d = len(toPlayer);
      s.dotVal = dot(fromAngle(s.facing), norm(toPlayer));
      s.seen = d <= s.range && s.dotVal >= Math.cos(s.fov / 2);
      s.cd -= dt;
      if (s.seen && s.cd <= 0) {
        const a = Math.atan2(toPlayer.y, toPlayer.x);
        enemyBullets.push({ pos: add(s.pos, fromAngle(a, s.r + 4)), vel: fromAngle(a, 330), life: 1.6 });
        s.cd = 0.85;
      }
    }

    // Collisions: circles overlap when distance < r₁ + r₂ (Chapters 21–22)
    for (const b of bullets) {
      if (b.life <= 0) continue;
      for (const c of chasers) if (c.hp > 0 && dist(b.pos, c.pos) < c.r + 4) { damageEnemy(c, b); b.life = 0; break; }
      if (b.life <= 0) continue;
      for (const s of sentries) if (s.dead <= 0 && dist(b.pos, s.pos) < s.r + 4) { damageEnemy(s, b); b.life = 0; break; }
    }
    for (const c of chasers) if (c.hp <= 0) { state.kills++; gainXp(10); rollLoot(c.pos); }
    chasers = chasers.filter(c => c.hp > 0);
    for (const s of sentries) if (s.dead <= 0 && s.hp <= 0) {
      s.dead = 15; state.kills++; gainXp(25); rollLoot(s.pos); rollLoot(add(s.pos, V(20, 0)));
    }
    for (const b of enemyBullets) if (b.life > 0 && dist(b.pos, player.pos) < player.r + 4) { hurt(9); b.life = 0; }
    const inArena = b => b.pos.x > -50 && b.pos.y > -50 && b.pos.x < ARENA + 50 && b.pos.y < ARENA + 50;
    bullets = bullets.filter(b => b.life > 0 && inArena(b));
    enemyBullets = enemyBullets.filter(b => b.life > 0 && inArena(b));

    // Pickups: collect inside a radius, then ease into the HUD counter (Chapter 6)
    for (const p of pickups) {
      p.t += dt;
      if (dist(p.pos, player.pos) < 34) {
        p.taken = true;
        if (p.kind === 'heart') {
          player.hp = Math.min(player.maxHp, player.hp + p.value);
          popup(V(p.pos.x, p.pos.y - 12), `+${p.value} HP`, '#5fd18b');
        } else {
          flyers.push({ from: worldToScreen(p.pos), to: V(W - 70, 30), t: 0, value: p.value });
        }
      }
    }
    pickups = pickups.filter(p => !p.taken);

    // Exponential smoothing (Chapter 7): x ← x + (target − x)(1 − e^(−kΔt))
    player.shownHp += (player.hp - player.shownHp) * (1 - Math.exp(-5 * dt));
    if (settings.camK <= 0) { cam.x = player.pos.x; cam.y = player.pos.y; }
    else {
      const a = 1 - Math.exp(-settings.camK * dt);
      cam.x += (player.pos.x - cam.x) * a;
      cam.y += (player.pos.y - cam.y) * a;
    }
    shake.trauma = Math.max(0, shake.trauma - dt * 1.5);
    const s = shake.trauma * shake.trauma * 12;
    shake.off = V(rand(-s, s), rand(-s, s));
  }

  // ---------- Drawing helpers ----------
  function arrow(from, vec, color, label, scale = 1) {
    const to = add(from, mul(vec, scale));
    const l = len(sub(to, from));
    if (l < 2) return;
    const a = Math.atan2(to.y - from.y, to.x - from.x);
    ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(to.x, to.y);
    ctx.lineTo(to.x - Math.cos(a - .4) * 9, to.y - Math.sin(a - .4) * 9);
    ctx.lineTo(to.x - Math.cos(a + .4) * 9, to.y - Math.sin(a + .4) * 9);
    ctx.closePath(); ctx.fill();
    if (label) text(label, to.x + 6, to.y - 6, color);
  }
  function text(t, x, y, color = '#e6e9ef', size = 12, align = 'left') {
    ctx.font = `${size}px Menlo, Consolas, monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,12,16,.85)'; ctx.strokeText(t, x, y);
    ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  function circle(p, r, fill, stroke, lw = 2) {
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function dashed(on) { ctx.setLineDash(on ? [6, 6] : []); }

  // ---------- Render ----------
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0f1218'; ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W / 2 - cam.x + shake.off.x, H / 2 - cam.y + shake.off.y);

    // Grid
    const g = 60;
    const x0 = Math.max(0, Math.floor((cam.x - W / 2) / g) * g), x1 = Math.min(ARENA, cam.x + W / 2);
    const y0 = Math.max(0, Math.floor((cam.y - H / 2) / g) * g), y1 = Math.min(ARENA, cam.y + H / 2);
    ctx.strokeStyle = '#1a1f29'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = x0; x <= x1; x += g) { ctx.moveTo(x, Math.max(0, y0)); ctx.lineTo(x, y1); }
    for (let y = y0; y <= y1; y += g) { ctx.moveTo(Math.max(0, x0), y); ctx.lineTo(x1, y); }
    ctx.stroke();
    ctx.strokeStyle = '#3a4357'; ctx.lineWidth = 3; ctx.strokeRect(0, 0, ARENA, ARENA);

    // Sentry vision cones (always visible: they are part of the gameplay)
    for (const s of sentries) {
      if (s.dead > 0) continue;
      ctx.beginPath(); ctx.moveTo(s.pos.x, s.pos.y);
      ctx.arc(s.pos.x, s.pos.y, s.range, s.facing - s.fov / 2, s.facing + s.fov / 2); ctx.closePath();
      ctx.fillStyle = s.seen ? 'rgba(255,107,107,.18)' : 'rgba(255,181,71,.08)'; ctx.fill();
    }

    // Pickups bob on a sine wave (Chapter 10)
    for (const p of pickups) {
      const bob = Math.sin(p.t * 4) * 4;
      const q = V(p.pos.x, p.pos.y + bob);
      if (p.kind === 'coin') circle(q, 6, '#ffd166', '#a07a1f');
      else { circle(q, 7, '#5fd18b', '#1f7a45'); text('+', q.x, q.y + 4, '#0f1218', 11, 'center'); }
    }

    // Sentries
    for (const s of sentries) {
      if (s.dead > 0) { circle(s.pos, s.r, null, '#3a4357'); continue; }
      circle(s.pos, s.r, '#3b2a20', s.seen ? '#ff6b6b' : '#ffb547', 3);
      const tip = add(s.pos, fromAngle(s.facing, s.r + 8));
      ctx.strokeStyle = '#ffb547'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(s.pos.x, s.pos.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
    }
    // Chasers
    for (const c of chasers) circle(c.pos, c.r, '#5a2330', '#ff6b6b', 2);
    // Bullets
    ctx.fillStyle = '#cfe6ff';
    for (const b of bullets) { ctx.beginPath(); ctx.arc(b.pos.x, b.pos.y, 3.5, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#ff9b6b';
    for (const b of enemyBullets) { ctx.beginPath(); ctx.arc(b.pos.x, b.pos.y, 4, 0, Math.PI * 2); ctx.fill(); }
    // Player
    const barrel = add(player.pos, fromAngle(player.aim, player.r + 10));
    ctx.strokeStyle = '#cfe6ff'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(player.pos.x, player.pos.y); ctx.lineTo(barrel.x, barrel.y); ctx.stroke();
    circle(player.pos, player.r, player.hurtFlash > 0 ? '#ff6b6b' : '#2a5d8f', '#6cb8ff', 3);

    // World-space lens overlays
    for (const l of LENSES) if (l.on && l.world) l.world();

    for (const p of popups) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      text(p.text, p.pos.x, p.pos.y, p.color, 13, 'center');
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    drawHud();
    for (const l of LENSES) if (l.on && l.screen) l.screen();

    if (!started) overlay('MATH ARENA', 'Click to start · WASD to move · hold click to shoot');
    else if (state.over) overlay('GAME OVER', `Level ${player.level} · ${state.kills} kills · click or R to restart`);
    else if (paused) overlay('PAUSED', 'Press P to resume');
  }

  // Chapter 5: remap health to a color, from green (full) to red (empty)
  function hpColor(frac) {
    const hue = remap(frac, 0, 1, 0, 130);
    return `hsl(${hue} 70% 55%)`;
  }

  function drawHud() {
    const x = 16, y = 16, w = 220, h = 14;
    ctx.fillStyle = '#1f2430'; ctx.fillRect(x, y, w, h);
    const shown = player.shownHp / player.maxHp, real = player.hp / player.maxHp;
    ctx.fillStyle = '#ffffff55'; ctx.fillRect(x, y, w * shown, h);
    ctx.fillStyle = hpColor(real); ctx.fillRect(x, y, w * real, h);
    text(`HP ${f0(player.hp)}`, x + 6, y + 11, '#0f1218', 11);
    const need = xpNeeded(player.level);
    ctx.fillStyle = '#1f2430'; ctx.fillRect(x, y + 20, w, 6);
    ctx.fillStyle = '#b48cff'; ctx.fillRect(x, y + 20, w * player.xp / need, 6);
    text(`Level ${player.level}  ·  XP ${player.xp}/${need}`, x, y + 42, '#9aa3b2', 11);
    text(player.novaCd > 0 ? `Nova ${f1(player.novaCd)}s` : 'Nova ready (Space)', x, y + 58,
      player.novaCd > 0 ? '#9aa3b2' : '#6cb8ff', 11);

    circle(V(W - 90, 30), 8, '#ffd166', '#a07a1f');
    text(`${player.coins}`, W - 76, 35, '#ffd166', 16);
    for (const f of flyers) {
      const e = EASINGS[settings.easing](clamp(f.t, 0, 1));
      const p = V(lerp(f.from.x, f.to.x, e), lerp(f.from.y, f.to.y, e));
      circle(p, 6, '#ffd166', '#a07a1f');
    }
  }

  function overlay(title, sub) {
    ctx.fillStyle = 'rgba(10,12,16,.7)'; ctx.fillRect(0, 0, W, H);
    text(title, W / 2, H / 2 - 8, '#e6e9ef', 30, 'center');
    const lines = W < 560 ? sub.split(' · ') : [sub];
    lines.forEach((l, i) => text(l, W / 2, H / 2 + 22 + i * 18, '#9aa3b2', 13, 'center'));
  }

  // ---------- Math X-ray lenses ----------
  const LENSES = [
    {
      id: 'spaces', key: '0', name: 'Coordinate spaces', chap: 'Chapters 3 & 16',
      formula: 'world = screen − (W/2, H/2) + camera\nscreen = world − camera + (W/2, H/2)',
      used: ['Clicking on units in a scrolling or zoomed world', 'Health bars and names that follow characters',
        'Minimaps and radar', 'Turrets attached to moving vehicles'],
      tryThis: 'Move around: the mouse stays put on screen, but its world position changes.',
      world() {
        ctx.strokeStyle = '#6cb8ff'; ctx.lineWidth = 2;
        arrow(V(0, 0), V(120, 0), '#ff6b6b', '+x'); arrow(V(0, 0), V(0, 120), '#5fd18b', '+y (down)');
        text('world origin (0, 0)', 8, -8, '#e6e9ef');
        const mw = screenToWorld(mouse.s);
        circle(mw, 5, null, '#6cb8ff');
        text(`world (${f0(mw.x)}, ${f0(mw.y)})`, mw.x + 10, mw.y + 18, '#6cb8ff');
      },
      screen() {
        text(`screen (${f0(mouse.s.x)}, ${f0(mouse.s.y)})`, mouse.s.x + 10, mouse.s.y - 10, '#ffb547');
        text('screen origin (0, 0)', 6, H - 8, '#ffb547');
      },
      live() {
        const mw = screenToWorld(mouse.s);
        return `mouse on screen  (${f0(mouse.s.x)}, ${f0(mouse.s.y)})\ncamera center    (${f0(cam.x)}, ${f0(cam.y)})\nmouse in world   (${f0(mw.x)}, ${f0(mw.y)})`;
      },
    },
    {
      id: 'time', key: '1', name: 'Delta time', chap: 'Chapter 4',
      formula: 'position ← position + velocity × Δt\nΔt = seconds since last frame',
      used: ['Same speed on 60 Hz, 120 Hz and 144 Hz screens', 'Cooldowns, timers and spawn rates',
        'Animation playback speed', 'Slow motion (scale Δt)'],
      tryThis: 'Set the frame rate to 15 and switch off "Use Δt": the whole game slows to a quarter speed.',
      controls: `<label><input type="checkbox" data-set="useDt"> Use Δt (frame-rate independent)</label>
        <label>Frame rate <select data-set="fps"><option value="0">native</option><option value="60">60 fps</option><option value="30">30 fps</option><option value="15">15 fps</option></select></label>`,
      screen() { text(`${f0(fpsShown)} fps · Δt ${f1(lastDt * 1000)} ms`, W / 2, H - 14, '#ffb547', 12, 'center'); },
      live() {
        const step = settings.useDt ? lastDt : 1 / 60;
        return `frame rate     ${f0(fpsShown)} fps\nreal Δt        ${f1(lastDt * 1000)} ms\nstep used      ${f1(step * 1000)} ms ${settings.useDt ? '' : '(fixed 1/60!)'}\nplayer moves   ${f1(player.speed * step)} px per frame\n             = ${f0(player.speed * step * fpsShown)} px per second`;
      },
    },
    {
      id: 'smooth', key: '2', name: 'Remap & smoothing', chap: 'Chapters 5 & 7',
      formula: 'color hue = remap(hp, 0…100 → 0°…130°)\ncamera ← camera + (target − camera)(1 − e^(−k·Δt))',
      used: ['Health bars that change color and drain smoothly', 'Smooth camera follow', 'Fading sound with distance',
        'UI values that glide instead of jumping'],
      tryThis: 'Drag k to 0 for a rigid camera, or to 1 for a floaty one. Take a hit and watch the white bar drain.',
      controls: `<label>Camera k <input type="range" min="0" max="20" step="0.5" data-set="camK"> <span data-show="camK"></span></label>`,
      world() {
        circle(player.pos, 4, '#5fd18b');
        dashed(true); ctx.strokeStyle = '#5fd18b'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cam.x, cam.y); ctx.lineTo(player.pos.x, player.pos.y); ctx.stroke(); dashed(false);
        ctx.strokeStyle = '#ffb547'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cam.x - 10, cam.y); ctx.lineTo(cam.x + 10, cam.y);
        ctx.moveTo(cam.x, cam.y - 10); ctx.lineTo(cam.x, cam.y + 10); ctx.stroke();
        text('camera', cam.x + 12, cam.y - 6, '#ffb547');
      },
      live() {
        const gap = dist(cam, player.pos);
        const a = settings.camK > 0 ? 1 - Math.exp(-settings.camK * lastDt) : 1;
        return `k                ${settings.camK}\nfraction / frame ${f2(a)}\ncamera lag       ${f1(gap)} px\nhp ${f0(player.hp)} → hue ${f0(remap(player.hp / player.maxHp, 0, 1, 0, 130))}°\nshown hp         ${f1(player.shownHp)}`;
      },
    },
    {
      id: 'circle', key: '3', name: 'Unit circle', chap: 'Chapter 8',
      formula: 'point = center + r·(cos θ, sin θ)\nnova: θᵢ = i × 360° / 16',
      used: ['Spawning enemies in a ring around the player', 'Radial and spiral bullet patterns',
        'Orbiting shields and moons', 'Radial menus'],
      tryThis: 'Press Space: 16 bullets leave at angles 22.5° apart. Watch new enemies appear on the ring.',
      world() {
        dashed(true); circle(player.pos, 520, null, 'rgba(180,140,255,.5)', 1.5); dashed(false);
        for (const m of spawnMarks) {
          ctx.globalAlpha = clamp(1 - m.age / 6, 0.15, 1);
          ctx.strokeStyle = '#b48cff'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(m.c.x, m.c.y); ctx.lineTo(m.p.x, m.p.y); ctx.stroke();
          circle(m.p, 5, '#b48cff');
          text(`θ=${f0((deg(m.theta) + 360) % 360)}°`, m.p.x + 8, m.p.y - 8, '#b48cff');
          ctx.globalAlpha = 1;
        }
      },
      live() {
        const m = spawnMarks[spawnMarks.length - 1];
        if (!m) return 'waiting for the first spawn…';
        const c = Math.cos(m.theta), s = Math.sin(m.theta);
        return `last spawn θ    ${f0((deg(m.theta) + 360) % 360)}°\ncos θ, sin θ    (${f2(c)}, ${f2(s)})\n× r = 520       (${f0(c * 520)}, ${f0(s * 520)})\n+ player        (${f0(m.p.x)}, ${f0(m.p.y)})`;
      },
    },
    {
      id: 'angles', key: '4', name: 'Angles & atan2', chap: 'Chapter 9',
      formula: 'θ = atan2(dy, dx)\ndx = mouse.x − player.x, dy = mouse.y − player.y',
      used: ['Turrets and players aiming at a target', 'Rotating sprites to face movement',
        'Picking one of 8 direction animations', 'Cones and arcs for melee attacks'],
      tryThis: 'Aim straight down: θ = +90°. On a y-down screen, positive angles turn clockwise.',
      world() {
        const p = player.pos, mw = screenToWorld(mouse.s);
        ctx.strokeStyle = '#9aa3b2'; ctx.lineWidth = 1.5; dashed(true);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 90, p.y); ctx.stroke();
        ctx.strokeStyle = '#ffb547'; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mw.x, mw.y); ctx.stroke(); dashed(false);
        ctx.strokeStyle = '#ffb547'; ctx.lineWidth = 2; ctx.beginPath();
        ctx.arc(p.x, p.y, 40, 0, player.aim, player.aim < 0); ctx.stroke();
        text(`θ = ${f0(deg(player.aim))}°`, p.x + 46, p.y + (player.aim < 0 ? -10 : 20), '#ffb547', 13);
        ctx.strokeStyle = 'rgba(255,107,107,.7)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mw.x, p.y); ctx.lineTo(mw.x, mw.y); ctx.stroke();
        text(`dx ${f0(mw.x - p.x)}`, (p.x + mw.x) / 2, p.y - 6, '#ff6b6b', 11, 'center');
        text(`dy ${f0(mw.y - p.y)}`, mw.x + 6, (p.y + mw.y) / 2, '#ff6b6b', 11);
      },
      live() {
        const mw = screenToWorld(mouse.s);
        return `dx       ${f0(mw.x - player.pos.x)}\ndy       ${f0(mw.y - player.pos.y)}\nθ        ${f1(deg(player.aim))}°  (${f2(player.aim)} rad)\nbullet v = 620·(cos θ, sin θ)\n         = (${f0(620 * Math.cos(player.aim))}, ${f0(620 * Math.sin(player.aim))})`;
      },
    },
    {
      id: 'easing', key: '5', name: 'Easing & waves', chap: 'Chapters 6 & 10',
      formula: 'pickup y = base + 4·sin(4t)\ncoin = lerp(start, counter, ease(t))\neaseOutCubic(t) = 1 − (1 − t)³',
      used: ['Coins and items flying into the HUD', 'Bobbing pickups and pulsing buttons',
        'Menus sliding in, damage numbers popping', 'Sentries sweeping back and forth (sine)'],
      tryThis: 'Pick a different easing, then collect coins and compare how each one feels.',
      controls: `<label>Coin easing <select data-set="easing">${Object.keys(EASINGS).map(k => `<option>${k}</option>`).join('')}</select></label>`,
      screen() {
        const x = W - 170, y = 60, w = 150, h = 70;
        ctx.fillStyle = 'rgba(23,27,35,.9)'; ctx.fillRect(x - 6, y - 6, w + 12, h + 30);
        ctx.strokeStyle = '#2a3140'; ctx.strokeRect(x, y, w, h);
        ctx.strokeStyle = '#6cb8ff'; ctx.lineWidth = 2; ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const t = i / 40, e = EASINGS[settings.easing](t);
          const px = x + t * w, py = y + h - e * h;
          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.stroke();
        for (const f of flyers) {
          const t = clamp(f.t, 0, 1);
          circle(V(x + t * w, y + h - EASINGS[settings.easing](t) * h), 4, '#ffd166');
        }
        text(settings.easing, x, y + h + 18, '#9aa3b2', 11);
      },
      world() {
        for (const s of sentries) if (s.dead <= 0)
          text(`sin → ${f0(deg(s.facing - s.base))}°`, s.pos.x, s.pos.y + s.r + 18, '#ffb547', 11, 'center');
      },
      live() {
        const f = flyers[0];
        return `easing      ${settings.easing}\ncoins flying ${flyers.length}` +
          (f ? `\nt = ${f2(clamp(f.t, 0, 1))} → ease(t) = ${f2(EASINGS[settings.easing](clamp(f.t, 0, 1)))}` : '\n(collect a coin)');
      },
    },
    {
      id: 'vectors', key: '6', name: 'Vectors', chap: 'Chapter 11',
      formula: 'input = (right − left, down − up)\n|v| = √(x² + y²)\nnormalize(v) = v / |v|\nvelocity = normalize(input) × speed',
      used: ['All movement and velocity', 'Fixing faster diagonal movement', 'Enemies moving toward the player',
        'Knockback and homing missiles'],
      tryThis: 'Switch off "Normalize input" and hold W + D: your speed jumps from 230 to 325 px/s.',
      controls: `<label><input type="checkbox" data-set="normalize"> Normalize input</label>`,
      world() {
        arrow(player.pos, player.vel, '#5fd18b', `|v| = ${f0(len(player.vel))}`, 0.35);
        for (const c of chasers) arrow(c.pos, c.vel, 'rgba(255,107,107,.8)', null, 0.35);
      },
      live() {
        const i = player.input;
        return `input       (${f2(i.x)}, ${f2(i.y)})\n|input|     ${f2(len(i))}\nvelocity    (${f0(player.vel.x)}, ${f0(player.vel.y)})\nspeed |v|   ${f0(len(player.vel))} px/s`;
      },
    },
    {
      id: 'dot', key: '7', name: 'Dot product', chap: 'Chapter 12',
      formula: 'a · b = ax·bx + ay·by = |a| |b| cos θ\nseen if  f̂ · d̂ ≥ cos(fov / 2)\n        and |d| ≤ range',
      used: ['Guard vision cones in stealth games', 'Backstab and "attack from behind" checks',
        'Is the target in front of me?', 'Lighting: how much a surface faces the light'],
      tryThis: 'Walk around a sentry. When f̂ · d̂ rises above 0.87 (cos 30°) and you are in range, it fires.',
      world() {
        const th = Math.cos(Math.PI / 6);
        for (const s of sentries) {
          if (s.dead > 0) continue;
          arrow(s.pos, fromAngle(s.facing), '#ffb547', 'f̂', 60);
          const d = norm(sub(player.pos, s.pos));
          arrow(s.pos, d, '#6cb8ff', 'd̂', 60);
          text(`f̂·d̂ = ${f2(s.dotVal)} ${s.dotVal >= th ? '≥' : '<'} ${f2(th)}`, s.pos.x, s.pos.y - s.r - 12,
            s.seen ? '#ff6b6b' : '#e6e9ef', 12, 'center');
        }
      },
      live() {
        let best = null, bd = Infinity;
        for (const s of sentries) if (s.dead <= 0) { const d = dist(s.pos, player.pos); if (d < bd) { bd = d; best = s; } }
        if (!best) return 'all sentries destroyed';
        return `nearest sentry\n f̂·d̂        ${f2(best.dotVal)}\n cos(30°)    ${f2(Math.cos(Math.PI / 6))}\n distance    ${f0(bd)} / ${best.range}\n sees you?   ${best.seen ? 'YES' : 'no'}`;
      },
    },
    {
      id: 'collide', key: '8', name: 'Distance & collision', chap: 'Chapters 21 & 22',
      formula: 'd = √((x₂ − x₁)² + (y₂ − y₁)²)\nhit if d < r₁ + r₂\npickup if d < 34',
      used: ['Bullets hitting enemies', 'Collecting pickups inside a radius', 'Touch damage',
        'Finding the nearest enemy for aim assist'],
      tryThis: 'Get close to an enemy and watch d shrink toward r₁ + r₂ = 27.',
      world() {
        circle(player.pos, player.r, null, '#6cb8ff', 1);
        dashed(true); circle(player.pos, 34, null, 'rgba(255,209,102,.6)', 1); dashed(false);
        for (const c of chasers) circle(c.pos, c.r, null, '#ff6b6b', 1);
        const n = nearestChaser();
        if (n) {
          const d = dist(n.pos, player.pos);
          ctx.strokeStyle = d < n.r + player.r ? '#ff6b6b' : '#e6e9ef'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(player.pos.x, player.pos.y); ctx.lineTo(n.pos.x, n.pos.y); ctx.stroke();
          const m = mul(add(player.pos, n.pos), .5);
          text(`d = ${f0(d)}`, m.x, m.y - 8, '#e6e9ef', 12, 'center');
        }
      },
      live() {
        const n = nearestChaser();
        if (!n) return 'no enemies nearby';
        const d = dist(n.pos, player.pos);
        return `nearest enemy\n d          ${f1(d)}\n r₁ + r₂    ${n.r + player.r}\n touching?  ${d < n.r + player.r ? 'YES' : 'no'}\nenemies     ${chasers.length}`;
      },
    },
    {
      id: 'chance', key: '9', name: 'Probability', chap: 'Chapter 27',
      formula: 'P(item) = weight / total weight\nE[coins per kill] = Σ P(item) × coins\nP(crit) = 0.10',
      used: ['Loot tables and drop rates', 'Critical hits', 'Random spawn timing and positions',
        'Balancing rewards with expected value'],
      tryThis: 'Kill 30+ enemies and watch the observed rates move toward the expected ones.',
      live() {
        const total = LOOT.reduce((s, l) => s + l.w, 0);
        const rows = LOOT.map(l => {
          const exp = l.w / total, obs = lootTally.rolls ? lootTally[l.item] / lootTally.rolls : 0;
          return `${l.item.padEnd(8)} ${(exp * 100).toFixed(0).padStart(3)}%  ${(obs * 100).toFixed(0).padStart(3)}%`;
        }).join('\n');
        const ev = (35 * 1 + 10 * 3) / total;
        return `item     expect  seen\n${rows}\nrolls    ${lootTally.rolls}\nE[coins/kill] = ${f2(ev)}\ncrits    ${hits ? (crits / hits * 100).toFixed(0) : 0}% of ${hits} hits`;
      },
    },
  ];
  for (const l of LENSES) l.on = false;
  const lens = id => LENSES.find(l => l.id === id);
  function nearestChaser() {
    let best = null, bd = Infinity;
    for (const c of chasers) { const d = dist(c.pos, player.pos); if (d < bd) { bd = d; best = c; } }
    return best;
  }

  // ---------- Panel ----------
  const lensesEl = document.getElementById('lenses');
  const cardEl = document.getElementById('card');
  let selected = null, liveEl = null;

  for (const l of LENSES) {
    const b = document.createElement('button');
    b.className = 'lens';
    b.innerHTML = `<kbd>${l.key}</kbd>${l.name}`;
    b.addEventListener('click', () => toggleLens(l));
    l.btn = b;
    lensesEl.appendChild(b);
  }

  function toggleLens(l) {
    if (!l) return;
    if (l.on && selected === l) l.on = false; else l.on = true;
    selected = l.on ? l : LENSES.find(x => x.on) || null;
    for (const x of LENSES) { x.btn.classList.toggle('on', x.on); x.btn.classList.toggle('sel', x === selected); }
    renderCard();
  }

  function renderCard() {
    if (!selected) {
      cardEl.innerHTML = `<h2>No lens on</h2><p style="margin:0;color:var(--muted)">Pick a lens above (or press 0–9). Each one draws the math on top of the game and explains where that math is used in game development.</p>`;
      liveEl = null;
      return;
    }
    const l = selected;
    cardEl.innerHTML = `
      <h2>${l.name}</h2><span class="chap">${l.chap}</span>
      <div class="formula">${l.formula}</div>
      <h3>Where it's used in games</h3>
      <ul>${l.used.map(u => `<li>${u}</li>`).join('')}</ul>
      <h3>Try this</h3><div class="try">${l.tryThis}</div>
      ${l.controls ? `<div class="controls">${l.controls}</div>` : ''}
      <h3>Live numbers</h3><div class="live"></div>`;
    liveEl = cardEl.querySelector('.live');
    cardEl.querySelectorAll('[data-set]').forEach(el => {
      const key = el.dataset.set;
      if (el.type === 'checkbox') el.checked = settings[key];
      else el.value = settings[key];
      const showEl = cardEl.querySelector(`[data-show="${key}"]`);
      if (showEl) showEl.textContent = settings[key];
      el.addEventListener('input', () => {
        if (el.type === 'checkbox') settings[key] = el.checked;
        else if (el.tagName === 'SELECT' && key === 'easing') settings[key] = el.value;
        else settings[key] = parseFloat(el.value);
        if (showEl) showEl.textContent = settings[key];
      });
    });
    updateLive();
  }
  function updateLive() { if (liveEl && selected) liveEl.textContent = selected.live(); }
  renderCard();

  // ---------- Loop ----------
  let last = performance.now(), acc = 0, lastDt = 1 / 60, fpsShown = 60, liveTimer = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (settings.fps > 0) {               // simulate a slower display
      acc += dt;
      if (acc < 1 / settings.fps - 0.002) return;
      dt = acc; acc = 0;
    }
    dt = Math.min(dt, 0.1);               // clamp big gaps (e.g. after switching tabs)
    lastDt = dt;
    fpsShown += (1 / Math.max(dt, 1e-4) - fpsShown) * 0.1;
    if (started && !paused) update(settings.useDt ? dt : 1 / 60);
    render();
    liveTimer -= dt;
    if (liveTimer <= 0) { updateLive(); liveTimer = 0.1; }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
